<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 시작하기</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/auth.css" />
</head>
<body>

<div class="auth-page">

  <header class="auth-header">
    <img src="assets/bobi-logo.png" alt="BoBi" />
  </header>

  <main class="auth-main">
    <div class="auth-card">

      <div class="onb-illust-wrap">
        <img class="onb-illust" src="assets/bobi-mascot.svg" alt="" />
      </div>

      <div class="onb-eyebrow">실적을 올리는 영업의 힘</div>
      <h1 class="onb-title">가장 강력한 영업도구<br />보험의 비서 <b>보비</b></h1>

      <div class="onb-actions">
        <a class="onb-btn primary" href="index.html">로그인</a>
        <button class="onb-btn secondary" type="button">회원가입</button>
      </div>

    </div>
  </main>

  <footer class="auth-ft">
    <div>
      <div class="auth-ft-links">
        <button class="auth-ft-link">이용약관</button>
        <span class="auth-ft-sep">|</span>
        <button class="auth-ft-link bold">개인정보처리방침</button>
      </div>
      <div class="auth-ft-info">
        <p>주식회사 천호인터내셔널<span class="dot">·</span>대표 이승엽<span class="dot">·</span>사업자등록번호 342-81-00261</p>
        <p>대구광역시 중구 달구벌대로 1929, 2층 (대신동)</p>
      </div>
    </div>
    <div class="auth-ft-cs">
      <div class="cs-call">고객센터 <b>1644-0161</b></div>
      <div>운영시간 10:00 ~ 17:00</div>
      <div class="cs-mail"><a href="mailto:cs@weplat.co.kr">cs@weplat.co.kr</a></div>
    </div>
  </footer>

</div>

</body>
</html>
