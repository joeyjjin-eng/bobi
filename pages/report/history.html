<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 진료기록 조회 내역</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 페이지 레이아웃 오버라이드 — GNB 좌측 고정, 콘텐츠 화면 센터 정렬 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; }
  .cE .emain > * { width: 100%; max-width: 1192px; margin-left: 0; margin-right: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 페이지 타이틀 — 콘텐츠는 1192px 컬럼, 하단 구분선만 화면 꽉차게 ===== */
  .cE .hist-title-row { width: calc(100% + 72px) !important; max-width: none !important; margin: 0 -36px 28px; padding: 0 0 22px; border-bottom: 1px solid var(--line); }
  .cE .hist-title-inner { max-width: 1192px; margin: 0 auto; padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .cE .ht-l { display: flex; align-items: center; gap: 14px; }
  .cE .ht-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-deep); display: grid; place-items: center; flex: none; }
  .cE .ht-l h1 { font-size: var(--fs-h1); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .cE .ht-sub { font-size: var(--fs-option); color: var(--ink-3); margin-top: 2px; }
  .cE .new-rep-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand-grad); color: #fff; border: none; border-radius: var(--r-pill); padding: 12px 24px; font-family: inherit; font-size: var(--fs-body); font-weight: 700; cursor: pointer; box-shadow: var(--sh-brand); text-decoration: none; flex: none; letter-spacing: -0.01em; transition: filter .2s ease; }
  .cE .new-rep-btn:hover { filter: brightness(1.05); }

  /* ===== 검색바 (한 줄 카드) ===== */
  .cE .search-bar { background: #fff; border-radius: var(--r-md); border: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .cE .search-bar > .si-ic { color: var(--ink-4); flex: none; display: flex; }
  .cE .search-bar input { flex: 1; border: none; outline: none; font-size: var(--fs-body); color: var(--ink); background: transparent; font-family: inherit; }
  .cE .search-bar input::placeholder { color: var(--ink-4); }
  .cE .sb-divider { width: 1px; height: 20px; background: var(--line-strong); }
  .cE .period-popover { position: relative; }
  .cE .period-trigger { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: var(--fs-option); font-weight: 600; cursor: pointer; user-select: none; background: transparent; border: none; padding: 0; font-family: inherit; }
  .cE .period-trigger:hover { color: var(--ink); }
  .cE .period-trigger[aria-expanded="true"], .cE .period-trigger.has-value { color: var(--ink); }
  .cE .sb-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--brand); color: #fff; border: none; border-radius: var(--r-pill); padding: 10px 24px; font-size: var(--fs-body); font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: -0.01em; box-shadow: var(--sh-brand); transition: background-color .2s ease; flex: none; }
  .cE .sb-btn:hover { background: var(--brand-hover); }

  /* ===== 기간 선택 팝오버 ===== */
  .cE .period-popup { position: absolute; top: calc(100% + 12px); right: 0; z-index: 50; width: 460px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--sh-2); padding: 24px 26px 20px; }
  .cE .period-popup[hidden] { display: none; }
  .cE .pp-title { font-size: var(--fs-body); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin-bottom: 18px; }
  .cE .pp-range { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; margin-bottom: 20px; }
  .cE .pp-range .date-field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cE .pp-range .dlabel { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; padding-left: 2px; }
  .cE .pp-range .dateinput { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 10px 14px; background: #fff; cursor: pointer; transition: border-color .2s ease; }
  .cE .pp-range .dateinput:hover { border-color: var(--ink-3); }
  .cE .pp-range .dateinput input[type="date"] { border: none; outline: none; background: transparent; font-family: inherit; font-size: var(--fs-body); color: var(--ink); padding: 0; flex: 1; min-width: 0; cursor: pointer; }
  .cE .pp-range .dateinput input[type="date"]::-webkit-calendar-picker-indicator { display: none; }
  .cE .pp-range .dateinput svg { color: var(--ink-3); flex: none; }
  .cE .pp-range .dash { align-self: center; margin-top: 18px; color: var(--ink-3); padding: 0 4px; }

  .cE .pp-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .cE .pp-preset { background: #fff; border: 1px solid var(--line-strong); color: var(--ink-3); border-radius: var(--r-pill); padding: 7px 14px; font-size: var(--fs-option); font-weight: 600; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .pp-preset:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--ink-4); }
  .cE .pp-preset.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .cE .pp-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .cE .pp-clear { background: #fff; border: 1px solid var(--line-strong); color: var(--ink-3); border-radius: var(--r-pill); padding: 9px 20px; font-size: var(--fs-option); font-weight: 700; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .pp-clear:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--ink-4); }
  .cE .pp-apply { background: var(--brand); color: #fff; border: none; border-radius: var(--r-pill); padding: 9px 24px; font-size: var(--fs-option); font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: var(--sh-brand); transition: background-color .2s ease; }
  .cE .pp-apply:hover { background: var(--brand-hover); }

  /* ===== 필터바 (한 줄 카드) ===== */
  .cE .filter-bar { background: #fff; border-radius: var(--r-md); border: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  .cE .filter-group { display: flex; align-items: center; gap: 10px; }
  .cE .fg-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; }
  .cE .pills { display: flex; gap: 6px; }
  .cE .pill { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-3); border-radius: var(--r-pill); padding: 7px 14px; font-size: var(--fs-option); font-weight: 600; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .pill:hover { color: var(--ink-2); border-color: var(--ink-4); }
  .cE .pill.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .cE .fb-divider { width: 1px; height: 20px; background: var(--line-strong); }
  .cE .fb-count { margin-left: auto; font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .cE .fb-count b { color: var(--ink); font-weight: 800; }

  /* ===== 메인 그리드 ===== */
  .cE .main-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: stretch; min-height: 640px; }

  /* ===== 리스트 패널 — card-pad 톤 (border-radius: r-lg) ===== */
  .cE .list-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
  .cE .table-head { display: grid; grid-template-columns: 100px 200px 1fr 110px 28px; column-gap: 10px; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--bg-soft); flex-shrink: 0; }
  .cE .table-head span { font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; }
  .cE .table-head span.h-name { padding-right: 24px; }
  .cE .table-head span.h-dz { text-align: right; }
  .cE .table-head span.h-cost { text-align: right; }
  .cE .table-body { flex: 1; overflow-y: auto; }
  .cE .table-row { display: grid; grid-template-columns: 100px 200px 1fr 110px 28px; column-gap: 10px; align-items: center; padding: 18px 28px; cursor: pointer; transition: background-color 0.12s ease; position: relative; border-bottom: 1px solid var(--line); }
  .cE .table-row:last-child { border-bottom: none; }
  .cE .table-row:hover { background: var(--bg-warm); }
  .cE .table-row.on { background: var(--brand-pale); }
  .cE .table-row.on::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); border-radius: 0 3px 3px 0; }
  .cE .tr-date { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .cE .table-row.on .tr-date { padding-left: 6px; }
  .cE .tr-info { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; min-width: 0; padding-right: 24px; }
  .cE .tr-name { font-size: var(--fs-body); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .cE .table-row.on .tr-name { color: var(--brand-deep); }
  .cE .tr-meta { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; }
  .cE .tr-diseases { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0; justify-content: flex-end; }
  .cE .tr-cost { font-size: var(--fs-body); font-weight: 700; color: var(--ink); white-space: nowrap; text-align: right; }
  .cE .tr-go { color: var(--ink-4); display: flex; align-items: center; transition: color .12s ease, transform .12s ease; }
  .cE .table-row:hover .tr-go { color: var(--brand); transform: translateX(2px); }
  .cE .table-row.on .tr-go { color: var(--brand); }
  .cE .empty-list { padding: 60px 20px; text-align: center; font-size: var(--fs-body); color: var(--ink-3); }

  /* ===== 질환 칩 (typechip 톤에 맞춤) ===== */
  .cE .dz-chip { font-size: var(--fs-option); font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); white-space: nowrap; letter-spacing: -0.01em; }
  .cE .dz-cancer       { background: #FEF2F2; color: #C0392B; }
  .cE .dz-brain        { background: #FFF3E0; color: #C0550A; }
  .cE .dz-heart        { background: #FFF3E0; color: #C0550A; }
  .cE .dz-diabetes     { background: #F3F0FF; color: #5B21B6; }
  .cE .dz-hypertension { background: #F3F0FF; color: #5B21B6; }
  .cE .dz-musculo      { background: #EFF6FF; color: #1D6FA4; }
  .cE .dz-liver        { background: #F0FDF4; color: #166534; }
  .cE .dz-respiratory  { background: #F0FDFA; color: #0F766E; }
  .cE .dz-kidney       { background: #FFF1F2; color: #9F1239; }
  .cE .dz-mental       { background: #FDF4FF; color: #7E22CE; }

  /* ===== 페이지네이션 — .raw-pagination 패턴 그대로 ===== */
  .cE .pagination { border-top: 1px solid var(--line); padding: 20px 28px; display: flex; justify-content: center; gap: 6px; flex-shrink: 0; }
  .cE .pg-btn { min-width: 36px; height: 36px; padding: 0 11px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-family: inherit; font-size: var(--fs-option); font-weight: 600; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .cE .pg-btn:hover:not(.on):not(.dots) { background: var(--bg-soft); border-color: var(--line-strong); color: var(--ink); }
  .cE .pg-btn.on { background: var(--brand); color: #fff; border-color: var(--brand); cursor: default; }
  .cE .pg-btn.dots { border: none; cursor: default; background: transparent; color: var(--ink-4); min-width: 24px; padding: 0; }

  /* ===== 미리보기 패널 — card-pad 톤, 스크롤 시 sticky로 유지 ===== */
  .cE .preview-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s ease;
    position: sticky; top: 28px; align-self: start; min-height: 580px;
  }
  .cE .preview-panel.has { border-color: var(--brand); }

  /* 빈 상태 */
  .cE .preview-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px 24px; text-align: center; }
  .cE .pe-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-soft); display: grid; place-items: center; color: var(--ink-4); }
  .cE .pe-t { font-size: var(--fs-body); font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
  .cE .pe-d { font-size: var(--fs-option); color: var(--ink-3); line-height: 1.6; }

  /* 콘텐츠 */
  .cE .preview-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0; }
  .cE .ph-l { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .cE .ph-av { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-pale); display: grid; place-items: center; flex: none; font-weight: 800; font-size: var(--fs-h2); color: var(--brand-deep); }
  .cE .ph-name-link { font-weight: 800; font-size: var(--fs-h2); color: var(--ink); letter-spacing: -0.02em; text-decoration: none; border-bottom: 1px dashed var(--ink-4); padding-bottom: 1px; transition: color .2s ease, border-bottom-color .2s ease; }
  .cE .ph-name-link:hover { color: var(--brand-deep); border-bottom-color: var(--brand); }
  .cE .ph-chips { display: flex; gap: 6px; margin-top: 6px; }
  .cE .gender-chip { font-size: var(--fs-option); font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); display: inline-block; }
  .cE .gender-chip.f { background: #FEF0F0; color: #D96060; }
  .cE .gender-chip.m { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .age-chip { font-size: var(--fs-option); font-weight: 600; padding: 3px 10px; border-radius: var(--r-pill); background: var(--bg-soft); color: var(--ink-2); }
  .cE .ph-close { background: var(--bg-soft); border: none; border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; transition: background-color .15s ease, color .15s ease; }
  .cE .ph-close:hover { background: var(--line); color: var(--ink); }

  .cE .preview-body { padding: 16px 22px; display: flex; flex-direction: column; gap: 11px; flex: 1 1 0; min-height: 0; overflow: hidden; }
  .cE .pb-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cE .pb-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .cE .pb-v { font-size: var(--fs-option); font-weight: 600; color: var(--ink-2); }
  .cE .pb-v.em { font-size: var(--fs-body); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .cE .pb-age { color: var(--ink-3); font-weight: 500; margin-left: 2px; }
  .cE .pb-div { height: 1px; background: var(--line); margin: 2px 0; }
  .cE .pb-section-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; margin-bottom: 6px; }
  .cE .pb-dzlist { display: flex; flex-wrap: wrap; gap: 5px; }
  /* 주요 질환 행 — 라벨 좌, 칩 우 정렬 */
  .cE .pb-row-dz { align-items: flex-start; }
  .cE .pb-row-dz .pb-dzlist { flex: 1; justify-content: flex-end; }
  .cE .pb-memo { width: 100%; height: 56px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: var(--fs-option); color: var(--ink); font-family: inherit; resize: none; outline: none; background: var(--bg-soft); box-sizing: border-box; transition: border-color .2s ease; }
  .cE .pb-memo:focus { border-color: var(--brand); }

  /* 미청구보험금 조회 여부 배지 (인라인) */
  .cE .claim-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--r-pill); font-size: var(--fs-option); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .cE .claim-badge.done { background: #E7FAF6; color: #15967F; }
  .cE .claim-badge.undone { background: var(--bg-soft); color: var(--ink-3); }

  .cE .preview-cta { padding: 14px 22px 18px; flex-shrink: 0; border-top: 1px solid var(--line); background: #fff; }
  .cE .preview-cta a { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 20px; border-radius: var(--r-pill); background: var(--brand-grad); color: #fff; text-decoration: none; font-size: var(--fs-body); font-weight: 700; letter-spacing: -0.01em; box-sizing: border-box; box-shadow: var(--sh-brand); transition: filter .2s ease; }
  .cE .preview-cta a:hover { filter: brightness(1.05); }

  /* 애니메이션 + 패널 내부 flex 컬럼 (head 고정 / body 스크롤 / cta 고정) */
  @keyframes pvFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .cE .preview-enter { animation: pvFadeIn 0.18s ease both; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ============================================================
     반응형 — 960px 이하: 타이틀/검색바 스택, 테이블 → 카드 리스트
     ============================================================ */
  @media (max-width: 960px) {
    /* 타이틀 — 풀폭 라인 + 카드 패딩에 맞춰 음의 마진 조정 */
    .cE .hist-title-row { width: calc(100% + 32px) !important; margin: 0 -16px 16px !important; padding: 0 0 18px !important; }
    .cE .hist-title-inner { padding: 0 16px; flex-wrap: wrap; gap: 12px; }
    .cE .ht-l { gap: 12px; flex: 1; min-width: 0; }
    .cE .ht-ic { width: 38px; height: 38px; border-radius: 10px; }
    .cE .ht-l h1 { font-size: var(--fs-h2); }
    .cE .ht-sub { font-size: var(--fs-option); }
    .cE .new-rep-btn { width: 100%; justify-content: center; padding: 12px 18px; font-size: var(--fs-body); }

    /* 검색바 — 한 줄, 기간 버튼 라벨 축약 */
    .cE .search-bar { padding: 10px 14px; gap: 8px; border-radius: var(--r-sm); flex-wrap: wrap; }
    .cE .search-bar input { font-size: var(--fs-option); min-width: 0; flex: 1 1 140px; }
    .cE .sb-divider { display: none; }
    .cE .period-trigger { font-size: var(--fs-option); }

    /* 기간 선택 팝오버 → 바텀시트로 변환 (팝오버가 화면 밖 잘림 해결) */
    .cE .period-popover { position: static; }
    .cE .period-popup {
      position: fixed !important;
      left: 0 !important; right: 0 !important; bottom: 0 !important;
      top: auto !important;
      width: 100% !important;
      max-width: 520px !important;
      margin: 0 auto !important;
      max-height: 85vh !important;
      border-radius: 20px 20px 0 0 !important;
      padding: 22px 18px calc(18px + env(safe-area-inset-bottom, 0px)) !important;
      box-shadow: 0 -10px 32px rgba(8, 22, 32, .22) !important;
      z-index: 300 !important;
      overflow-y: auto;
    }
    .cE .period-popup:not([hidden]) {
      animation: ppSheetUp .28s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes ppSheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    /* 드래그 핸들 */
    .cE .period-popup::before {
      content: '';
      position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 4px;
      border-radius: 2px;
      background: var(--ink-4); opacity: .5;
    }
    /* 백드롭 */
    body:has(.period-popup:not([hidden]))::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(8, 22, 32, .45);
      z-index: 299;
      animation: ppBgIn .2s ease both;
    }
    @keyframes ppBgIn { from { opacity: 0; } to { opacity: 1; } }
    body:has(.period-popup:not([hidden])) { overflow: hidden; }

    /* 미리보기 패널 → 모바일 바텀시트 모달 (내용 길이에 맞춰 자동 축소) */
    .cE .preview-panel {

    /* 백드롭 — 바텀시트가 열렸을 때만 보임 */

    { date:'2026.06.05', name:'전도현', gender:'남', age:51, birth:'1975.03.09', cost:'678,200',  phone:'010-1111-2222', diseases:['당뇨','고혈압'], claimChecked:true },
    { date:'2026.06.04', name:'배수진', gender:'여', age:29, birth:'1997.07.25', cost:'124,500',  phone:'010-3333-4444', diseases:[], claimChecked:false },
    { date:'2026.06.04', name:'류재훈', gender:'남', age:68, birth:'1958.02.14', cost:'1,580,000', phone:'010-5555-6666', diseases:['암','신장질환'], claimChecked:true },
    { date:'2026.06.04', name:'임지영', gender:'여', age:41, birth:'1985.11.28', cost:'445,700',  phone:'010-7777-8888', diseases:['간질환'], claimChecked:false },

    { date:'2026.06.02', name:'허재민', gender:'남', age:45, birth:'1981.04.06', cost:'521,600',  phone:'010-5656-7878', diseases:['근골격계'], claimChecked:false }
  ];

  var DISEASE_CLASS = {
    '암': 'dz-cancer',
    '뇌혈관': 'dz-brain',
    '심장질환': 'dz-heart',
    '당뇨': 'dz-diabetes',
    '고혈압': 'dz-hypertension',
    '근골격계': 'dz-musculo',
    '간질환': 'dz-liver',
    '호흡기': 'dz-respiratory',
    '신장질환': 'dz-kidney',
    '정신건강': 'dz-mental'
  };

  var AGE_TEST = {
    '전체': function () { return true; },
    '20대': function (a) { return a >= 20 && a < 30; },
    '30대': function (a) { return a >= 30 && a < 40; },
    '40대': function (a) { return a >= 40 && a < 50; },
    '50대': function (a) { return a >= 50 && a < 60; },
    '60대+': function (a) { return a >= 60; }
  };

  var state = {
    gender: '전체',
    age: '전체',
    query: '',
    dateFrom: '',
    dateTo: '',
    selectedIdx: null
  };

  // 데모 기준일 — 데이터가 2026.06.xx 라서 "오늘"을 2026.06.10으로 고정
  var TODAY = new Date(2026, 5, 10);

  function filterList() {
    return ALL.filter(function (p) {
      var gOK = (state.gender === '전체') || (p.gender === state.gender);
      var aOK = AGE_TEST[state.age](p.age);
      var qOK = !state.query || p.name.indexOf(state.query) !== -1 || p.phone.indexOf(state.query) !== -1;
      var dOK = true;
      if (state.dateFrom || state.dateTo) {
        var pDate = p.date.replace(/\./g, '-'); // '2026.06.09' → '2026-06-09'
        if (state.dateFrom && pDate < state.dateFrom) dOK = false;
        if (state.dateTo && pDate > state.dateTo) dOK = false;
      }
      return gOK && aOK && qOK && dOK;
    });
  }

  function toInputDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function fmtDot(s) {
    return s ? s.replace(/-/g, '.') : '';
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function renderDiseaseChips(arr) {
    if (!arr || !arr.length) return '';
    return arr.map(function (d) {
      var cls = DISEASE_CLASS[d] || '';
      return '<span class="dz-chip ' + cls + '">' + escapeHTML(d) + '</span>';
    }).join('');
  }

  function renderTable() {
    var list = filterList();
    var body = document.getElementById('tbl-body');
    var countEl = document.getElementById('count');
    countEl.innerHTML = '총 <b>' + list.length + '명</b> 조회됨';

    if (list.length === 0) {
      body.innerHTML = '<div class="empty-list">조건에 맞는 고객이 없어요</div>';
      return;
    }

    body.innerHTML = list.map(function (p) {
      var origIdx = ALL.indexOf(p);
      var isSel = state.selectedIdx === origIdx;
      return ''
        + '<div class="table-row ' + (isSel ? 'on' : '') + '" data-idx="' + origIdx + '">'
        +   '<span class="tr-date">' + p.date + '</span>'
        +   '<div class="tr-info">'
        +     '<span class="tr-name">' + escapeHTML(p.name) + '</span>'
        +     '<span class="tr-meta">' + p.gender + '</span>'
        +     '<span class="tr-meta">' + p.age + '세</span>'
        +   '</div>'
        +   '<div class="tr-diseases">' + renderDiseaseChips(p.diseases) + '</div>'
        +   '<span class="tr-cost">' + p.cost + '원</span>'
        +   '<div class="tr-go"><svg class="ic-svg" width="16" height="16"><use href="#i-chevron-right"/></svg></div>'
        + '</div>';
    }).join('');

    body.querySelectorAll('.table-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var idx = parseInt(row.dataset.idx, 10);
        state.selectedIdx = (state.selectedIdx === idx) ? null : idx;
        renderTable();
        renderPreview();
      });
    });
  }

  // 모바일 바텀시트 — 백드롭 + body 스크롤 잠금
  var MOBILE_QUERY = window.matchMedia('(max-width: 960px)');
  function setMobileSheetOpen(open) {
    var backdrop = document.getElementById('preview-backdrop');
    if (!backdrop) return;
    if (open && MOBILE_QUERY.matches) {
      backdrop.classList.add('show');
      document.body.classList.add('preview-modal-open');
    } else {
      backdrop.classList.remove('show');
      document.body.classList.remove('preview-modal-open');
    }
  }

  function renderPreview() {
    var panel = document.getElementById('preview');

    if (state.selectedIdx === null || state.selectedIdx === undefined) {
      panel.classList.remove('has');
      setMobileSheetOpen(false);
      panel.innerHTML = ''
        + '<div class="preview-empty">'
        +   '<div class="pe-ic"><svg class="ic-svg" width="28" height="28"><use href="#i-user-2"/></svg></div>'
        +   '<div>'
        +     '<div class="pe-t">고객을 선택해 주세요</div>'
        +     '<div class="pe-d">좌측 목록에서 고객을<br/>클릭하면 여기에 표시돼요</div>'
        +   '</div>'
        + '</div>';
      return;
    }

    var p = ALL[state.selectedIdx];
    panel.classList.add('has');
    setMobileSheetOpen(true);
    var dzSection = '';
    if (p.diseases && p.diseases.length) {
      dzSection = ''
        + '<div class="pb-row pb-row-dz">'
        +   '<span class="pb-l">주요 질환</span>'
        +   '<div class="pb-dzlist">' + renderDiseaseChips(p.diseases) + '</div>'
        + '</div>';
    }

    panel.innerHTML = ''
      + '<div class="preview-enter">'
      +   '<div class="preview-head">'
      +     '<div class="ph-l">'
      +       '<div class="ph-av">' + escapeHTML(p.name[0]) + '</div>'
      +       '<div>'
      +         '<a class="ph-name-link" href="../customer/detail.html" title="고객 상세 보기">' + escapeHTML(p.name) + '</a>'
      +         '<div class="ph-chips">'
      +           '<span class="gender-chip ' + (p.gender === '여' ? 'f' : 'm') + '">' + p.gender + '</span>'
      +         '</div>'
      +       '</div>'
      +     '</div>'
      +     '<button class="ph-close" type="button" id="pv-close" aria-label="닫기"><svg class="ic-svg" width="14" height="14"><use href="#i-x"/></svg></button>'
      +   '</div>'
      +   '<div class="preview-body">'
      +     '<div class="pb-row"><span class="pb-l">조회일</span><span class="pb-v">' + p.date + '</span></div>'
      +     '<div class="pb-row"><span class="pb-l">생년월일</span><span class="pb-v">' + p.birth + ' <span class="pb-age">(만 ' + p.age + '세)</span></span></div>'
      +     '<div class="pb-row"><span class="pb-l">연락처</span><span class="pb-v">' + p.phone + '</span></div>'
      +     '<div class="pb-row"><span class="pb-l">최근 2년 의료비</span><span class="pb-v em">' + p.cost + '원</span></div>'
      +     '<div class="pb-row">'
      +       '<span class="pb-l">미청구보험금 조회</span>'
      +       (p.claimChecked
              ? '<span class="claim-badge done"><svg class="ic-svg" width="11" height="11"><use href="#i-check"/></svg> 조회 완료</span>'
              : '<span class="claim-badge undone">미조회</span>')
      +     '</div>'
      +     '<div class="pb-div"></div>'
      +     dzSection
      +     '<div>'
      +       '<div class="pb-section-l">메모</div>'
      +       '<textarea class="pb-memo" placeholder="이 고객에 대한 메모를 남겨보세요"></textarea>'
      +     '</div>'
      +   '</div>'
      +   '<div class="preview-cta">'
      +     '<a href="main.html">리포트 상세 보기 <svg class="ic-svg" width="14" height="14"><use href="#i-chevron-right"/></svg></a>'
      +   '</div>'
      + '</div>';

    document.getElementById('pv-close').addEventListener('click', function () {
      state.selectedIdx = null;
      renderTable();
      renderPreview();
    });
  }

  // ===== 이벤트 바인딩 =====
  document.querySelectorAll('#gender-pills .pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.gender = btn.dataset.gender;
      document.querySelectorAll('#gender-pills .pill').forEach(function (b) {
        b.classList.toggle('on', b.dataset.gender === state.gender);
      });
      state.selectedIdx = null;
      renderTable();
      renderPreview();
    });
  });

  document.querySelectorAll('#age-pills .pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.age = btn.dataset.age;
      document.querySelectorAll('#age-pills .pill').forEach(function (b) {
        b.classList.toggle('on', b.dataset.age === state.age);
      });
      state.selectedIdx = null;
      renderTable();
      renderPreview();
    });
  });

  // 검색 — 입력할 때마다 실시간 반영 (미청구 조회 내역과 동일 UX)
  document.getElementById('search-input').addEventListener('input', function (e) {
    state.query = e.target.value.trim();
    state.selectedIdx = null;
    renderTable();
    renderPreview();
  });

  // ===== 기간 선택 팝오버 =====
  var periodTrigger = document.getElementById('period-trigger');
  var periodPopup = document.getElementById('period-popup');
  var periodLabel = document.getElementById('period-label');
  var ppStart = document.getElementById('pp-start');
  var ppEnd = document.getElementById('pp-end');

  function openPopup() {
    periodPopup.hidden = false;
    periodTrigger.setAttribute('aria-expanded', 'true');
    ppStart.value = state.dateFrom || '';
    ppEnd.value = state.dateTo || '';
  }
  function closePopup() {
    periodPopup.hidden = true;
    periodTrigger.setAttribute('aria-expanded', 'false');
  }
  function updatePeriodLabel() {
    if (state.dateFrom || state.dateTo) {
      periodLabel.textContent = (fmtDot(state.dateFrom) || '시작일') + ' ~ ' + (fmtDot(state.dateTo) || '종료일');
      periodTrigger.classList.add('has-value');
    } else {
      periodLabel.textContent = '기간 선택';
      periodTrigger.classList.remove('has-value');
    }
  }
  function clearPresetActive() {
    document.querySelectorAll('.pp-preset').forEach(function (b) { b.classList.remove('on'); });
  }

  periodTrigger.addEventListener('click', function (e) {
    e.stopPropagation();
    if (periodPopup.hidden) openPopup(); else closePopup();
  });

  document.addEventListener('click', function (e) {
    if (!periodPopup.hidden && !periodPopup.contains(e.target) && !periodTrigger.contains(e.target)) {
      closePopup();
    }
  });

  // 프리셋 클릭 → 시작/종료 자동 채움
  document.querySelectorAll('.pp-preset').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var months = parseInt(btn.dataset.months, 10);
      var start = new Date(TODAY);
      start.setMonth(start.getMonth() - months);
      ppEnd.value = toInputDate(TODAY);
      ppStart.value = toInputDate(start);
      clearPresetActive();
      btn.classList.add('on');
    });
  });

  // 시작/종료 직접 변경 시 프리셋 active 해제
  ppStart.addEventListener('change', clearPresetActive);
  ppEnd.addEventListener('change', clearPresetActive);

  // 적용
  document.getElementById('pp-apply').addEventListener('click', function () {
    state.dateFrom = ppStart.value;
    state.dateTo = ppEnd.value;
    updatePeriodLabel();
    state.selectedIdx = null;
    renderTable();
    renderPreview();
    closePopup();
  });

  // 초기화
  document.getElementById('pp-clear').addEventListener('click', function () {
    ppStart.value = '';
    ppEnd.value = '';
    clearPresetActive();
    state.dateFrom = '';
    state.dateTo = '';
    updatePeriodLabel();
    state.selectedIdx = null;
    renderTable();
    renderPreview();
  });

  // 바텀시트 닫기 (백드롭 클릭 / ESC)
  var backdropEl = document.getElementById('preview-backdrop');
  if (backdropEl) {
    backdropEl.addEventListener('click', function () {
      state.selectedIdx = null;
      renderTable();
      renderPreview();
    });
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.selectedIdx !== null && MOBILE_QUERY.matches) {
      state.selectedIdx = null;
      renderTable();
      renderPreview();
    }
  });
  // 뷰포트가 데스크톱으로 넓어지면 body 잠금 해제
  MOBILE_QUERY.addEventListener('change', function (e) {
    if (!e.matches) setMobileSheetOpen(false);
    else if (state.selectedIdx !== null) setMobileSheetOpen(true);
  });

  // 초기 렌더
  renderTable();
  renderPreview();
})();
</script>

<script src="../../components/layout.js"></script>
<script>
  injectShell('report');
  document.querySelectorAll('[data-quota]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      if (!window.checkQuota(el.getAttribute('data-quota'))) e.preventDefault();
    });
  });
</script>
</body>
</html>
