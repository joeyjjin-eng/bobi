<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 재무상담</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<link rel="stylesheet" href="../../styles/consult.css" />
<style>
  html, body { margin: 0; background: #fff; }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain ct">

    <!-- ===== 타이틀 ===== -->
    <div class="ct-title-row">
      <div class="ct-title-ic"><svg class="ic-svg" width="22" height="22"><use href="#i-trending-up"/></svg></div>
      <div class="ct-title-txt">
        <h1>재무상담</h1>
        <div class="ct-title-sub">고객 <b id="t-total">0</b>명 · 진행 중 <b id="t-live">0</b>건 · 상담일 지남 <b id="t-late">0</b>건</div>
      </div>
      <div class="ct-title-act">
        <a class="ct-btn primary" href="basic.html?new=1">
          <svg class="ic-svg" width="16" height="16"><use href="#i-plus"/></svg>
          새로운 상담하기
        </a>
      </div>
    </div>

    <!-- ===== 검색 + 정렬 ===== -->
    <div class="search-bar">
      <span class="si-ic"><svg class="ic-svg" width="18" height="18"><use href="#i-search"/></svg></span>
      <input type="text" id="q" placeholder="고객 이름으로 검색" />
      <div class="sb-divider"></div>
      <div class="sort-select">
        <select id="f-sort">
          <option value="last">마지막 상담 최근순</option>
          <option value="first">최초 상담 오래된순</option>
          <option value="count">회차 많은순</option>
          <option value="name">이름순</option>
        </select>
        <svg class="ic-svg" width="12" height="12"><use href="#i-chevron-down"/></svg>
      </div>
    </div>

    <!-- ===== 필터 ===== -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="fg-l">상태</span>
        <div class="pills" id="p-status"></div>
      </div>
      <div class="fb-divider"></div>
      <div class="filter-group">
        <span class="fg-l">회차</span>
        <div class="pills" id="p-count"></div>
      </div>
      <div class="fb-divider"></div>
      <div class="filter-group">
        <span class="fg-l">최초 상담</span>
        <div class="pills" id="p-first"></div>
      </div>
      <span class="fb-count">
        <button class="fb-reset" id="reset" type="button" hidden>필터 초기화</button>
        총 <b id="c-shown">0명</b> 표시 중
      </span>
    </div>

    <!-- ===== 목록 ===== -->
    <div class="list-panel">
      <div class="table-head">
        <span>고객</span>
        <span>회차</span>
        <span></span>
        <span>최초 상담</span>
        <span>마지막 상담</span>
        <span>다음 상담</span>
        <span></span>
      </div>
      <div id="rows"></div>
      <div class="ct-empty" id="empty" hidden>조건에 맞는 고객이 없습니다</div>
    </div>

  </main>
</div>
</div>

<div id="footer-host"></div>

<script src="../../components/layout.js"></script>
<script src="_model.js"></script>
<script>
injectShell('consult');

// 샘플 상담이 들어 있는 고객은 그 상담을 담아 연다(_model.js 가 ?case= 를 읽는다)
const CASES = (window.CT && CT.caseNames) ? CT.caseNames() : [];
const resultHref = n => CASES.indexOf(n) >= 0 ? 'result.html?case=' + encodeURIComponent(n) : 'result.html';

const DATA = [
  { name:'김민준', first:'2026.07.21', last:'2026.09.28', next:'2026.10.26', st:'next', s:['07.21','08.25','09.28'] },
  { name:'이서연', first:'2026.07.30', last:'2026.09.29', next:'2026.11.02', st:'next', s:['07.30','08.28','09.29'] },
  { name:'박지훈', first:'2026.09.26', last:'2026.09.26', next:'', st:'none', s:['09.26'] },
  { name:'최수아', first:'2026.05.16', last:'2026.09.19', next:'2026.10.17', st:'next', s:['05.16','06.20','07.18','08.22','09.19'] },
  { name:'정도윤', first:'2026.07.26', last:'2026.08.30', next:'2026.10.02', st:'next', s:['07.26','08.30'] },
  { name:'한예린', first:'2025.11.08', last:'2026.09.06', next:'2026.10.05', st:'next', s:['11.08','12.13','2026.01.24','03.21','05.09','07.11','09.06'] },
  { name:'강태오', first:'2026.03.14', last:'2026.08.16', next:'2026.10.11', st:'next', s:['03.14','04.25','06.13','08.16'] },
  { name:'서하은', first:'2026.06.20', last:'2026.07.25', next:'', st:'none', s:['06.20','07.25'] },
  { name:'윤지아', first:'2026.07.12', last:'2026.07.12', next:'2026.08.09', st:'late', s:['07.12'] },
];

const STATUS = [['all','전체'],['live','진행 중'],['next','다음 상담 있음'],['none','다음 상담 없음'],['late','상담일 지남']];
const COUNT  = [['all','전체'],['1','1회차'],['2-4','2–4회차'],['5','5회차 이상']];
const FIRST  = [['all','전체'],['2026','2026년'],['2025','2025년']];

const S = { q:'', status:'all', count:'all', first:'all', sort:'last', open:null };
const $ = (id) => document.getElementById(id);

// 회차 날짜 — 연도가 생략된 항목은 최초/마지막 상담 연도로 채운다
function sessionsOf(d) {
  const longIdx = d.s.findIndex(x => x.length > 5);
  return d.s.map((x, i) => ({
    n: (i + 1) + '회차',
    date: x.length > 5 ? x
      : ((i === 0 || d.first.slice(0,4) === d.last.slice(0,4) || i < longIdx) ? d.first.slice(0,4) : d.last.slice(0,4)) + '.' + x
  })).reverse();
}

function matchCount(d) {
  return S.count === 'all' || (S.count === '1' ? d.s.length === 1
    : S.count === '5' ? d.s.length >= 5
    : d.s.length >= 2 && d.s.length <= 4);
}

function render() {
  // 칩 개수는 '그 필터만 뺀' 나머지 조건 기준으로 센다
  const byQ = d => !S.q || d.name.includes(S.q.trim());
  const byFirst = d => S.first === 'all' || d.first.startsWith(S.first);
  const byStatus = d => S.status === 'all' || d.st === S.status;

  const list = DATA.filter(d => byQ(d) && byFirst(d) && byStatus(d) && matchCount(d))
    .sort((a, b) => S.sort === 'name' ? a.name.localeCompare(b.name, 'ko')
      : S.sort === 'count' ? b.s.length - a.s.length
      : S.sort === 'first' ? a.first.localeCompare(b.first)
      : b.last.localeCompare(a.last));

  $('t-total').textContent = DATA.length;
  $('t-live').textContent = DATA.filter(d => d.st === 'live').length;
  $('t-late').textContent = DATA.filter(d => d.st === 'late').length;
  $('c-shown').textContent = list.length + '명';

  const pills = (host, defs, key, counter) => {
    $(host).innerHTML = defs.map(([k, label]) => {
      const c = counter(k);
      return '<button class="pill' + (S[key] === k ? ' on' : '') + '" type="button" data-k="' + k + '">'
        + label + '<span class="c">' + c + '</span></button>';
    }).join('');
  };
  pills('p-status', STATUS, 'status', k => DATA.filter(d => byQ(d) && byFirst(d) && matchCount(d) && (k === 'all' || d.st === k)).length);
  pills('p-count', COUNT, 'count', k => {
    const save = S.count; S.count = k;
    const n = DATA.filter(d => byQ(d) && byFirst(d) && byStatus(d) && matchCount(d)).length;
    S.count = save; return n;
  });
  pills('p-first', FIRST, 'first', k => DATA.filter(d => byQ(d) && byStatus(d) && matchCount(d) && (k === 'all' || d.first.startsWith(k))).length);

  $('reset').hidden = !(S.q || S.status !== 'all' || S.count !== 'all' || S.first !== 'all');
  $('empty').hidden = list.length > 0;

    $('rows').innerHTML = list.map(d => {
    const n = d.s.length, multi = n > 1, open = multi && S.open === d.name;
    const nxCls = d.st === 'late' ? ' late' : '';
    const row = '<div class="table-row clickable' + (open ? ' open' : '') + '" data-name="' + d.name + '">'
      + '<div class="tr-name"><div class="patient-avatar" data-name="' + d.name + '"></div><span class="nm">' + d.name + '</span></div>'
      + '<span class="tr-cnt">' + n + '회차</span>'
      + '<span></span>'
      + '<span class="tr-date">' + d.first + '</span>'
      + '<span class="tr-date">' + d.last + '</span>'
      + '<span class="tr-next' + nxCls + '">' + d.next + '</span>'
      // 2회차 이상이면 펼치기(∨/∧), 1회차면 바로 결과로(›)
      + '<span class="tr-go">' + (multi ? '<i class="ct-chev' + (open ? ' up' : '') + '"></i>' : '<i class="ct-chev right"></i>') + '</span>'
      + '</div>';
    const sub = open
      ? '<div class="row-sub">' + sessionsOf(d).map(s =>
          '<div class="ct-srow"><span class="n">' + s.n + '</span><span class="d">' + s.date + '</span>'
          + '<span></span><a href="' + resultHref(d.name) + '">결과 보기</a></div>').join('') + '</div>'
      : '';
    return row + sub;
  }).join('');

  window.paintPatientAvatars();
}

// 필터 칩
[['p-status','status'],['p-count','count'],['p-first','first']].forEach(([host, key]) => {
  $(host).addEventListener('click', e => {
    const el = e.target.closest('[data-k]');
    if (el) { S[key] = el.dataset.k; render(); }
  });
});
// 펼치기
$('rows').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-name]'); if (!el) return;
  const d = DATA.find(x => x.name === el.dataset.name);
  if (!d) return;
  if (d.s.length === 1) { location.href = resultHref(d.name); return; }
  if (d.s.length > 1) { S.open = S.open === d.name ? null : d.name; render(); }
});
$('q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('f-sort').addEventListener('change', e => { S.sort = e.target.value; render(); });
$('reset').addEventListener('click', () => {
  Object.assign(S, { q:'', status:'all', count:'all', first:'all' });
  $('q').value = ''; render();
});

render();
</script>

</body>
</html>
