<script src="_model.js"></script>
<script src="_actions.js"></script>
<script>
/* ===== 03 자산·부채 — 입력이 바로 순자산에 반영 ===== */
(function () {
  var M = CT.load();
  var gHost = document.getElementById('as-groups');
  var dHost = document.getElementById('debt-rows');

  function buildAssets() {
    gHost.innerHTML = Object.keys(M.as).map(function (g) {
      var sum = M.as[g].reduce(function (s, r) { return s + (Number(r[1]) || 0); }, 0);
      return '<div class="ct-ag">'
        + '<div class="gh">' + g + '<span data-gsum="' + g + '">' + CT.comma(sum) + '</span></div>'
        + M.as[g].map(function (r, i) {
            var sv = (CT.SAMPLE.as[g] && CT.SAMPLE.as[g][i]) ? CT.SAMPLE.as[g][i][1] : 0;
            return '<div class="gr"><span class="k">' + r[0] + '</span>'
              + '<div class="ct-in num' + (r[1] === null ? ' hint' : '') + '" data-hint="미입력"'
              + ' data-g="' + g + '" data-i="' + i + '" data-sample="' + sv + '">'
              + (r[1] === null ? '미입력' : CT.comma(r[1])) + '</div></div>';
          }).join('')
        + '</div>';
    }).join('');
    gHost.querySelectorAll('.ct-in[data-g]').forEach(function (el) {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('blur', function () {
        var v = CT.parse(el.textContent);
        M.as[el.dataset.g][Number(el.dataset.i)][1] = v;
        el.classList.toggle('hint', v === null);
        el.textContent = v === null ? '미입력' : CT.comma(v);
        commit();
      });
    });
  }

  function buildDebt() {
    dHost.innerHTML = M.debt.map(function (d, i) {
      var sd = CT.SAMPLE.debt[i] || {};
      // f: bal·pay = 만원 / rate = % / due = YYYY.MM
      function cell(f) {
        var v = d[f], s = sd[f];
        var isDue = (f === 'due'), empty = (v == null || v === '');
        var ph = isDue ? 'YYYY.MM' : '미입력';
        var mod = isDue ? ' num plain' : (f === 'rate' ? ' num pc' : ' num');
        return '<td class="amt"><div class="ct-in' + mod + (empty ? ' hint' : '') + '"'
          + ' data-hint="' + ph + '" data-d="' + i + '" data-f="' + f + '"'
          + (s == null || s === '' ? '' : ' data-sample="' + s + '"') + '>'
          + (empty ? ph : (isDue ? v : CT.comma(v))) + '</div></td>';
      }
      return '<tr>'
        + '<td class="nm"><div class="ct-in" data-d="' + i + '" data-f="name">' + d.name + '</div>'
        +   '<div class="ct-in" data-d="' + i + '" data-f="at" style="min-height:30px;padding:2px 14px;border:none;font-size:var(--fs-option);color:var(--ink-3);">' + d.at + '</div></td>'
        + cell('bal') + cell('pay') + cell('rate') + cell('due')
        + '<td class="del" data-act="ddel" data-d="' + i + '">삭제</td>'
        + '</tr>';
    }).join('')
      + '<tr class="addrow"><td colspan="6" class="ct-add" id="debt-add">+ 부채 추가</td></tr>';
    dHost.querySelectorAll('.ct-in[data-d]').forEach(function (el) {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('blur', function () {
        var d = M.debt[Number(el.dataset.d)], f = el.dataset.f;
        if (!d) return;
        if (f === 'name' || f === 'at') { d[f] = el.textContent.trim(); }
        else if (f === 'due') {
          var t = el.textContent.trim();
          d.due = (t === 'YYYY.MM') ? '' : t;
          el.classList.toggle('hint', !d.due);
          el.textContent = d.due || 'YYYY.MM';
        }
        else {
          d[f] = CT.parse(el.textContent);
          el.classList.toggle('hint', d[f] === null);
          el.textContent = d[f] === null ? '미입력' : CT.comma(d[f]);
        }
        commit();
      });
    });
  }

  function commit() { CT.save(M); paint(); }
  function paint() {
    var c = CT.calc(M);
    document.getElementById('as-assets').textContent = CT.comma(c.assets);
    document.getElementById('as-liab').textContent   = CT.comma(c.liab);
    document.getElementById('as-net').textContent    = CT.comma(c.net);
    document.getElementById('debt-bal').textContent  = CT.comma(c.liab);
    document.getElementById('debt-pay').textContent  = CT.comma(c.debtPay);
    Object.keys(M.as).forEach(function (g) {
      var el = gHost.querySelector('[data-gsum="' + g + '"]');
      if (el) el.textContent = CT.comma(M.as[g].reduce(function (s, r) { return s + (Number(r[1]) || 0); }, 0));
    });
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('#debt-add')) {
      M.debt.push({ name: '새 부채', at: '', bal: 0, pay: 0, rate: 0, due: '' });
      buildDebt(); commit(); return;
    }
    var del = e.target.closest('td[data-act="ddel"]');
    if (del) { M.debt.splice(Number(del.dataset.d), 1); buildDebt(); commit(); return; }
  }, true);

  buildAssets();
  buildDebt();
  paint();
})();
</script>

</body>
