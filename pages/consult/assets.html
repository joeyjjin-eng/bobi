<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 재무상담 · 자산·부채</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<link rel="stylesheet" href="../../styles/consult.css" />
<style>
  html, body { margin: 0; background: #fff; }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain ct">

    <a class="back-btn" href="index.html">
      <svg class="ic-svg" width="14" height="14"><use href="#i-chevron-left"/></svg> 재무상담 목록
    </a>

    <div class="ct-title-row">
      <div class="ct-title-ic"><svg class="ic-svg" width="22" height="22"><use href="#i-trending-up"/></svg></div>
      <div class="ct-title-txt">
        <h1>재무상담</h1>
        <div class="ct-title-sub">새로운 상담하기</div>
      </div>
    </div>

    <div class="ct-steps">
      <a class="ct-step done" href="basic.html"><span class="n">01</span>기본정보</a>
      <div class="bar"></div>
      <a class="ct-step done" href="cashflow.html"><span class="n">02</span>수입지출</a>
      <div class="bar"></div>
      <a class="ct-step on" href="assets.html"><span class="n">03</span>자산·부채</a>
      <div class="bar"></div>
      <a class="ct-step" href="wrapup.html"><span class="n">04</span>상담정리</a>
      <div class="split"></div>
      <a class="ct-step fin" href="result.html"><span class="n"><svg class="ic-svg" width="14" height="14"><use href="#i-file-text"/></svg></span>상담결과</a>
    </div>

    <!-- 적는 잔액이 전부 이 날짜 기준이다. .emain 이 가운데 정렬이라 감싸는 줄을 하나 둔다. -->
    <div style="margin-bottom:20px;">
      <div class="ct-f" style="width:220px;">
        <span class="lb">기준일<span class="req"> 필수</span></span>
        <input type="date" class="ct-nat" id="as-date" aria-label="기준일" />
      </div>
    </div>

    <div class="finance-body">
      <aside class="ct-tot finance-index" id="as-index" aria-label="자산·부채 입력 상태"></aside>

      <div>
      <!-- 자산 -->
      <div class="ct-panel finance-section" id="assets-section" data-finance-section="자산">
        <h2 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:0 0 4px;color:var(--ink);">가진 것</h2>
        <div id="as-groups"></div>
      </div>

      <!-- 부채 -->
      <div class="ct-panel finance-section" id="debt-section" data-finance-section="부채" style="margin-bottom:0;">
        <div class="ct-card-h" style="margin-bottom:14px;">
          <h2 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--ink);">갚을 것</h2>
          <span class="ct-note">월 납입금은 02 부채상환에 반영</span>
        </div>
        <div class="debt-list">
          <div id="debt-rows"></div>
          <div class="debt-add">
            <span class="ct-add" id="debt-add">+ 부채 추가</span>
            <!-- 매달 갚지 않는 빚 — 월 납입금 칸이 없고 만기에 한 번에 갚는다.
                 종류를 고르고 눌러 넣는다. -->
            <span class="debt-lump-add">
              <select class="ct-nat" id="debt-lump-kind" aria-label="매달 갚지 않는 빚 종류"></select>
              <span class="ct-add" id="debt-lump">+ 매달 갚지 않는 빚 추가</span>
            </span>
          </div>
        </div>
      </div>

      <!-- 시안처럼 맨 아래에 세 값을 한 줄로 모아 둔다 -->
      <div class="ct-hint" id="as-sum" style="margin-top:20px;"></div>
      </div>
    </div>

    <div class="ct-navrow" style="margin-top:20px;">
      <a class="ct-btn ghost" href="cashflow.html">
        <svg class="ic-svg" width="16" height="16"><use href="#i-chevron-left"/></svg> 이전
      </a>
      <a class="ct-btn primary" href="wrapup.html">다음 · 04 상담정리
        <svg class="ic-svg" width="16" height="16"><use href="#i-arrow-right"/></svg>
      </a>
    </div>

  </main>
</div>
</div>

<div id="footer-host"></div>

<script src="../../components/layout.js"></script>
<script>injectShell('consult');</script>
<script src="_model.js"></script>
<script src="_actions.js"></script>
<script>
/* ===== 03 자산·부채 — 입력이 바로 순자산에 반영 ===== */
(function () {
  var M = CT.load();
  var gHost = document.getElementById('as-groups');
  var dHost = document.getElementById('debt-rows');
  var idx = document.getElementById('as-index');
  var activeSection = '자산';

  /* 기준일 — 적는 잔액이 전부 이 날짜 기준이다.
     저장하지 않으면 재무재표·상담결과가 코드에 박힌 날짜를 보여 주게 된다. */
  (function () {
    var el = document.getElementById('as-date');
    if (!el) return;
    el.value = M.asDate || '';
    function put() { M.asDate = el.value; CT.save(M); }
    el.addEventListener('change', put);
    el.addEventListener('blur', put);
  })();

  function buildIndex() {
    var c = CT.calc(M);
    var h = '<div class="finance-index-section"><div class="index-group"><div class="finance-index-label"><strong>가진 것</strong></div>';
    Object.keys(M.as).forEach(function (g) {
      h += '<div class="nav-row index-child' + (activeSection === g ? ' on' : '') + '" data-section="' + g + '" data-go="asset-' + Object.keys(M.as).indexOf(g) + '"><span>' + nameOf(g) + '</span>' + money(assetTotal(g)) + '</div>';
    });
    h += '<div class="nav-row index-sum"><span>합계</span>' + money(c.assets) + '</div></div>';
    h += '<div class="index-group"><div class="finance-index-label"><strong>갚을 것</strong></div>'
      + '<div class="nav-row index-child' + (activeSection === '부채' ? ' on' : '') + '" data-section="부채" data-go="debt-section"><span>빚 목록</span>' + money(c.liab) + '</div></div></div>';
    idx.innerHTML = h;
  }

  /* 묶음 이름은 시안(인수인계_20260927) 그대로 쓴다.
     모델 키('유동자산'·'금융자산'…)는 비상금·상담결과가 같이 읽으므로 바꾸지 않는다. */
  var NAME = {
    '유동자산': '바로 쓸 수 있는 돈',
    '금융자산': '모아 둔 돈',
    '연금자산': '노후 돈',
    '부동산·차량': '집·차',
    '기타자산': '기타'
  };
  function nameOf(g) { return NAME[g] || g; }

  function money(value) {
    return '<span class="row-value">' + CT.comma(value) + '<span class="unit">만원</span></span>';
  }
  function assetTotal(group) {
    return M.as[group].reduce(function (sum, row) { return sum + (Number(row[1]) || 0); }, 0);
  }
  function buildAssets() {
    gHost.innerHTML = Object.keys(M.as).map(function (g) {
      return '<section class="cf-sec finance-section finance-flat-group" id="asset-' + Object.keys(M.as).indexOf(g) + '" data-asset-group="' + g + '">'
        + '<div class="ct-card-h finance-flat-heading"><h3 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:0;color:var(--ink);">' + nameOf(g) + '</h3></div>'
        + '<div class="finance-grid-head finance-asset-row"><span>항목 · 기준일 잔액</span><span style="text-align:right;">현재 · 만원</span><span></span></div>'
        + M.as[g].map(function (r, i) {
            return '<div class="finance-asset-row"><div class="finance-item-name"><div class="ct-in" data-g="' + g + '" data-i="' + i + '" data-af="name">' + r[0] + '</div></div>'
              + '<div class="ct-in num' + (r[1] === null ? ' hint' : '') + '" data-hint="미입력" data-g="' + g + '" data-i="' + i + '" data-af="value">'
              + (r[1] === null ? '미입력' : CT.comma(r[1])) + '</div>'
              + '<button type="button" class="del finance-delete" data-act="adel" data-g="' + g + '" data-i="' + i + '" aria-label="항목 삭제"><svg class="ic-svg" width="11" height="11"><use href="#i-x"/></svg></button></div>';
          }).join('')
        + '<div class="ct-add finance-flat-add" data-addasset="' + g + '"><button type="button">+ 항목 추가</button></div>'
        + '</section>';
    }).join('');
    gHost.querySelectorAll('.ct-in[data-g]').forEach(function (el) {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('focus', function () {
        if (el.classList.contains('hint')) { el.textContent = ''; el.classList.remove('hint'); }
      });
      el.addEventListener('blur', function () {
        var row = M.as[el.dataset.g][Number(el.dataset.i)];
        if (el.dataset.af === 'name') {
          row[0] = el.textContent.trim() || '이름 없음';
          el.textContent = row[0];
        } else {
          var v = CT.parse(el.textContent);
          row[1] = v;
          el.classList.toggle('hint', v === null);
          el.textContent = v === null ? '미입력' : CT.comma(v);
        }
        commit();
      });
    });
  }

  (function () {
    var sel = document.getElementById('debt-lump-kind');
    if (sel) sel.innerHTML = CT.DEBT_LUMP.map(function (k) { return '<option>' + k + '</option>'; }).join('');
  })();

  function buildDebt() {
    dHost.innerHTML = M.debt.map(function (d, i) {
      // 칸은 기획 문서와 같은 다섯 개: 빚 이름 · 남은 돈 · 월 납입금 · 금리(연 %) · 만기.
      // '이번 달 원금·이자'는 따로 받지 않는다. 월 납입금과 어긋나게 적을 수 있는데
      // 그러면 현금흐름표(월 납입금)와 결산(이자)이 서로 다른 말을 하게 된다.
      // 이자는 남은 돈 × 금리 ÷ 12 로 계산한다(CT.calc).
      // bal·pay = 만원 / rate = % / due = YYYY.MM
      function cell(f) {
        var v = d[f], isDue = (f === 'due'), empty = (v == null || v === '');
        var ph  = isDue ? 'YYYY.MM' : '미입력';
        var mod = isDue ? ' num plain' : (f === 'rate' ? ' num pc' : ' num');
        return '<div class="ct-in' + mod + (empty ? ' hint' : '') + '" data-hint="' + ph + '" data-d="' + i + '" data-f="' + f + '">'
          + (empty ? ph : (isDue ? v : CT.comma(v))) + '</div>';
      }
      return '<div class="debt-card">'
        + '<div class="debt-identity">'
        +   (d.lump ? '<span class="debt-tag">매달 갚지 않는 빚</span>' : '')
        +   '<div class="ct-in" data-hint="부채 이름" data-d="' + i + '" data-f="name">' + d.name + '</div>'
        +   '<div class="ct-in at' + (!d.at ? ' hint' : '') + '" data-hint="금융사" data-d="' + i + '" data-f="at">' + (d.at || '금융사') + '</div>'
        +   '<button type="button" class="del finance-delete with-label" data-act="ddel" data-d="' + i + '"><svg class="ic-svg" width="12" height="12"><use href="#i-trash"/></svg><span class="tx">삭제</span></button>'
        + '</div><div class="debt-fields">'
        +   '<div class="debt-field"><span class="lb">남은 돈</span>' + cell('bal') + '</div>'
        +   (d.lump ? '' : '<div class="debt-field"><span class="lb">월 납입금</span>' + cell('pay') + '</div>')
        +   '<div class="debt-field"><span class="lb">금리(연 %)</span>' + cell('rate') + '</div>'
        +   '<div class="debt-field"><span class="lb">만기</span>' + cell('due') + '</div>'
        + '</div></div>';
    }).join('') || '<div class="ct-note" style="padding:20px 0;">등록된 부채 없음 · 아래에서 추가합니다</div>';
    dHost.querySelectorAll('.ct-in[data-d]').forEach(function (el) {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('focus', function () {
        if (el.classList.contains('hint')) { el.textContent = ''; el.classList.remove('hint'); }
      });
      el.addEventListener('blur', function () {
        var d = M.debt[Number(el.dataset.d)], f = el.dataset.f;
        if (!d) return;
        if (f === 'name' || f === 'at') {
          d[f] = el.textContent.trim();
          if (!d[f]) { el.textContent = el.dataset.hint || (f === 'name' ? '부채 이름' : '금융사'); el.classList.add('hint'); }
        }
        else if (f === 'due') {
          var t = el.textContent.trim();
          d.due = (t === 'YYYY.MM') ? '' : t;
          el.classList.toggle('hint', !d.due);
          el.textContent = d.due || 'YYYY.MM';
        }
        else {
          d[f] = CT.parse(el.textContent);
          el.classList.toggle('hint', d[f] === null);
          el.textContent = d[f] === null ? '미입력' : CT.comma(d[f]);
        }
        commit();
      });
    });
  }

  function commit() { CT.save(M); paint(); }
  function paint() {
    buildIndex();
    var c = CT.calc(M);
    document.getElementById('as-sum').textContent =
      '가진 것 ' + CT.comma(c.assets) + '만원 · 갚을 것 ' + CT.comma(c.liab) + '만원 · 순자산 ' + CT.comma(c.net) + '만원';
  }

  document.addEventListener('click', function (e) {
    var go = e.target.closest('#as-index [data-go]');
    if (go) {
      var target = document.getElementById(go.dataset.go);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (e.target.closest('#debt-add')) {
      M.debt.push({ name: '새 부채', at: '', bal: null, pay: null, rate: null, due: '' });
      buildDebt(); commit(); return;
    }
    if (e.target.closest('#debt-lump')) {
      var kind = document.getElementById('debt-lump-kind').value || CT.DEBT_LUMP[0];
      M.debt.push({ name: kind, at: '', bal: null, pay: null, rate: null, due: '', lump: true });
      buildDebt(); commit(); return;
    }
    // 자산 항목 삭제 · 추가
    var ad = e.target.closest('[data-act="adel"]');
    if (ad) {
      M.as[ad.dataset.g].splice(Number(ad.dataset.i), 1);
      commit(); buildAssets(); return;
    }
    var aa = e.target.closest('[data-addasset]');
    if (aa) {
      M.as[aa.dataset.addasset].push(['새 항목', null]);
      commit(); buildAssets(); return;
    }

    var del = e.target.closest('[data-act="ddel"]');
    if (del) { M.debt.splice(Number(del.dataset.d), 1); buildDebt(); commit(); return; }
  }, true);

  buildAssets();
  buildDebt();
  paint();

  if ('IntersectionObserver' in window) {
    var sectionObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          activeSection = entry.target.dataset.assetGroup || entry.target.dataset.financeSection;
          buildIndex();
        }
      });
    }, { rootMargin: '-12% 0px -68% 0px', threshold: 0 });
    gHost.querySelectorAll('[data-asset-group]').forEach(function (section) { sectionObserver.observe(section); });
    sectionObserver.observe(document.getElementById('debt-section'));
  }
})();
</script>

</body>
</html>
