<script>
/* ===== 02 수입지출 — 묶음 전체를 세로로 펼쳐 놓고 바로 입력 ===== */
(function () {
  var M = CT.load();
  var idx = document.getElementById('cf-index');
  var host = document.getElementById('cf-sections');

  function secId(cat) { return 'cf-' + CT.ORDER.indexOf(cat); }

  /* ---------- 오른쪽: 대분류 → 중분류 → 항목 위계 ---------- */
  function buildSections() {
    host.innerHTML = domain('수입', category('수입', false))
      + domain('지출', subgroup('고정지출', CT.FIXED) + subgroup('변동지출', CT.VARI))
      + domain('저축·투자', category('저축', false))
      + domain('일시자금', category('일시 수입', true) + category('일시 지출', true));
    host.querySelectorAll('[data-cat]').forEach(bindRows);
  }

  function domain(title, content) {
    return '<section class="ct-panel finance-domain"><h2 class="finance-domain-title">' + title + '</h2>' + content + '</section>';
  }

  function subgroup(title, cats) {
    return '<section class="finance-subgroup"><h3 class="finance-subgroup-title">' + title + '</h3>'
      + cats.map(function (cat) { return category(cat, true); }).join('') + '</section>';
  }

  function category(cat, showTitle) {
    return '<section class="cf-sec finance-section finance-flat-group" id="' + secId(cat) + '" data-finance-section="' + cat + '">'
        + (showTitle ? '<div class="ct-card-h finance-flat-heading"><h4 class="finance-category-title">' + cat + '</h4></div>' : '')
        + '<div class="finance-grid-head finance-grid-row" data-cat-head="' + cat + '"><span>항목</span><span>현재</span><span data-toggle-target="goal" hidden>목표</span><span></span></div>'
        + '<div class="finance-flat-rows" data-cat="' + cat + '">' + rowsOf(cat) + '</div>'
        + '</section>';
  }

  function rowsOf(cat) {
    var c = M.cf[cat];
    return c.items.map(function (r, i) {
      var isCustom = r[3] === true || r[0] === '새 항목';
      return '<div class="finance-input-row finance-grid-row">'
        + '<div class="finance-item-name' + (isCustom ? ' is-custom' : '') + '"><div class="ct-in" data-f="name" data-i="' + i + '" data-custom="' + isCustom + '">' + r[0] + '</div></div>'
        + '<div class="ct-in num' + (r[1] === null ? ' hint' : '') + '" data-hint="미입력" data-f="now" data-i="' + i + '">' + (r[1] === null ? '미입력' : CT.comma(r[1])) + '</div>'
        + '<div data-toggle-target="goal" hidden><div class="ct-in num soft' + (r[2] === null ? ' hint' : '') + '" data-hint="미입력" data-f="goal" data-i="' + i + '">' + (r[2] === null ? '미입력' : CT.comma(r[2])) + '</div></div>'
        + '<button type="button" class="del finance-delete" data-act="del" aria-label="항목 삭제"><svg class="ic-svg" width="11" height="11"><use href="#i-x"/></svg></button>'
        + '</div>';
    }).join('')
      + '<div class="ct-add finance-flat-add" data-addcat="' + cat + '"><button type="button">+ 항목 추가</button></div>';
  }

  // 입력 칸을 모델에 연결한다
  function bindRows(tb) {
    var cat = tb.dataset.cat;
    tb.querySelectorAll('.ct-in[data-f]').forEach(function (el) {
      if (el.dataset.f === 'name' && el.dataset.custom !== 'true') return;
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('focus', function () {
        if (el.classList.contains('hint')) { el.textContent = ''; el.classList.remove('hint'); }
      });
      el.addEventListener('blur', function () {
        var i = Number(el.dataset.i), f = el.dataset.f, items = M.cf[cat].items;
        if (!items[i]) return;
        if (f === 'name') {
          items[i][0] = el.textContent.trim() || '이름 없음';
          items[i][3] = true;
          el.textContent = items[i][0];
        } else {
          var v = CT.parse(el.textContent);
          items[i][f === 'now' ? 1 : 2] = v;
          if (v === null) { el.textContent = '미입력'; el.classList.add('hint'); }
          else { el.textContent = CT.comma(v); el.classList.remove('hint'); }
        }
        commit();
      });
    });
  }

  /* ---------- 왼쪽: 묶음 색인 ---------- */
  function buildIndex() {
    var h = '<div class="finance-index-section">';
    h += leaf('수입', '수입');
    h += group('지출', CT.FIXED.concat(CT.VARI), [child('고정지출', '고정지출'), child('변동지출', '변동지출')], CT.FIXED[0]);
    h += leaf('저축·투자', '저축');
    h += group('일시자금', ['일시 수입', '일시 지출'], [child('일시수입', '일시수입'), child('일시지출', '일시지출')], '일시 수입');
    h += '</div>';
    idx.innerHTML = h;
    syncActiveIndex();
  }
  function total(cats) {
    return cats.reduce(function (sum, cat) { return sum + CT.catTotal(M, cat); }, 0);
  }
  function money(value) {
    return '<span class="row-value">' + CT.comma(value) + '<span class="unit">만원</span></span>';
  }
  function group(label, cats, children, goCat) {
    return '<div class="index-group"><div class="index-parent" data-go="' + secId(goCat) + '"><span>' + label + '</span>' + money(total(cats)) + '</div>' + children.join('') + '</div>';
  }
  function leaf(label, key) {
    return '<div class="index-group"><div class="nav-row index-parent' + (activeGroup === key ? ' on' : '') + '" data-group="' + key + '" data-go="' + secId(key) + '"><span>' + label + '</span>' + money(total([key])) + '</div></div>';
  }
  function child(label, key) {
    var cats = key === '고정지출' ? CT.FIXED : key === '변동지출' ? CT.VARI : key === '일시수입' ? ['일시 수입'] : key === '일시지출' ? ['일시 지출'] : [key];
    return '<div class="nav-row index-child" data-group="' + key + '" data-go="' + secId(cats[0]) + '"><span>' + label + '</span>' + money(total(cats)) + '</div>';
  }

  var activeGroup = '수입';
  function groupOf(cat) {
    if (cat === '수입') return '수입';
    if (cat === '일시 수입') return '일시수입';
    if (cat === '일시 지출') return '일시지출';
    if (cat === '저축') return '저축';
    if (CT.FIXED.indexOf(cat) >= 0) return '고정지출';
    return '변동지출';
  }
  function syncActiveIndex() {
    idx.querySelectorAll('.nav-row[data-group]').forEach(function (row) {
      row.classList.toggle('on', row.dataset.group === activeGroup);
    });
  }
  function observeSections() {
    if (!('IntersectionObserver' in window)) return;
    var sectionObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { activeGroup = groupOf(entry.target.dataset.financeSection); syncActiveIndex(); }
      });
    }, { rootMargin: '-12% 0px -68% 0px', threshold: 0 });
    host.querySelectorAll('[data-finance-section]').forEach(function (section) { sectionObserver.observe(section); });
  }

  /* ---------- 합계 다시 계산 ---------- */
  function commit() {
    CT.save(M);
    paint();
  }
  function paint() {
    buildIndex();
    // 원 단위로 적은 것 같은 값 경고
    var big = null;
    Object.keys(M.cf).forEach(function (cat) {
      M.cf[cat].items.forEach(function (r) { if (r[1] !== null && r[1] >= 100000 && !big) big = [r[0], r[1]]; });
    });
    var w = document.getElementById('unit-warn');
    w.hidden = !big;
    if (big) document.getElementById('unit-warn-txt').textContent =
      big[0] + ' ' + CT.comma(big[1]) + '만원 (약 ' + Math.round(big[1] / 10000) + '억원)';
  }

  /* ---------- 클릭 ---------- */
  document.addEventListener('click', function (e) {
    var go = e.target.closest('#cf-index [data-go]');
    if (go) {
      var target = document.getElementById(go.dataset.go);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var add = e.target.closest('.ct-add[data-addcat]');
    if (add) {
      var cat = add.dataset.addcat;
      M.cf[cat].items.push(['새 항목', null, null, true]);
      var tb = host.querySelector('[data-cat="' + cat + '"]');
      tb.innerHTML = rowsOf(cat);
      bindRows(tb);
      commit();
      var last = tb.querySelectorAll('.ct-in[data-f="name"]');
      if (last.length) last[last.length - 1].focus();
      return;
    }
    var del = e.target.closest('#cf-sections [data-act="del"]');
    if (del) {
      var tb2 = del.closest('[data-cat]'), cat2 = tb2.dataset.cat;
      var row = del.closest('.finance-input-row');
      var nameInput = row && row.querySelector('.ct-in[data-f="name"]');
      var i = nameInput ? Number(nameInput.dataset.i) : -1;
      if (i >= 0) { M.cf[cat2].items.splice(i, 1); tb2.innerHTML = rowsOf(cat2); bindRows(tb2); commit(); }
      return;
    }
  }, true);

  buildSections();
  observeSections();
  paint();
})();
</script>
