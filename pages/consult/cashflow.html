<script src="_model.js"></script>
<script src="_actions.js"></script>
<script>
/* ===== 02 수입지출 — 묶음 전체를 세로로 펼쳐 놓고 바로 입력 ===== */
(function () {
  var M = CT.load();
  var idx = document.getElementById('cf-index');
  var host = document.getElementById('cf-sections');

  function secId(cat) { return 'cf-' + CT.ORDER.indexOf(cat); }

  /* ---------- 오른쪽: 묶음별 입력표 ---------- */
  function buildSections() {
    host.innerHTML = CT.ORDER.map(function (cat) {
      var c = M.cf[cat];
      return '<div class="cf-sec" id="' + secId(cat) + '">'
        + '<div class="ct-card-h" style="margin-bottom:12px;">'
        +   '<div><div class="ct-eyebrow">' + c.grp + '</div>'
        +   '<h3 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:4px 0 0;color:var(--ink);">' + cat + '</h3></div>'
        + '</div>'
        + '<div class="ct-tbl-wrap"><table class="ct-tbl"><thead><tr>'
        +   '<th>항목</th><th class="amt" style="width:170px;">현재</th>'
        +   '<th class="amt" style="width:170px;" data-toggle-target="goal" hidden>목표</th>'
        +   '<th style="width:60px;"></th>'
        + '</tr></thead><tbody data-cat="' + cat + '">' + rowsOf(cat) + '</tbody>'
        + '<tfoot><tr><td>' + cat + ' 소계</td>'
        +   '<td class="amt" data-tot="' + cat + '">0</td>'
        +   '<td class="amt" data-toggle-target="goal" hidden data-totg="' + cat + '">0</td>'
        +   '<td></td>'
        + '</tr></tfoot></table></div></div>';
    }).join('');
    host.querySelectorAll('tbody[data-cat]').forEach(bindRows);
  }

  function rowsOf(cat) {
    var c = M.cf[cat];
    var sm = (CT.SAMPLE.cf[cat] || {}).items || [];
    return c.items.map(function (r, i) {
      // data-sample: 입력칸에 마우스를 올리면 채워 넣을 시뮬레이션 값
      var s = sm[i] || [];
      return '<tr>'
        + '<td class="nm"><div class="ct-in" data-f="name" data-i="' + i + '">' + r[0] + '</div></td>'
        + '<td class="amt"><div class="ct-in num' + (r[1] === null ? ' hint' : '') + '" data-hint="미입력" data-f="now" data-i="' + i + '"'
        +   (s[1] === null || s[1] === undefined ? '' : ' data-sample="' + s[1] + '"') + '>'
        +   (r[1] === null ? '미입력' : CT.comma(r[1])) + '</div></td>'
        + '<td class="amt" data-toggle-target="goal" hidden><div class="ct-in num soft' + (r[2] === null ? ' hint' : '') + '" data-hint="미입력" data-f="goal" data-i="' + i + '"'
        +   (s[2] === null || s[2] === undefined ? '' : ' data-sample="' + s[2] + '"') + '>'
        +   (r[2] === null ? '미입력' : CT.comma(r[2])) + '</div></td>'
        + '<td class="del" data-act="del" style="width:60px;">삭제</td>'
        + '</tr>';
    }).join('')
      + '<tr class="addrow"><td colspan="4" class="ct-add" data-addcat="' + cat + '">+ 항목 추가</td></tr>';
  }

  // 입력 칸을 모델에 연결한다
  function bindRows(tb) {
    var cat = tb.dataset.cat;
    tb.querySelectorAll('.ct-in[data-f]').forEach(function (el) {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('focus', function () {
        if (el.classList.contains('hint')) { el.textContent = ''; el.classList.remove('hint'); }
      });
      el.addEventListener('blur', function () {
        var i = Number(el.dataset.i), f = el.dataset.f, items = M.cf[cat].items;
        if (!items[i]) return;
        if (f === 'name') {
          items[i][0] = el.textContent.trim() || '이름 없음';
          el.textContent = items[i][0];
        } else {
          var v = CT.parse(el.textContent);
          items[i][f === 'now' ? 1 : 2] = v;
          if (v === null) { el.textContent = '미입력'; el.classList.add('hint'); }
          else { el.textContent = CT.comma(v); el.classList.remove('hint'); }
        }
        commit();
      });
    });
  }

  /* ---------- 왼쪽: 묶음 색인 ---------- */
  function buildIndex() {
    var c = CT.calc(M);
    var h = '';
    h += line('수입', c.income, 'hd', c.incomeUnknown);
    h += '<div class="gl tp">고정지출</div>';
    CT.FIXED.forEach(function (k) { h += line(k, CT.catTotal(M, k), 'li'); });
    h += '<div class="li sum">소계<span>' + CT.comma(c.fixed) + '</span></div>';
    h += '<div class="gl">변동지출</div>';
    CT.VARI.forEach(function (k) { h += line(k, CT.catTotal(M, k), 'li'); });
    h += '<div class="li sum">소계<span>' + CT.comma(c.vari) + '</span></div>';
    h += '<div class="hd tp" style="cursor:default;">부채상환<span>' + CT.comma(c.debtPay) + '</span></div>';
    h += '<div class="ct-note" style="padding:0 12px 8px;">03 자산·부채에서 입력</div>';
    h += line('저축', c.saving, 'hd');
    h += '<div class="gl tp">일시 수입·지출</div>';
    h += line('일시 수입', CT.catTotal(M, '일시 수입'), 'li');
    h += line('일시 지출', CT.catTotal(M, '일시 지출'), 'li');
    idx.innerHTML = h;
  }
  function line(cat, val, cls, unk) {
    return '<div class="' + cls + '" data-go="' + secId(cat) + '">' + cat
      + '<span>' + CT.comma(val)
      + (unk ? '<span class="wk"> · 미입력 ' + unk + '건 제외</span>' : '')
      + '</span></div>';
  }

  /* ---------- 합계 다시 계산 ---------- */
  function commit() {
    CT.save(M);
    paint();
  }
  function paint() {
    var c = CT.calc(M);
    document.getElementById('sum-income').textContent  = CT.comma(c.income);
    document.getElementById('sum-expense').textContent = CT.comma(c.expense);
    document.getElementById('sum-balance').textContent = CT.comma(c.balance);
    CT.ORDER.forEach(function (cat) {
      var t = host.querySelector('[data-tot="' + cat + '"]');
      var g = host.querySelector('[data-totg="' + cat + '"]');
      if (t) t.textContent = CT.comma(CT.catTotal(M, cat, 1));
      if (g) g.textContent = CT.comma(CT.catTotal(M, cat, 2));
    });
    buildIndex();
    // 원 단위로 적은 것 같은 값 경고
    var big = null;
    Object.keys(M.cf).forEach(function (cat) {
      M.cf[cat].items.forEach(function (r) { if (r[1] !== null && r[1] >= 100000 && !big) big = [r[0], r[1]]; });
    });
    var w = document.getElementById('unit-warn');
    w.hidden = !big;
    if (big) document.getElementById('unit-warn-txt').textContent =
      big[0] + ' ' + CT.comma(big[1]) + '만원 (약 ' + Math.round(big[1] / 10000) + '억원)';
  }

  /* ---------- 클릭 ---------- */
  document.addEventListener('click', function (e) {
    var go = e.target.closest('#cf-index [data-go]');
    if (go) {
      var el = document.getElementById(go.dataset.go);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var add = e.target.closest('.ct-add[data-addcat]');
    if (add) {
      var cat = add.dataset.addcat;
      M.cf[cat].items.push(['새 항목', null, null]);
      var tb = host.querySelector('tbody[data-cat="' + cat + '"]');
      tb.innerHTML = rowsOf(cat);
      bindRows(tb);
      commit();
      var last = tb.querySelectorAll('.ct-in[data-f="name"]');
      if (last.length) last[last.length - 1].focus();
      return;
    }
    var del = e.target.closest('#cf-sections td[data-act="del"]');
    if (del) {
      var tb2 = del.closest('tbody'), cat2 = tb2.dataset.cat;
      var i = Number(del.previousElementSibling.querySelector('.ct-in') ? del.parentNode.querySelector('.ct-in[data-f="name"]').dataset.i : -1);
      if (i >= 0) { M.cf[cat2].items.splice(i, 1); tb2.innerHTML = rowsOf(cat2); bindRows(tb2); commit(); }
      return;
    }
  }, true);

  buildSections();
  paint();
})();
</script>

</body>
</html>
