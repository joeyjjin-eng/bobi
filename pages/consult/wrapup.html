    <div class="ct-title-row">

      <a class="ct-step on" href="wrapup.html"><span class="n">04</span>상담정리</a>

      <a class="ct-step fin" href="result.html"><span class="n"><svg class="ic-svg" width="14" height="14"><use href="#i-file-text"/></svg></span>상담결과</a>
    </div>

    <!-- ===== 설계사가 적는 칸 =====
         시안(04 상담 정리) 그대로입니다. 여기 적은 문장이 상담결과 요약에 그대로 나갑니다. -->
    <div class="ct-panel">
      <h2 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:0 0 20px;color:var(--ink);">설계사가 적는 칸</h2>

      <div class="ct-hint" style="margin-bottom:20px;">상담을 마치며 설계사가 적습니다. 상담결과 화면에 적은 그대로 고객에게 보입니다.</div>

      <!-- 02·03 금액을 고치면 결론을 다시 확인해야 한다 -->
      <div class="ct-warn" id="wu-stale" style="margin-bottom:20px;" hidden>
        <b>숫자가 바뀌었습니다.</b> 적어 둔 결론 문장을 다시 확인해 주세요.
        확인하기 전까지 고객 화면에는 “오늘의 결론은 상담사가 정리해 드립니다”로 보입니다.
      </div>

      <div class="in" style="display:flex;flex-direction:column;gap:20px;">
        <div class="ct-f">
          <span class="lb st">오늘의 결론</span>
          <textarea class="ct-nat" id="wu-conclusion" placeholder="상담하며 함께 정리한 문장을 적습니다."></textarea>
        </div>

        <div class="ct-f">
          <span class="lb st">고민에 대한 오늘의 답</span>
          <span class="ct-note" id="wu-wish">고민 · 01 기본정보에 적은 상담목표가 여기 표시됩니다</span>
          <textarea class="ct-nat" id="wu-answer" placeholder="고객이 물은 것에 대한 답을 적습니다."></textarea>
        </div>

        <div class="ct-f">
          <span class="lb st">AI 평가</span>
          <div class="ct-in" style="color:var(--ink-4);">API 연동 시 표시</div>
        </div>

        <div class="ct-f" style="max-width:260px;">
          <span class="lb st">다음 상담일</span>
          <input type="date" class="ct-nat" id="wu-next" aria-label="다음 상담일" />
        </div>
      </div>

    <div class="ct-navrow" style="margin-top:20px;">

      <a class="ct-btn primary" href="result.html">상담결과 보기

<script src="../../components/layout.js"></script>
<script>injectShell('consult');</script>
<script src="_model.js"></script>
<script src="_actions.js"></script>
<script>
/* 적은 문장과 다음 상담일을 모델에 담아 상담결과가 그대로 읽게 한다. */
(function () {
  var M = CT.load();
  M.wrap = M.wrap || { conclusion: '', answer: '', next: '' };
  var $ = function (id) { return document.getElementById(id); };
  var map = { 'wu-conclusion': 'conclusion', 'wu-answer': 'answer', 'wu-next': 'next' };

  Object.keys(map).forEach(function (id) {
    var el = $(id), key = map[id];
    el.value = M.wrap[key] || '';
    el.addEventListener('change', function () { M.wrap[key] = el.value; CT.save(M); });
    el.addEventListener('blur',   function () { M.wrap[key] = el.value; CT.save(M); });
  });
})();
</script>

</body>
