<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 재무상담 · 기본정보</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<link rel="stylesheet" href="../../styles/consult.css" />

  html, body { margin: 0; background: #fff; }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain ct">

    <a class="back-btn" href="index.html">
      <svg class="ic-svg" width="14" height="14"><use href="#i-chevron-left"/></svg> 재무상담 목록
    </a>

    <div class="ct-title-row">
      <div class="ct-title-ic"><svg class="ic-svg" width="22" height="22"><use href="#i-trending-up"/></svg></div>
      <div class="ct-title-txt">
        <h1>재무상담</h1>
        <div class="ct-title-sub">새로운 상담하기</div>
      </div>
    </div>

    <!-- ===== 단계 ===== -->
    <div class="ct-steps">
      <a class="ct-step on" href="basic.html"><span class="n">01</span>기본정보</a>
      <div class="bar"></div>
      <a class="ct-step" href="cashflow.html"><span class="n">02</span>수입지출</a>
      <div class="bar"></div>
      <a class="ct-step" href="assets.html"><span class="n">03</span>자산·부채</a>
      <div class="bar"></div>
      <a class="ct-step" href="wrapup.html"><span class="n">04</span>상담정리</a>
      <div class="split"></div>
      <a class="ct-step fin" href="result.html"><span class="n"><svg class="ic-svg" width="14" height="14"><use href="#i-file-text"/></svg></span>상담결과</a>
    </div>

    <!-- ===== 가구 정보 =====
         항목 이름·순서·입력 성격은 시안(bovi-v1.html customerForm) 그대로입니다.
         필수는 이름·상담일 둘뿐이고 나머지는 선택입니다. -->
    <div class="ct-panel">
      <h2 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:0 0 20px;color:var(--ink);">가구 정보</h2>
      <div>
        <div class="in" style="display:flex;flex-direction:column;gap:20px;">
          <div class="ct-g2">
            <div class="ct-f"><span class="lb">이름<span class="req"> 필수</span></span>
              <div class="ct-in" id="bs-name" data-hint="예) 김민준"></div></div>
            <div class="ct-f"><span class="lb">상담일<span class="req"> 필수</span></span>
              <input type="date" class="ct-nat" id="bs-date" aria-label="상담일" /></div>
            <div class="ct-f"><span class="lb">주 소득자 직업<span class="opt"> 선택</span></span>
              <div class="ct-in" id="bs-job" data-hint="예) 회사원"></div></div>
            <div class="ct-f"><span class="lb">배우자 직업<span class="opt"> 선택</span></span>
              <div class="ct-in" id="bs-spouse-job" data-hint="미해당 시 공란"></div></div>
            <!-- 주거 형태 — '기타'를 고르면 같은 칸을 둘로 갈라 직접 적는 칸을 연다.
                 칸을 새로 만들면 옆자리 '수입은 매달 비슷한가요?'가 아래로 밀려 줄이 통째로 바뀐다. -->
            <div class="ct-f"><span class="lb">주거 형태<span class="opt"> 선택</span></span>
              <div class="ct-pair" id="housing-pair">
                <select class="ct-nat" id="housing" aria-label="주거 형태">
                  <option value="">미입력</option>
                  <option>자가</option><option>전세</option><option>월세</option><option>기타</option>
                </select>
                <div class="ct-in" id="bs-housing-etc" data-hint="예) 부모님 집, 사택" aria-label="기타 주거 형태" hidden></div>
              </div></div>
            <div class="ct-f"><span class="lb">수입은 매달 비슷한가요?<span class="opt"> 선택</span></span>
              <div class="ct-in" id="bs-income-steady" data-hint="예) 매월 비슷함"></div></div>
          </div>


          <!-- 가족 구성 — 시안처럼 접어 둔다 -->
          <details class="ct-det">
            <summary>가족 구성 <span class="opt">선택</span></summary>
            <div class="in">
              <div>
                <table class="ct-tbl">
                  <thead>
                    <tr><th style="width:110px;">관계</th><th style="width:150px;">이름·호칭</th><th class="ctr" style="width:120px;">나이</th><th>직업·학교</th><th>비고</th><th style="width:70px;"></th></tr>
                  </thead>
                  <tbody id="fam-rows">
                    <tr>
                      <td class="nm"><div class="ct-in hint" data-hint="관계">관계</div></td>
                      <td><div class="ct-in hint" data-hint="이름·호칭">이름·호칭</div></td>
                      <td class="ctr"><input type="number" class="ct-nat sm" min="0" max="120" placeholder="나이" aria-label="나이" /></td>
                      <td><div class="ct-in hint" data-hint="직업·학교">직업·학교</div></td>
                      <td><div class="ct-in hint" data-hint="비고">비고</div></td>
                      <td class="del" data-act="del">삭제</td>
                    </tr>
                    <tr class="addrow" data-addrow><td colspan="6" class="ct-add" data-add="tpl-fam">+ 가족 추가</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </details>
          <template id="tpl-fam" data-row-for="fam-rows">
            <tr>
              <td class="nm"><div class="ct-in hint" data-hint="관계">관계</div></td>
              <td><div class="ct-in hint" data-hint="이름·호칭">이름·호칭</div></td>
              <td class="ctr"><input type="number" class="ct-nat sm" min="0" max="120" placeholder="나이" aria-label="나이" /></td>
              <td><div class="ct-in hint" data-hint="직업·학교">직업·학교</div></td>
              <td><div class="ct-in hint" data-hint="비고">비고</div></td>
              <td class="del" data-act="del">삭제</td>
            </tr>
          </template>
        </div>
      </div>
    </div>

    <!-- ===== 상담목표 — 오늘 무엇을 풀러 왔는지 ===== -->
    <div class="ct-panel">
      <h2 style="font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.02em;margin:0 0 20px;color:var(--ink);">상담목표</h2>
      <div class="in" style="display:flex;flex-direction:column;gap:20px;">
          <div class="ct-f"><span class="lb">오늘 가장 궁금하거나 걱정되는 것은요?</span>
            <textarea class="ct-nat" id="bs-wish" placeholder="예) 매달 버는 만큼 모이지 않는 것 같아요."></textarea></div>
          <div class="ct-f"><span class="lb">유지해야 되는 지출이 있나요?</span>
            <textarea class="ct-nat" id="bs-keep" placeholder="예) 아이 교육비는 유지하고 싶어요."></textarea></div>
          <div class="ct-f"><span class="lb">앞으로 달라질 일</span>
            <textarea class="ct-nat" id="bs-change" placeholder="예) 내년 봄 이사를 검토 중이에요."></textarea></div>
      </div>
    </div>

    <div class="ct-navrow end">
      <a class="ct-btn primary" href="cashflow.html">다음 · 02 수입지출
        <svg class="ic-svg" width="16" height="16"><use href="#i-arrow-right"/></svg>
      </a>
    </div>

  </main>
</div>
</div>

<div id="footer-host"></div>

<script src="../../components/layout.js"></script>
<script>injectShell('consult');</script>
<script src="_model.js"></script>
<script src="_actions.js"></script>
<script>
/* 새로 작성하기 — 01 기본정보가 상담의 입구다.
   여기서 저장된 값을 비우지 않으면 localStorage 에 남은 지난 상담이 그대로 읽혀,
   아무것도 안 적었는데 04·상담결과에 지난번 목표와 금액이 남는다. */
(function () {
  if (new URLSearchParams(location.search).get('new') !== '1') return;

  if (window.CT) CT.reset();

  // 새로고침 때 적던 값을 다시 지우지 않도록 주소에서 플래그를 뗀다
  if (history.replaceState) history.replaceState(null, '', location.pathname);
})();

/* 01 에 적은 것은 전부 모델에 담는다.
   담지 않으면 02 로 넘어갔다 돌아오는 순간 사라지고,
   '01 기본정보 기준'이라고 적힌 혜택 화면의 가구 조건도 읽을 값이 없다.
   CT.load() 를 두 번 부르면 각자 다른 M 을 들고 서로 덮어쓰므로 한 블록에서 다 한다. */
(function () {
  var M = CT.load();
  var B = M.basic = M.basic || {};
  if (!B.family) B.family = [];

  /* 칸 종류가 섞여 있다(.ct-in 은 contenteditable, 나머지는 네이티브).
     읽고 쓰는 방법만 다르고 나머지는 같으므로 여기서 한 번만 가른다. */
  function read(el) {
    if (el.tagName === 'DIV') return el.classList.contains('hint') ? '' : el.textContent.trim();
    return (el.value || '').trim();
  }
  function write(el, v) {
    if (el.tagName !== 'DIV') { el.value = v || ''; return; }
    if (v) { el.textContent = v; el.classList.remove('hint'); }
    else if (el.dataset.hint) { el.textContent = el.dataset.hint; el.classList.add('hint'); }
    else el.textContent = '';
  }

  var MAP = {
    'bs-name': 'name', 'bs-date': 'date', 'bs-job': 'job', 'bs-spouse-job': 'spouseJob',
    'housing': 'housing', 'bs-housing-etc': 'housingEtc', 'bs-income-steady': 'incomeSteady',
    'bs-wish': 'wish', 'bs-keep': 'keep', 'bs-change': 'change'
  };
  Object.keys(MAP).forEach(function (id) {
    var el = document.getElementById(id), key = MAP[id];
    if (!el) return;
    write(el, B[key]);
    function put() { B[key] = read(el); CT.save(M); }
    el.addEventListener('change', put);
    el.addEventListener('blur', put);
  });

  /* ----- 가족 구성 ----- */
  var host = document.getElementById('fam-rows');
  var addCell = host && host.querySelector('[data-add="tpl-fam"]');
  function famRows() {
    return Array.prototype.slice.call(host.querySelectorAll('tr:not([data-addrow])'));
  }
  function cells(tr) {
    var d = tr.querySelectorAll('.ct-in'), age = tr.querySelector('input[type="number"]');
    return { rel: d[0], name: d[1], age: age, job: d[2], note: d[3] };
  }
  function collect() {
    B.family = famRows().map(function (tr) {
      var c = cells(tr);
      return { rel: read(c.rel), name: read(c.name), age: read(c.age), job: read(c.job), note: read(c.note) };
    }).filter(function (r) { return r.rel || r.name || r.age || r.job || r.note; });
    CT.save(M);
  }

  // 저장해 둔 줄 수만큼 '가족 추가'를 눌러 칸을 늘린다.
  // 직접 복제하면 _actions.js 가 걸어 주는 편집 동작이 빠진다.
  if (host && addCell) {
    while (famRows().length < B.family.length) addCell.click();
    famRows().forEach(function (tr, i) {
      var v = B.family[i]; if (!v) return;
      var c = cells(tr);
      write(c.rel, v.rel); write(c.name, v.name); write(c.age, v.age);
      write(c.job, v.job); write(c.note, v.note);
    });
    // 적는 즉시 담는다. 줄을 더하거나 지우는 것도 같이 본다.
    host.addEventListener('blur', collect, true);
    host.addEventListener('change', collect, true);
    if (window.MutationObserver) new MutationObserver(collect).observe(host, { childList: true });
  }
})();

/* 주거 형태에서 '기타'를 고를 때만 직접 적는 칸을 연다(시안과 같음).
   칸을 새로 만들지 않고 한 칸을 둘로 가른다 — 옆줄이 밀려나지 않게. */
(function () {
  var sel = document.getElementById('housing');
  var pair = document.getElementById('housing-pair');
  var etc = document.getElementById('bs-housing-etc');
  if (!sel || !pair || !etc) return;
  function sync() {
    var on = sel.value === '기타';
    pair.classList.toggle('split', on);
    etc.hidden = !on;
  }
  sel.addEventListener('change', sync);
  sync();
})();
</script>

</body>
</html>
