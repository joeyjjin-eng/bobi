<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 보험금청구</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 페이지 레이아웃 오버라이드 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; }
  .cE .emain > * { width: 100%; max-width: 1192px; margin-left: 0; margin-right: 0; min-width: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 페이지 타이틀 (보험금청구 — 바이올렛 톤) ===== */
  .cE .hist-title-row { width: calc(100% + 72px) !important; max-width: none !important; margin: 0 -36px 28px; padding: 0 0 22px; border-bottom: 1px solid var(--line); }
  .cE .hist-title-inner { max-width: 1192px; margin: 0 auto; padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .cE .ht-l { display: flex; align-items: center; gap: 14px; }
  .cE .ht-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--c-surg-bg); color: var(--c-surg); display: grid; place-items: center; flex: none; }
  .cE .ht-l h1 { font-size: var(--fs-h1); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .cE .ht-sub { font-size: var(--fs-option); color: var(--ink-3); margin-top: 2px; }
  .cE .ht-sub b { color: var(--ink); font-weight: 800; }
  .cE .ht-sub .ok { color: #0E9A85; font-weight: 800; }
  .cE .ht-actions { display: inline-flex; align-items: center; gap: 8px; flex: none; }
  .cE .add-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #B491FF 0%, #9360F7 45%, #6A3FD1 100%); color: #fff; border: none; border-radius: var(--r-pill); padding: 12px 24px; font-family: inherit; font-size: var(--fs-body); font-weight: 700; cursor: pointer; box-shadow: 0 10px 30px rgba(147, 96, 247, 0.32); text-decoration: none; letter-spacing: -0.01em; transition: filter .2s ease; }
  .cE .add-btn:hover { filter: brightness(1.05); }

  /* ===== 검색바 내 안내 링크 ===== */
  .cE .sb-help { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .cE .sb-help-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 6px 10px; border-radius: 8px; font-family: inherit; font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: background-color .12s ease, color .12s ease; }
  .cE .sb-help-btn:hover { background: var(--bg-soft); color: var(--brand-deep); }
  .cE .sb-help-btn svg { color: var(--ink-3); transition: color .12s ease; }
  .cE .sb-help-btn:hover svg { color: var(--brand); }

  /* ===== KPI 4개 카드 ===== */
  .cE .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .cE .kpi-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 22px; display: flex; flex-direction: column; min-width: 0; }
  .cE .kc-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; display: inline-flex; align-items: center; gap: 7px; letter-spacing: -0.01em; }
  .cE .kc-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .cE .kc-dot.ink { background: var(--ink); }
  .cE .kc-dot.brand { background: var(--brand); }
  .cE .kc-dot.warn { background: #E0445A; }
  .cE .kc-dot.surg { background: var(--c-surg); }
  .cE .kc-v { font-size: var(--fs-h1); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 12px; white-space: nowrap; color: var(--ink); }
  .cE .kc-v small { font-size: var(--fs-body); font-weight: 700; color: var(--ink-3); margin-left: 4px; }
  .cE .kc-v.brand { color: var(--brand-deep); }
  .cE .kc-v.warn { color: #E0445A; }
  .cE .kc-v.surg { color: var(--c-surg); }
  .cE .kc-sub { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; margin-top: 8px; }

  /* ===== 검색 + 필터바 ===== */
  /* 검색바는 sticky — 리스트가 길어져도 안내 링크가 계속 보이게 */
  .cE .search-bar { background: #fff; border-radius: var(--r-md); border: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; position: sticky; top: 12px; z-index: 5; box-shadow: 0 2px 12px rgba(14, 26, 36, 0.04); }
  .cE .search-bar > .si-ic { color: var(--ink-4); flex: none; display: flex; }
  .cE .search-bar input { flex: 1; border: none; outline: none; font-size: var(--fs-body); color: var(--ink); background: transparent; font-family: inherit; }
  .cE .search-bar input::placeholder { color: var(--ink-4); }
  .cE .sb-divider { width: 1px; height: 20px; background: var(--line-strong); }
  .cE .sort-select { position: relative; display: inline-flex; align-items: center; }
  .cE .sort-select svg.ic-svg { position: absolute; right: 4px; color: var(--ink-3); pointer-events: none; }
  .cE .sort-select select { appearance: none; -webkit-appearance: none; background: transparent; border: none; outline: none; padding: 0 24px 0 4px; font-family: inherit; font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); cursor: pointer; }

  .cE .filter-bar { background: #fff; border-radius: var(--r-md); border: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  .cE .filter-group { display: flex; align-items: center; gap: 10px; }
  .cE .fg-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; }
  .cE .pills { display: flex; gap: 6px; }
  .cE .pill { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-3); border-radius: var(--r-pill); padding: 7px 14px; font-size: var(--fs-option); font-weight: 600; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .pill:hover { color: var(--ink-2); border-color: var(--ink-4); }
  .cE .pill.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .cE .fb-count { margin-left: auto; font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .cE .fb-count b { color: var(--ink); font-weight: 800; }

  /* ===== 리스트 패널 ===== */
  .cE .list-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
  .cE .table-head,
  .cE .table-row { display: grid; grid-template-columns: 100px 100px 100px 160px minmax(240px, 1fr) 130px 26px; column-gap: 14px; align-items: center; }
  .cE .table-head { padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--bg-soft); }
  .cE .table-head span { font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; text-align: center; }
  .cE .table-head span.h-inc { text-align: left; padding-left: 4px; }
  .cE .table-head span.h-status { text-align: right; padding-right: 4px; }
  .cE .table-row { padding: 18px 28px; cursor: pointer; transition: background-color 0.12s ease; border-bottom: 1px solid var(--line); text-decoration: none; }
  .cE .table-row:last-of-type { border-bottom: none; }
  .cE .table-row:hover { background: var(--bg-warm); }
  .cE .table-row:hover .tr-go { color: var(--brand); transform: translateX(2px); }

  .cE .tr-date { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cE .tr-name { font-size: var(--fs-body); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; text-align: center; }
  .cE .tr-insurer { font-size: var(--fs-body); color: var(--ink-2); text-align: center; font-weight: 500; }

  .cE .tr-inc { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 4px; }
  .cE .type-chip { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex: none; letter-spacing: -0.01em; }
  .cE .type-chip.disease { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .type-chip.injury { background: var(--c-surg-bg); color: var(--c-surg); }
  .cE .tr-inc-txt { font-size: var(--fs-body); color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== 상태 배지 ===== */
  .cE .tr-status { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-right: 4px; }
  .cE .status-pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: var(--r-pill); font-size: var(--fs-option); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .cE .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .cE .status-pill.sent { background: var(--bg-soft); color: var(--ink-3); }
  .cE .status-pill.sent::before { background: var(--ink-4); }
  .cE .status-pill.done { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .status-pill.done::before { background: var(--brand); }
  .cE .status-pill.hold { background: #FDEDEC; color: #C92238; }
  .cE .status-pill.hold::before { background: #C92238; }

  .cE .tr-go { color: var(--ink-4); display: flex; align-items: center; justify-content: center; transition: color .12s ease, transform .12s ease; }
  .cE .empty-list { padding: 60px 20px; text-align: center; font-size: var(--fs-body); color: var(--ink-3); }

  /* 모바일 전용 meta 라인 */
  .cE .table-row .mobile-meta { display: none; }

  /* ===== 페이지네이션 ===== */
  .cE .pagination { border-top: 1px solid var(--line); padding: 20px 28px; display: flex; justify-content: center; gap: 6px; }
  .cE .pg-btn { min-width: 36px; height: 36px; padding: 0 11px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-family: inherit; font-size: var(--fs-option); font-weight: 600; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .cE .pg-btn:hover:not(.on):not(.dots) { background: var(--bg-soft); border-color: var(--line-strong); color: var(--ink); }
  .cE .pg-btn.on { background: var(--brand); color: #fff; border-color: var(--brand); cursor: default; }
  .cE .pg-btn.dots { border: none; cursor: default; background: transparent; color: var(--ink-4); min-width: 24px; padding: 0; }
  .cE .pg-btn:disabled { color: var(--ink-4); cursor: not-allowed; background: #fff; }
  .cE .pg-btn:disabled:hover { background: #fff; border-color: var(--line); color: var(--ink-4); }

  /* ===== 안내 모달 (보험사 · 서류) ===== */
  .info-modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: 'Pretendard', system-ui, sans-serif; }
  .info-modal[hidden] { display: none; }
  .info-card { background: #fff; border-radius: 18px; max-width: 560px; width: 100%; box-shadow: var(--sh-2); overflow: hidden; display: flex; flex-direction: column; max-height: 82vh; }
  .info-head { padding: 22px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .info-head-l h3 { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin: 0 0 4px 0; }
  .info-head-l .desc { font-size: var(--fs-option); color: var(--ink-3); }
  .info-close { background: var(--bg-soft); border: none; border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
  .info-close:hover { background: var(--line); color: var(--ink); }
  .info-body { padding: 22px 26px; overflow-y: auto; flex: 1; }
  .ig-section-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px 4px; }
  .ig-section-t { font-size: var(--fs-body); font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
  .ig-section-c { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
  .info-grid .ig-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .info-grid .ig-logo { width: 26px; height: 26px; border-radius: 6px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; flex: none; overflow: hidden; }
  .info-grid .ig-logo img { max-width: 20px; max-height: 20px; object-fit: contain; }
  .info-grid .ig-name { font-size: var(--fs-body); color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .info-grid .ig-tel { font-size: var(--fs-body); font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; flex: none; }
  .info-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .info-cat { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-2); border-radius: var(--r-pill); padding: 7px 14px; font-size: var(--fs-option); font-weight: 700; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .info-cat:hover { border-color: var(--ink-4); color: var(--ink); }
  .info-cat.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .info-docs { display: flex; flex-direction: column; gap: 8px; }
  .info-doc { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-body); color: var(--ink-2); line-height: 1.5; }
  .info-doc::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); flex: none; margin-top: 9px; }

  /* ============================================================
     반응형 (모바일)
     ============================================================ */
  @media (max-width: 960px) {
    .cE .emain { overflow-x: hidden; }
    .cE .emain > * { max-width: 100%; }

    .cE .hist-title-row { width: 100% !important; max-width: none !important; margin: 0 0 16px !important; padding: 0 0 14px !important; }
    .cE .hist-title-inner { flex-direction: column; align-items: stretch; gap: 12px; padding: 0; }
    .cE .ht-l { align-items: flex-start; gap: 12px; }
    .cE .ht-ic { width: 38px; height: 38px; border-radius: 10px; }
    .cE .ht-actions { flex-wrap: wrap; gap: 6px; }
    .cE .add-btn { flex: 1; justify-content: center; padding: 12px 18px; font-size: var(--fs-body); }

    .cE .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .cE .kpi-card { padding: 12px 14px; }
    .cE .kc-v { font-size: var(--fs-h2); margin-top: 8px; }

    /* 모바일: sticky를 m-topbar(54px) 아래에 붙임, 안내 링크는 아이콘만 */
    .cE .search-bar { padding: 10px 12px; gap: 8px; top: 54px; flex-wrap: wrap; }
    .cE .search-bar input { min-width: 0; font-size: var(--fs-option); flex: 1 1 140px; }
    .cE .sb-divider { display: none; }
    .cE .sb-help { gap: 2px; margin-left: auto; }
    .cE .sb-help-btn { padding: 6px 8px; font-size: 0; gap: 0; }
    .cE .sb-help-btn svg { width: 16px; height: 16px; }

    .cE .filter-bar { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px; }
    .cE .filter-group { flex-wrap: wrap; gap: 8px; }
    .cE .fb-count { margin-left: 0; text-align: right; }
    .cE .pills { flex-wrap: wrap; gap: 5px; }
    .cE .pill { padding: 6px 12px; font-size: var(--fs-option); }

    /* 테이블 → 카드 */
    .cE .table-head { display: none; }
    .cE .list-panel { border-radius: var(--r-md); }
    .cE .table-row {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "date   status"
        "inc    status"
        "meta   status";
      column-gap: 12px;
      row-gap: 6px;
      padding: 14px 16px;
      align-items: start;
    }
    .cE .table-row .tr-date { grid-area: date; text-align: left; font-size: 12px; }
    .cE .table-row .tr-name,
    .cE .table-row .tr-insurer { display: none; }
    .cE .table-row .tr-inc { grid-area: inc; padding-left: 0; }
    .cE .table-row .mobile-meta { grid-area: meta; display: flex; align-items: center; gap: 6px; font-size: var(--fs-option); color: var(--ink-3); }
    .cE .table-row .mobile-meta b { color: var(--ink); font-weight: 700; }
    .cE .table-row .mobile-meta .mm-sep { color: var(--ink-4); }
    .cE .table-row .tr-status { grid-area: status; padding-right: 0; }
    .cE .table-row .tr-go { display: none; }

    .cE .pagination { padding: 14px 12px; gap: 4px; }
    .cE .pg-btn { min-width: 32px; height: 32px; padding: 0 8px; font-size: var(--fs-option); }

    .info-modal { padding: 12px; }
    .info-card { max-width: 100%; border-radius: 16px; max-height: 86vh; }
    .info-head { padding: 18px 20px 14px; }
    .info-body { padding: 18px 20px; }
    .info-grid { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">

    <!-- ===== 타이틀 ===== -->
    <div class="hist-title-row">
      <div class="hist-title-inner">
        <div class="ht-l">
          <div class="ht-ic">
            <svg class="ic-svg" width="22" height="22"><use href="#i-won"/></svg>
          </div>
          <div>
            <h1>보험금청구</h1>
          </div>
        </div>
        <div class="ht-actions">
          <a class="add-btn" href="new.html" data-quota="claim">
            <svg class="ic-svg" width="16" height="16"><use href="#i-plus"/></svg>
            새롭게 청구하기
          </a>
        </div>
      </div>
    </div>

    <!-- ===== KPI ===== -->
    <div class="kpi-row">
      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot ink"></span>전체 청구</span>
        <div class="kc-v" id="kpi-all">0<small>건</small></div>
      </div>
      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot surg"></span>청구서 전송</span>
        <div class="kc-v surg" id="kpi-sent">0<small>건</small></div>
      </div>
      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot warn"></span>보류</span>
        <div class="kc-v warn" id="kpi-hold">0<small>건</small></div>
      </div>
      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot brand"></span>청구 완료</span>
        <div class="kc-v brand" id="kpi-done">0<small>건</small></div>
      </div>
    </div>

    <!-- ===== 검색바 (sticky — 안내 링크 포함) ===== -->
    <div class="search-bar">
      <span class="si-ic"><svg class="ic-svg" width="18" height="18"><use href="#i-search"/></svg></span>
      <input type="text" id="search-input" placeholder="피보험자 이름 · 보험사 · 사고 내용 검색" />
      <div class="sb-divider"></div>
      <div class="sort-select">
        <select id="sort-select">
          <option value="recent">최근 청구순</option>
          <option value="name">이름순</option>
        </select>
        <svg class="ic-svg" width="12" height="12"><use href="#i-chevron-down"/></svg>
      </div>
      <div class="sb-divider"></div>
      <div class="sb-help">
        <button class="sb-help-btn" type="button" id="btn-insurers">
          <svg class="ic-svg" width="14" height="14"><use href="#i-phone"/></svg>
          청구 가능 보험사
        </button>
        <button class="sb-help-btn" type="button" id="btn-docs">
          <svg class="ic-svg" width="14" height="14"><use href="#i-note"/></svg>
          필요서류 안내
        </button>
      </div>
    </div>

    <!-- ===== 필터바 ===== -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="fg-l">상태</span>
        <div class="pills" id="status-pills">
          <button class="pill on" data-status="all" type="button">전체</button>
          <button class="pill" data-status="progress" type="button">진행 중</button>
          <button class="pill" data-status="done" type="button">완료</button>
          <button class="pill" data-status="hold" type="button">보류</button>
        </div>
      </div>
      <span class="fb-count" id="count">총 <b>0건</b> 표시 중</span>
    </div>

    <!-- ===== 리스트 ===== -->
    <div class="list-panel">
      <div class="table-head">
        <span>청구일</span>
        <span>피보험자</span>
        <span>수익자</span>
        <span>보험사</span>
        <span class="h-inc">사고 유형 · 내용</span>
        <span class="h-status">상태</span>
        <span></span>
      </div>
      <div class="table-body" id="tbl-body"></div>
      <div class="pagination" id="pagination"></div>
    </div>

  </main>
</div>
<div id="footer-host"></div>
</div>

<!-- ===== 안내 모달 ===== -->
<div class="info-modal" id="info-modal" hidden>
  <div class="info-card">
    <div class="info-head">
      <div class="info-head-l" id="info-title-wrap">
        <h3 id="info-title">청구 가능한 보험사</h3>
      </div>
      <button class="info-close" type="button" id="info-close" aria-label="닫기">
        <svg class="ic-svg" width="14" height="14"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="info-body" id="info-body"></div>
  </div>
</div>

<script src="_data.js"></script>
<script>
(function () {
  // ===== 데이터 ==========================================================
  // 데이터는 _data.js 에서 로드 (list.html · detail.html 공유)
  var CLAIMS = window.CLAIMS || [];

  // 보험사 목록은 _data.js의 카테고리 구조(damage · life) 사용
  var INSURERS_BY_CAT = window.INSURERS || { damage: [], life: [] };

  var DOC_CATS = [
    { id:'outpatient', label:'통원' },
    { id:'inpatient',  label:'입원' },
    { id:'surgery',    label:'수술' },
    { id:'diagnosis',  label:'진단금' },
    { id:'emergency',  label:'응급' }
  ];
  var DOC_BY_CAT = {
    outpatient: ['진료비 영수증 · 약제비 영수증', '통원확인서 · 진단서 · 처방전 중 1종'],
    inpatient:  ['진단서', '입원확인서', '진료비 영수증 · 세부내역서'],
    surgery:    ['진단서', '수술명 · 수술일자 포함된 서류', '진료비 영수증'],
    diagnosis:  ['진단서', '진단 사실 확인 서류'],
    emergency:  ['응급실 내원확인서 · 진료차트 중 1종', '약제비 영수증']
  };

  var state = { status:'all', query:'', sort:'recent', modal:null, docCat:'outpatient', page:1 };
  var PAGE_SIZE = 15;

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function filterList() {
    var q = state.query.trim();
    return CLAIMS.filter(function (c) {
      if (state.status !== 'all') {
        if (state.status === 'done' && c.tone !== 'done') return false;
        if (state.status === 'hold' && c.tone !== 'hold') return false;
        if (state.status === 'progress' && c.tone !== 'sent') return false;
      }
      if (q) {
        var hay = c.customer + ' ' + c.beneficiary + ' ' + c.insurer + ' ' + c.incident;
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) {
      if (state.sort === 'name') return a.customer.localeCompare(b.customer, 'ko');
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
  }

  // ===== 페이지네이션 =====================================================
  function renderPagination(total) {
    var host = document.getElementById('pagination');
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    if (totalPages <= 1) { host.innerHTML = ''; return; }

    // 1 · 현재-1 · 현재 · 현재+1 · 마지막 을 중복 없이, 사이엔 dots
    var pages = [];
    var cur = state.page;
    function add(n) { if (n >= 1 && n <= totalPages && pages.indexOf(n) === -1) pages.push(n); }
    add(1); add(cur - 1); add(cur); add(cur + 1); add(totalPages);
    pages.sort(function (a, b) { return a - b; });

    var html = '';
    html += '<button class="pg-btn" type="button" data-pg="prev" ' + (cur === 1 ? 'disabled' : '') + '>‹</button>';
    var prev = 0;
    pages.forEach(function (n) {
      if (prev && n - prev > 1) html += '<button class="pg-btn dots" type="button" disabled>…</button>';
      html += '<button class="pg-btn ' + (n === cur ? 'on' : '') + '" type="button" data-pg="' + n + '">' + n + '</button>';
      prev = n;
    });
    html += '<button class="pg-btn" type="button" data-pg="next" ' + (cur === totalPages ? 'disabled' : '') + '>›</button>';
    host.innerHTML = html;

    host.querySelectorAll('[data-pg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var v = btn.dataset.pg;
        if (v === 'prev') state.page = Math.max(1, cur - 1);
        else if (v === 'next') state.page = Math.min(totalPages, cur + 1);
        else state.page = parseInt(v, 10);
        render();
        // 리스트 상단으로 스크롤 (sticky 검색바 바로 아래)
        var panel = document.querySelector('.list-panel');
        if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // ===== 렌더 ==========================================================
  function render() {
    var list = filterList();
    var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * PAGE_SIZE;
    var pageList = list.slice(start, start + PAGE_SIZE);

    document.getElementById('kpi-all').innerHTML  = CLAIMS.length + '<small>건</small>';
    document.getElementById('kpi-sent').innerHTML = CLAIMS.filter(function (c) { return c.tone === 'sent'; }).length + '<small>건</small>';
    document.getElementById('kpi-hold').innerHTML = CLAIMS.filter(function (c) { return c.tone === 'hold'; }).length + '<small>건</small>';
    document.getElementById('kpi-done').innerHTML = CLAIMS.filter(function (c) { return c.tone === 'done'; }).length + '<small>건</small>';
    document.getElementById('count').innerHTML = list.length > PAGE_SIZE
      ? '총 <b>' + list.length + '건</b> · ' + state.page + ' / ' + totalPages + ' 페이지'
      : '총 <b>' + list.length + '건</b> 표시 중';

    var body = document.getElementById('tbl-body');
    if (list.length === 0) {
      body.innerHTML = '<div class="empty-list">조건에 맞는 청구가 없어요</div>';
      renderPagination(0);
      return;
    }

    body.innerHTML = pageList.map(function (c) {
      var typeCls = c.typeId === 'injury' ? 'injury' : 'disease';
      var statusCls = c.tone; // sent | done | hold
      return ''
        + '<a class="table-row" href="detail.html?id=' + c.id + '">'
        +   '<span class="tr-date">' + c.date + '</span>'
        +   '<span class="tr-name">' + escapeHTML(c.customer) + '</span>'
        +   '<span class="tr-name tr-insurer">' + escapeHTML(c.beneficiary) + '</span>'
        +   '<span class="tr-insurer">' + escapeHTML(c.insurer) + '</span>'
        +   '<div class="tr-inc">'
        +     '<span class="type-chip ' + typeCls + '">' + c.typeLabel + '</span>'
        +     '<span class="tr-inc-txt">' + escapeHTML(c.incident) + '</span>'
        +   '</div>'
        +   '<div class="tr-status">'
        +     '<span class="status-pill ' + statusCls + '">' + c.status + '</span>'
        +   '</div>'
        +   '<span class="mobile-meta">'
        +     '<b>' + escapeHTML(c.customer) + '</b>'
        +     '<span class="mm-sep">·</span>'
        +     escapeHTML(c.insurer)
        +   '</span>'
        +   '<span class="tr-go"><svg class="ic-svg" width="16" height="16"><use href="#i-chevron-right"/></svg></span>'
        + '</a>';
    }).join('');

    renderPagination(list.length);
  }

  // ===== 필터 · 검색 이벤트 (변경 시 페이지 1로 리셋) =====================
  document.querySelectorAll('#status-pills .pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.status = btn.dataset.status;
      state.page = 1;
      document.querySelectorAll('#status-pills .pill').forEach(function (b) {
        b.classList.toggle('on', b.dataset.status === state.status);
      });
      render();
    });
  });
  document.getElementById('search-input').addEventListener('input', function (e) {
    state.query = e.target.value;
    state.page = 1;
    render();
  });
  document.getElementById('sort-select').addEventListener('change', function (e) {
    state.sort = e.target.value;
    state.page = 1;
    render();
  });

  // ===== 안내 모달 =======================================================
  var modal = document.getElementById('info-modal');
  var titleEl = document.getElementById('info-title');
  var bodyEl = document.getElementById('info-body');

  function openInfo(kind) {
    state.modal = kind;
    if (kind === 'insurers') {
      titleEl.textContent = '청구 가능한 보험사';
      var sectionHtml = function (label, list) {
        return '<div class="ig-section">'
          + '<div class="ig-section-h"><span class="ig-section-t">' + label + '</span><span class="ig-section-c">' + list.length + '개사</span></div>'
          + '<div class="info-grid">'
          + list.map(function (i) {
              return '<div class="ig-row">'
                + '<span class="ig-logo"><img src="' + escapeHTML(i.logo) + '" alt="' + escapeHTML(i.name) + '" onerror="this.style.display=\'none\';"></span>'
                + '<span class="ig-name">' + escapeHTML(i.name) + '</span>'
                + '<span class="ig-tel">' + escapeHTML(i.tel) + '</span>'
                + '</div>';
            }).join('')
          + '</div>'
          + '</div>';
      };
      bodyEl.innerHTML = sectionHtml('손해보험', INSURERS_BY_CAT.damage)
        + '<div style="height:20px;"></div>'
        + sectionHtml('생명보험', INSURERS_BY_CAT.life);
    } else if (kind === 'docs') {
      titleEl.textContent = '필요서류 안내';
      renderDocs();
    }
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function renderDocs() {
    bodyEl.innerHTML = ''
      + '<div class="info-cats" id="info-cats">'
      + DOC_CATS.map(function (c) {
          return '<button type="button" class="info-cat ' + (state.docCat === c.id ? 'on' : '') + '" data-cat="' + c.id + '">' + c.label + '</button>';
        }).join('')
      + '</div>'
      + '<div class="info-docs">'
      + (DOC_BY_CAT[state.docCat] || []).map(function (d) {
          return '<div class="info-doc">' + escapeHTML(d) + '</div>';
        }).join('')
      + '</div>';
    document.querySelectorAll('#info-cats .info-cat').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.docCat = btn.dataset.cat;
        renderDocs();
      });
    });
  }

  function closeInfo() {
    state.modal = null;
    modal.hidden = true;
    document.body.style.overflow = '';
  }

  document.getElementById('btn-insurers').addEventListener('click', function () { openInfo('insurers'); });
  document.getElementById('btn-docs').addEventListener('click', function () { openInfo('docs'); });
  document.getElementById('info-close').addEventListener('click', closeInfo);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeInfo(); });
  document.addEventListener('keydown', function (e) { if (!modal.hidden && e.key === 'Escape') closeInfo(); });

  render();
})();
</script>

<script src="../../components/layout.js"></script>
<script>
  injectShell('claim');
  // 신규 청구 시작 — 잔여 확인
  document.querySelectorAll('[data-quota]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      var f = el.getAttribute('data-quota');
      if (!window.checkQuota(f)) { e.preventDefault(); }
    });
  });
</script>
</body>
</html>
