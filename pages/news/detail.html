<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 보험소식지</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<link rel="stylesheet" href="../../styles/news-article.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* ===== 지면 — 한 장으로 읽는 1단 편집 레이아웃 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; }
  .cE .emain > * { width: 100%; max-width: 740px; margin-left: 0; margin-right: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 지면 머리 — 뒤로가기 · 지면 이름 ===== */
  .cE .nd-backbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line-strong); margin-bottom: 48px; }
  .cE .nd-back { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-body); font-weight: 600; line-height: 1.4; color: var(--ink-3); text-decoration: none; }
  .cE .nd-back:hover { color: var(--brand-deep); }
  .cE .nd-kind { font-size: var(--fs-body); font-weight: 600; line-height: 1.4; color: var(--ink-3); }

  @media (max-width: 640px) {
    .layout { min-width: 0; }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">
    <div class="nd-backbar">
      <a class="nd-back" href="index.html">
        <svg class="ic-svg" width="14" height="14"><use href="#i-chevron-left"/></svg>
        오늘의 뉴스
      </a>
      <span class="nd-kind">보험소식지</span>
    </div>
    <div id="nd-body" class="nd-page"></div>
  </main>
</div>
<div id="footer-host"></div>
</div>

<script src="../../components/layout.js"></script>
<script>injectShell('news');</script>
<script src="_data.js"></script>
<script src="article.js"></script>
<script src="detail.js"></script>
</body>
</html>
