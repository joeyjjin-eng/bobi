<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 새롭게 미청구보험금 조회하기</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<link rel="stylesheet" href="../../styles/detail-mobile.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 페이지 레이아웃 오버라이드 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; background: var(--bg-soft); }
  .cE .emain > * { width: 100%; max-width: 1192px; margin-left: 0; margin-right: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; background: var(--bg-soft); }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 페이지 타이틀 ===== */
  /* 타이틀 — emain 패딩을 빠져나가서 좌우 꽉차게, 내부 콘텐츠는 1192px 컬럼 정렬 */
  .cE .nr-title-row { width: calc(100% + 72px) !important; max-width: none !important; margin: -28px -36px 28px; padding: 22px 0; background: #fff; border-bottom: 1px solid var(--line); }
  .cE .nr-title-inner { max-width: 1192px; margin: 0 auto; padding: 0; display: flex; align-items: center; gap: 22px; }
  .cE .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-option); color: var(--ink-2); text-decoration: none; font-weight: 600; padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-radius: var(--r-pill); background: #fff; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .cE .back-btn:hover { background: var(--bg-soft); border-color: var(--ink-4); color: var(--ink); }
  .cE .nr-title-row h1 { font-size: var(--fs-h1); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin: 0; display: inline-flex; align-items: center; gap: 8px; }
  .cE .nr-title-row h1 .nr-beta { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; color: #fff; background: #C92238; border: 1px solid #C92238; border-radius: 4px; padding: 3px 7px; line-height: 1; vertical-align: middle; }
  .cE .nr-title-row .sub { font-size: var(--fs-option); color: var(--ink-3); margin-top: 4px; }
  .cE .nr-title-row .sub b { color: var(--ink-2); font-weight: 700; }
  .cE .nr-title-info { display: flex; flex-direction: column; }

  /* ===== 스텝 인디케이터 ===== */
  .cE .step-dots { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 14px 22px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); }
  .cE .step { display: inline-flex; align-items: center; gap: 8px; }
  .cE .step .num { width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--ink-3); display: grid; place-items: center; font-size: var(--fs-option); font-weight: 700; }
  .cE .step .lbl { font-size: var(--fs-option); font-weight: 600; color: var(--ink-3); letter-spacing: -0.01em; }
  .cE .step.on .num { background: var(--brand); color: #fff; }
  .cE .step.on .lbl { color: var(--ink); font-weight: 700; }
  .cE .step.done .num { background: var(--brand); color: #fff; }
  .cE .step.done .lbl { color: var(--ink-2); font-weight: 700; }
  .cE .step-line { flex: 0 0 32px; height: 1px; background: var(--line); }

  /* ===== Step 1: 고객 선택 ===== */
  .cE .nr-search { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 18px; display: flex; align-items: center; gap: 12px; transition: border-color .15s ease; margin-bottom: 16px; }
  .cE .nr-search:focus-within { border-color: var(--brand); }
  .cE .nr-search svg { color: var(--ink-4); flex: none; }
  .cE .nr-search input { flex: 1; border: none; outline: none; font-size: var(--fs-body); color: var(--ink); background: transparent; font-family: inherit; }
  .cE .nr-search input::placeholder { color: var(--ink-4); }

  /* 고객 테이블 패널 */
  .cE .cust-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }

  /* 패널 헤더 — 제목 + 신규 고객 등록 버튼 (검색바와 분리) */
  .cE .cust-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--line); background: #fff; }
  .cE .cust-panel-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 8px; }
  .cE .cust-panel-title .cnt { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; }
  .cE .cust-panel-title .cnt b { color: var(--brand-deep); font-weight: 800; }
  .cE .new-cust-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand-pale); color: var(--brand-deep); border: 1px solid var(--brand-soft); border-radius: var(--r-pill); padding: 10px 20px; font-family: inherit; font-size: var(--fs-body); font-weight: 700; cursor: pointer; text-decoration: none; letter-spacing: -0.01em; transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .2s ease; }
  .cE .new-cust-btn:hover { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--sh-brand); }
  .cE .new-cust-btn svg { color: currentColor; }
  .cE .cust-thead { display: grid; grid-template-columns: 1.5fr 1.1fr 1fr 0.9fr 152px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--bg-soft); }
  .cE .cust-thead span { font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; }
  .cE .cust-row { display: grid; grid-template-columns: 1.5fr 1.1fr 1fr 0.9fr 152px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background-color .12s ease; }
  .cE .cust-row:last-child { border-bottom: none; }
  .cE .cust-row:hover { background: var(--bg-warm); }
  .cE .cust-cell-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .cE .cust-av { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-pale); color: var(--brand-deep); display: grid; place-items: center; font-weight: 800; font-size: var(--fs-body); flex: none; }
  .cE .cust-nm { font-size: var(--fs-body); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .cE .gender-chip { font-size: var(--fs-option); font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill); display: inline-block; }
  .cE .gender-chip.f { background: #FEF0F0; color: #D96060; }
  .cE .gender-chip.m { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .cust-text { font-size: var(--fs-body); color: var(--ink-2); }
  .cE .cust-reg { font-size: var(--fs-option); color: var(--ink-3); }
  .cE .cust-action { display: flex; justify-content: flex-end; }
  .cE .auth-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-pale); color: var(--brand-deep); border: 1px solid var(--brand-soft); border-radius: var(--r-pill); padding: 8px 16px; font-family: inherit; font-size: var(--fs-option); font-weight: 700; cursor: pointer; transition: background-color .15s ease, color .15s ease, box-shadow .2s ease; }
  .cE .cust-row:hover .auth-btn { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--sh-brand); }
  .cE .cust-foot { display: flex; align-items: center; justify-content: center; padding: 14px 24px; border-top: 1px solid var(--line); }
  .cE .empty-cust { padding: 60px 20px; text-align: center; font-size: var(--fs-body); color: var(--ink-3); }

  /* ===== Step 2: 본인인증 카드 ===== */
  .cE .auth-card { width: 100%; max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-1); }
  .cE .auth-head { padding: 24px 28px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, var(--brand-pale) 0%, #fff 60%); }
  .cE .auth-avatar { width: 52px; height: 52px; border-radius: 50%; background: #fff; color: var(--brand-deep); display: grid; place-items: center; font-weight: 800; font-size: var(--fs-h2); border: 1px solid var(--brand-soft); flex: none; }
  .cE .auth-name { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .cE .auth-meta { font-size: var(--fs-option); color: var(--ink-3); margin-top: 4px; }

  .cE .auth-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .cE .auth-info { display: flex; align-items: center; gap: 10px; background: var(--brand-pale); border-radius: var(--r-md); padding: 12px 16px; border: 1px solid var(--brand-soft); }
  .cE .auth-info svg { color: var(--brand-deep); flex: none; }
  .cE .auth-info .txt { font-size: var(--fs-option); color: var(--brand-deep); font-weight: 600; line-height: 1.5; }
  .cE .auth-info .txt b { font-weight: 800; }

  .cE .field { display: flex; flex-direction: column; gap: 8px; }
  .cE .field-l { font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); letter-spacing: -0.01em; padding-left: 2px; }
  .cE .field-hint { font-size: var(--fs-option); color: var(--ink-3); margin-top: 2px; padding-left: 2px; }
  .cE .input-box { width: 100%; height: 46px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 14px; font-size: var(--fs-body); color: var(--ink); font-family: inherit; outline: none; background: #fff; transition: border-color .15s ease; box-sizing: border-box; }
  .cE .input-box:hover { border-color: var(--ink-3); }
  .cE .input-box:focus { border-color: var(--brand); }
  .cE .input-box[readonly] { background: var(--bg-soft); color: var(--ink-3); cursor: default; }
  .cE .input-box[readonly]:hover { border-color: var(--line-strong); }

  /* 주민번호 입력 */
  .cE .rrn-row { display: flex; align-items: center; gap: 10px; }
  .cE .rrn-row .input-box { flex: 1; text-align: center; }
  .cE .rrn-row .rrn-front { letter-spacing: 0.12em; }
  .cE .rrn-row .rrn-back { letter-spacing: 0.25em; }
  .cE .rrn-sep { color: var(--ink-4); font-weight: 700; font-size: var(--fs-body); }

  /* 통신사 선택 — 3열 × 2행 그리드 */
  .cE .carrier-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cE .carrier-btn { height: 46px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: #fff; color: var(--ink-2); font-size: var(--fs-body); font-weight: 600; font-family: inherit; cursor: pointer; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .cE .carrier-btn:hover { border-color: var(--ink-4); color: var(--ink); }
  .cE .carrier-btn.on { background: var(--brand-pale); border-color: var(--brand); color: var(--brand-deep); font-weight: 800; }

  /* 조회 연도 선택 (체크박스, 복수 선택) — 개인정보 입력과 시각적으로 구분되는 영역 */
  .cE .year-section { background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
  .cE .year-section .year-l { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-option); font-weight: 600; color: var(--ink-2); letter-spacing: -0.01em; }
  .cE .year-section .year-hint { font-size: var(--fs-option); color: var(--ink-3); font-weight: 400; }
  .cE .year-checks { display: flex; flex-direction: column; gap: 10px; }
  .cE .year-row-all { display: flex; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .cE .year-row-list { display: flex; flex-wrap: wrap; gap: 10px 20px; }
  .cE .year-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .cE .year-check input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 4px; background: #fff; cursor: pointer; position: relative; margin: 0; transition: background-color .15s ease, border-color .15s ease; }
  .cE .year-check input:hover { border-color: var(--ink-4); }
  .cE .year-check input:checked { background: var(--brand); border-color: var(--brand); }
  .cE .year-check input:checked::after { content: ''; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .cE .year-check .lbl { font-size: var(--fs-body); color: var(--ink-2); }
  .cE .year-check input:checked ~ .lbl { color: var(--ink); }

  /* 인증코드 입력 — 단일 텍스트 필드 */
  .cE .code-input { width: 100%; height: 58px; text-align: center; font-size: 22px; font-weight: 800; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-md); outline: none; font-family: inherit; background: #fff; transition: background-color .15s ease, border-color .15s ease; letter-spacing: 0.32em; padding: 0 14px 0 calc(14px + 0.32em); box-sizing: border-box; font-variant-numeric: tabular-nums; }
  .cE .code-input:focus { border-color: var(--brand); }
  .cE .code-input.filled { background: var(--brand-pale); border-color: var(--brand); color: var(--brand-deep); }
  .cE .code-input::placeholder { color: var(--ink-4); font-size: var(--fs-body); font-weight: 400; letter-spacing: -0.01em; }

  .cE .timer-row { display: flex; align-items: center; justify-content: space-between; }
  .cE .timer { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .cE .timer b { color: var(--brand-deep); font-variant-numeric: tabular-nums; font-weight: 800; }
  .cE .timer.warn b { color: #E0445A; }
  .cE .resend-link { background: none; border: none; padding: 0; font-family: inherit; font-size: var(--fs-option); font-weight: 600; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .cE .resend-link:hover { color: var(--ink); }

  /* 카카오톡 인증 대기 */
  .cE .kakao-wait { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 0 8px; gap: 14px; }
  .cE .kakao-ic { width: 80px; height: 80px; border-radius: 50%; background: #FEE500; display: grid; place-items: center; color: #391B1B; }
  .cE .kakao-title { font-size: var(--fs-h2); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .cE .kakao-desc { font-size: var(--fs-option); color: var(--ink-3); line-height: 1.4; }

  /* 인증 완료 */
  .cE .done-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 0 4px; gap: 16px; }
  .cE .done-ic { width: 80px; height: 80px; border-radius: 50%; background: #E7FAF6; display: grid; place-items: center; color: #15967F; }
  .cE .done-badge { display: inline-flex; align-items: center; gap: 5px; background: #E7FAF6; color: #15967F; border-radius: var(--r-pill); padding: 6px 14px; font-size: var(--fs-option); font-weight: 800; }
  .cE .done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .cE .done-desc { font-size: var(--fs-body); color: var(--ink-3); line-height: 1.6; }
  .cE .done-desc b { color: var(--ink); font-weight: 800; }

  /* CTA 영역 */
  .cE .auth-cta { padding: 18px 28px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .cE .auth-cta .btn-secondary { background: #fff; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 12px 22px; font-family: inherit; font-size: var(--fs-body); font-weight: 700; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .auth-cta .btn-secondary:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--ink-3); }
  .cE .auth-cta .btn-primary { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--brand-grad); color: #fff; border: none; border-radius: var(--r-pill); padding: 12px 24px; font-family: inherit; font-size: var(--fs-body); font-weight: 700; cursor: pointer; box-shadow: var(--sh-brand); letter-spacing: -0.01em; transition: filter .2s ease; }
  .cE .auth-cta .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
  .cE .auth-cta .btn-primary:disabled { background: var(--line); color: var(--ink-4); box-shadow: none; cursor: not-allowed; }

  /* ===== 신규 고객 등록 모달 ===== */
  .nr-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: 'Pretendard', system-ui, sans-serif; }
  .nr-modal[hidden] { display: none; }
  .nr-modal-card { background: #fff; border-radius: 18px; padding: 0; max-width: 460px; width: 100%; box-shadow: var(--sh-2); overflow: hidden; }
  .nr-modal-head { padding: 22px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .nr-modal-head-l { display: flex; align-items: center; gap: 12px; }
  .nr-modal-head-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
  .nr-modal-head h3 { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin: 0; }
  .nr-modal-head .desc { font-size: var(--fs-option); color: var(--ink-3); margin-top: 4px; }
  .nr-modal-close { background: var(--bg-soft); border: none; border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
  .nr-modal-close:hover { background: var(--line); color: var(--ink); }
  .nr-modal-body { padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; }
  .nr-modal-row { display: flex; gap: 14px; }
  .nr-modal-row > * { flex: 1; }
  .nr-modal-row .field.f-wide { flex: 1.4; }
  .nr-modal-actions { padding: 16px 26px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; }

  /* 페이지네이션 (cust-foot) */
  .cE .cust-pages { display: inline-flex; gap: 4px; align-items: center; }
  .cE .cust-pg-btn { min-width: 32px; height: 32px; padding: 0 9px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-family: inherit; font-size: var(--fs-option); font-weight: 600; border-radius: 8px; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .cust-pg-btn:hover:not(.on) { background: var(--bg-soft); border-color: var(--line-strong); }
  .cE .cust-pg-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; cursor: default; }

  /* 페이드 인 애니메이션 */
  @keyframes nrFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .nr-fade { animation: nrFade 0.2s ease both; }
  @keyframes nrPop { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .nr-pop { animation: nrPop 0.22s cubic-bezier(0.16,1,0.3,1) both; }

  .step-pane[hidden] { display: none; }

  /* ============================================================
     반응형 — 페이지 고유 (진료기록 새 리포트 패턴과 통일)
     ============================================================ */
  @media (max-width: 960px) {
    .layout { min-width: 0; }

    /* 페이지 전체 회색 배경 (topbar 아래 · footer 위 모두 채움) */
    html, body { background: var(--bg-soft); }
    .cE .emain { flex: 1; min-height: calc(100vh - 54px); padding: 12px 16px 32px !important; }
    .m-topbar { background: #fff; }

    /* nr-title-row는 topbar로 대체 → 완전 숨김 */
    .cE .nr-title-row { display: none !important; }

    /* ===== 스텝 인디케이터 컴팩션 ===== */
    .cE .step-dots { padding: 12px 14px; gap: 6px; margin-bottom: 12px; border-radius: var(--r-sm); }
    .cE .step { gap: 6px; }
    .cE .step .num { width: 22px; height: 22px; font-size: 12px; }
    .cE .step .lbl { font-size: var(--fs-option); letter-spacing: -0.02em; }
    .cE .step-line { flex: 1; }

    /* ===== Step 1: 검색바 컴팩션 ===== */
    .cE .nr-search { padding: 10px 14px; gap: 10px; margin-bottom: 12px; border-radius: var(--r-sm); }
    .cE .nr-search input { font-size: var(--fs-body); }

    /* ===== 고객 목록 카드 헤더 — 스택 ===== */
    .cE .cust-panel { border-radius: var(--r-md); }
    .cE .cust-panel-head { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; }
    .cE .cust-panel-title { font-size: var(--fs-body); gap: 8px; }
    .cE .cust-panel-title .cnt { font-size: var(--fs-option); }
    .cE .new-cust-btn { width: 100%; justify-content: center; padding: 10px 14px; font-size: var(--fs-option); }

    /* ===== 고객 리스트 → 카드 (5열 그리드 해체) ===== */
    .cE .cust-thead { display: none !important; }
    .cE .cust-row {
      display: grid !important;
      grid-template-columns: 44px 1fr auto;
      grid-template-rows: auto auto auto;
      column-gap: 12px;
      row-gap: 3px;
      padding: 14px 32px 14px 16px !important;
      position: relative;
    }
    .cE .cust-row::after {
      content: '';
      position: absolute;
      top: 50%; right: 14px;
      width: 8px; height: 8px;
      margin-top: -4px;
      border-right: 1.5px solid var(--ink-4);
      border-top: 1.5px solid var(--ink-4);
      transform: rotate(45deg);
      opacity: .55;
    }
    .cE .cust-row .cust-cell-name { display: contents; }
    .cE .cust-row .cust-av {
      grid-column: 1;
      grid-row: 1 / span 3;
      width: 42px !important; height: 42px !important;
      align-self: start;
      margin-top: 2px;
    }
    .cE .cust-row .cust-nm {
      grid-column: 2;
      grid-row: 1;
      font-size: var(--fs-body) !important;
    }
    .cE .cust-row .cust-cell-name > .gender-chip {
      grid-column: 3;
      grid-row: 1;
      align-self: center;
      justify-self: end;
    }
    .cE .cust-row > span.cust-text:nth-of-type(1) {
      grid-column: 2 / -1;
      grid-row: 2;
      font-size: var(--fs-option) !important;
      color: var(--ink-3) !important;
    }
    .cE .cust-row > span.cust-text:nth-of-type(2) {
      grid-column: 2 / -1;
      grid-row: 3;
      font-size: var(--fs-option) !important;
      color: var(--ink-3) !important;
    }
    .cE .cust-row > span.cust-reg { display: none !important; }
    .cE .cust-row .cust-action { display: none !important; }

    .cE .cust-foot { padding: 12px 16px; }
    .cE .cust-pg-btn { min-width: 32px; height: 32px; font-size: 12px; }

    /* ===== Step 2: 본인인증 카드 — 풀폭 ===== */
    .cE .auth-card { max-width: none; border-radius: var(--r-md); }
    .cE .auth-head { padding: 18px 20px 16px; gap: 12px; }
    .cE .auth-avatar { width: 44px; height: 44px; font-size: var(--fs-body); }
    .cE .auth-name { font-size: var(--fs-body); gap: 6px; }
    .cE .auth-meta { font-size: var(--fs-option); }

    .cE .auth-body { padding: 18px 20px; gap: 14px; }
    .cE .auth-info { padding: 10px 14px; gap: 8px; }
    .cE .auth-info .txt { font-size: var(--fs-option); line-height: 1.5; }

    /* 조회 연도 섹션 컴팩션 */
    .cE .year-section { padding: 14px 16px; gap: 10px; }
    .cE .year-section .year-l { flex-wrap: wrap; gap: 4px 8px; font-size: var(--fs-option); }
    .cE .year-section .year-hint { font-size: 12px; }
    .cE .year-row-list { gap: 8px 14px; }
    .cE .year-check .lbl { font-size: var(--fs-option); }

    /* 입력 필드 컴팩션 */
    .cE .input-box { height: 44px; padding: 0 12px; font-size: var(--fs-body); }
    .cE .field-l { font-size: var(--fs-option); }
    .cE .field-hint { font-size: var(--fs-option); }

    /* 통신사 6개 — 3열 유지 (2행) */
    .cE .carrier-row { gap: 6px; }
    .cE .carrier-btn { height: 42px; font-size: var(--fs-option); }

    /* 주민번호 뒷자리 */
    .cE .rrn-row { gap: 6px; }
    .cE .rrn-row .input-box { padding: 0 8px; font-size: var(--fs-option); }

    /* 카카오톡 인증 대기 화면 */
    .cE .kakao-wait { padding: 8px 0; gap: 12px; }
    .cE .kakao-ic { width: 64px; height: 64px; }
    .cE .kakao-title { font-size: var(--fs-body); }
    .cE .kakao-desc { font-size: var(--fs-option); }

    /* 인증 완료 화면 */
    .cE .done-wrap { padding: 4px 0; gap: 12px; }
    .cE .done-ic { width: 68px; height: 68px; }
    .cE .done-title { font-size: var(--fs-body); }
    .cE .done-desc { font-size: var(--fs-option); }

    /* CTA — 세로 스택, primary 하단(thumb reach) */
    .cE .auth-cta {
      padding: 14px 20px 20px;
      flex-direction: column;
      gap: 8px;
    }
    .cE .auth-cta .btn-secondary,
    .cE .auth-cta .btn-primary {
      width: 100%; padding: 12px 18px;
      font-size: var(--fs-body);
      justify-content: center;
    }

    /* ===== 신규 고객 등록 모달 — 모바일 컴팩션 ===== */
    .nr-modal { padding: 12px; }
    .nr-modal-card { max-width: 100%; border-radius: 16px; }
    .nr-modal-head { padding: 18px 20px 14px; gap: 12px; }
    .nr-modal-head-ic { width: 36px; height: 36px; border-radius: 10px; }
    .nr-modal-head h3 { font-size: var(--fs-body); }
    .nr-modal-head .desc { font-size: var(--fs-option); }
    .nr-modal-body { padding: 18px 20px; gap: 14px; }
    .nr-modal-row { flex-direction: column; gap: 14px; }
    .nr-modal-actions { padding: 14px 20px 20px; flex-direction: column; gap: 8px; }
    .nr-modal-actions > button { width: 100% !important; padding: 12px 18px !important; justify-content: center !important; }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">

    <!-- 타이틀 (좌우 꽉차는 흰 박스) -->
    <div class="nr-title-row">

          <svg class="ic-svg" width="16" height="16"><use href="#i-chevron-left"/></svg>
          뒤로

        <div class="nr-title-info">

      <div class="step-line"></div>
      <div class="step" data-step="2"><span class="num">2</span><span class="lbl">본인인증</span></div>

      <div class="step" data-step="3"><span class="num">3</span><span class="lbl">리포트 확인하기</span></div>

    <!-- Step 1: 고객 선택 -->
    <div class="step-pane" id="pane-select">
      <div class="nr-search">
        <svg class="ic-svg" width="18" height="18"><use href="#i-search"/></svg>
        <input type="text" id="cust-search" placeholder="고객 이름 또는 연락처로 검색" />
      </div>

      <div class="cust-panel">
        <div class="cust-panel-head">
          <h2 class="cust-panel-title">
            고객 목록
            <span class="cnt" id="cust-count">총 <b>0명</b></span>
          </h2>
          <button class="new-cust-btn" type="button" id="open-new-cust">
            <svg class="ic-svg" width="14" height="14"><use href="#i-plus"/></svg>
            신규 고객 등록
          </button>
        </div>
        <div class="cust-thead">
          <span>고객명</span>
          <span>연락처</span>
          <span>생년월일</span>
          <span>등록일</span>
          <span></span>
        </div>
        <div id="cust-tbody"></div>
        <div class="cust-foot">
          <nav class="cust-pages" aria-label="페이지 이동">
            <button class="cust-pg-btn on" type="button">1</button>
            <button class="cust-pg-btn" type="button">2</button>
            <button class="cust-pg-btn" type="button">3</button>
          </nav>
        </div>
      </div>
    </div>

    <!-- Step 2-3: 본인인증 -->
    <div class="step-pane" id="pane-auth" hidden>
      <div class="auth-card nr-pop" id="auth-card">
        <div class="auth-head">
          <div class="auth-avatar" id="auth-avatar">김</div>
          <div>
            <div class="auth-name">
              <span id="auth-name">김진주</span>
              <span class="gender-chip f" id="auth-gender">여</span>
            </div>
            <div class="auth-meta" id="auth-meta">1983.04.12 · 010-1234-5678</div>
          </div>
        </div>
        <div id="auth-body"></div>
      </div>
    </div>

  </main>
</div>
<div id="footer-host"></div>
</div>

<!-- 신규 고객 등록 모달 -->
<div class="nr-modal" id="new-cust-modal" hidden>
  <div class="nr-modal-card nr-pop">
    <div class="nr-modal-head">
      <div class="nr-modal-head-l">
        <div class="nr-modal-head-ic"><svg class="ic-svg" width="18" height="18"><use href="#i-user"/></svg></div>
        <div>
          <h3>신규 고객 등록</h3>
          <div class="desc">고객 명단에 새 고객을 추가해요</div>

      <button class="nr-modal-close" type="button" id="close-new-cust" aria-label="닫기">
        <svg class="ic-svg" width="14" height="14"><use href="#i-x"/></svg>

    <div class="nr-modal-body">
      <div class="field">
        <label class="field-l" for="nc-name">이름</label>

      <div class="field">
        <label class="field-l" for="nc-phone">연락처</label>

      </div>
      <div class="nr-modal-row">
        <div class="field">
          <label class="field-l">성별</label>
          <div class="carrier-row" id="nc-gender">

            <button type="button" class="carrier-btn" data-gender="여">여</button>

        <div class="field f-wide">
          <label class="field-l" for="nc-birth">생년월일</label>

        </div>

    </div>
    <div class="nr-modal-actions">
      <button class="btn-secondary" type="button" id="cancel-new-cust" style="background:#fff;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:12px 22px;font-family:inherit;font-size:var(--fs-body);font-weight:700;cursor:pointer;">취소</button>
      <button class="btn-primary" type="button" id="save-new-cust" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand-grad);color:#fff;border:none;border-radius:var(--r-pill);padding:12px 24px;font-family:inherit;font-size:var(--fs-body);font-weight:700;cursor:pointer;box-shadow:var(--sh-brand);letter-spacing:-0.01em;">
        <svg class="ic-svg" width="14" height="14"><use href="#i-plus"/></svg>
        등록하기
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  // ===== 고객 데이터 =====
  var CUSTOMERS = [
    { name:'김진주', phone:'010-1234-5678', gender:'여', birth:'1983.02.15', reg:'2026.06.09' },
    { name:'박민호', phone:'010-9876-5432', gender:'남', birth:'1997.11.03', reg:'2026.05.20' },
    { name:'장숙영', phone:'010-7715-2230', gender:'여', birth:'1983.03.28', reg:'2026.06.08' },
    { name:'오미자', phone:'010-3456-7890', gender:'여', birth:'1979.08.09', reg:'2026.05.17' },
    { name:'김정운', phone:'010-4567-8901', gender:'여', birth:'1982.06.30', reg:'2026.05.15' },
    { name:'황정연', phone:'010-5678-9012', gender:'여', birth:'1972.12.15', reg:'2026.05.14' },
    { name:'최부명', phone:'010-6789-0123', gender:'남', birth:'1981.03.22', reg:'2026.05.12' },
    { name:'이성환', phone:'010-7890-1234', gender:'남', birth:'1988.09.18', reg:'2026.05.11' },
    { name:'정하윤', phone:'010-8901-2345', gender:'여', birth:'1995.07.06', reg:'2026.05.09' },
    { name:'송민재', phone:'010-3392-7741', gender:'남', birth:'1963.11.02', reg:'2026.06.09' },
    { name:'유지원', phone:'010-0123-4567', gender:'여', birth:'1999.05.14', reg:'2026.05.06' },
    { name:'한재현', phone:'010-1357-2468', gender:'남', birth:'1971.10.02', reg:'2026.05.05' }
  ];

  var CARRIERS = ['SKT', 'KT', 'LG U+', 'SKT 알뜰폰', 'KT 알뜰폰', 'LG 알뜰폰'];
  var YEARS = ['2025', '2024', '2023', '2022', '2021'];

  // 생년월일 '1983.04.12' → 주민번호 앞 6자리 '830412'
  function getRrnFront(birth) {
    if (!birth) return '';
    var parts = birth.split('.');
    if (parts.length !== 3) return '';
    return parts[0].slice(-2) + parts[1] + parts[2];
  }

  var state = {
    step: 1,            // 1: select, 2: auth-form, 3: auth-code, 4: auth-done
    selected: null,
    query: '',
    carrier: null,
    rrnBack: '',
    code: '',
    secs: 180,
    years: YEARS.slice()  // 기본값: 최근 5년 전체 선택
  };
  var timer = null;

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function filterCustomers() {
    var q = state.query.replace(/-/g, '');
    if (!q) return CUSTOMERS;
    return CUSTOMERS.filter(function (c) {
      return c.name.indexOf(state.query) !== -1 || c.phone.replace(/-/g, '').indexOf(q) !== -1;
    });
  }

  // ===== Step 1: 고객 선택 =====
  function renderCustList() {
    var list = filterCustomers();
    var tbody = document.getElementById('cust-tbody');
    document.getElementById('cust-count').innerHTML = '총 <b>' + list.length + '명</b>';

    if (list.length === 0) {
      tbody.innerHTML = '<div class="empty-cust">검색 결과가 없어요</div>';
      return;
    }

    tbody.innerHTML = list.map(function (c, i) {
      return ''
        + '<div class="cust-row" data-idx="' + CUSTOMERS.indexOf(c) + '">'
        +   '<div class="cust-cell-name">'
        +     '<div class="cust-av">' + escapeHTML(c.name[0]) + '</div>'
        +     '<span class="cust-nm">' + escapeHTML(c.name) + '</span>'
        +     '<span class="gender-chip ' + (c.gender === '여' ? 'f' : 'm') + '">' + c.gender + '</span>'
        +   '</div>'
        +   '<span class="cust-text">' + c.phone + '</span>'
        +   '<span class="cust-text">' + c.birth + '</span>'
        +   '<span class="cust-reg">' + c.reg + '</span>'
        +   '<div class="cust-action">'
        +     '<button class="auth-btn" type="button">'
        +       '<svg class="ic-svg" width="13" height="13"><use href="#i-send"/></svg>'
        +       '본인인증'
        +     '</button>'
        +   '</div>'
        + '</div>';
    }).join('');

    tbody.querySelectorAll('.cust-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var idx = parseInt(row.dataset.idx, 10);
        selectCustomer(CUSTOMERS[idx]);
      });
    });
  }

  function selectCustomer(c) {
    state.selected = c;
    state.step = 2;
    state.carrier = null;
    state.rrnBack = '';
    state.code = '';
    document.getElementById('auth-avatar').textContent = c.name[0];
    document.getElementById('auth-name').textContent = c.name;
    var genderEl = document.getElementById('auth-gender');
    genderEl.textContent = c.gender;
    genderEl.className = 'gender-chip ' + (c.gender === '여' ? 'f' : 'm');
    document.getElementById('auth-meta').textContent = c.birth + ' · ' + c.phone;
    refreshUI();
  }

  // ===== UI 라우팅 =====
  function refreshUI() {
    var paneSelect = document.getElementById('pane-select');
    var paneAuth = document.getElementById('pane-auth');
    var backLink = document.getElementById('back-link');
    var card = document.getElementById('auth-card');

    if (state.step === 1) {
      paneSelect.hidden = false;
      paneAuth.hidden = true;
      backLink.href = 'history.html';
      backLink.onclick = null;
    } else {
      paneSelect.hidden = true;
      paneAuth.hidden = false;
      backLink.href = '#';
      backLink.onclick = function (e) {
        e.preventDefault();
        if (state.step === 2) {
          state.step = 1;
        } else if (state.step === 3) {
          state.step = 2;
        } else if (state.step === 4) {
          state.step = 3;
        }
        refreshUI();
      };
      renderAuthBody();
      // 카드 펄스 애니메이션 재적용
      card.classList.remove('nr-pop');
      void card.offsetWidth;
      card.classList.add('nr-pop');
    }
    updateSteps();
  }

  function updateSteps() {
    var dots = document.querySelectorAll('#step-dots .step');
    dots.forEach(function (el) {
      var s = parseInt(el.dataset.step, 10);
      el.classList.remove('on', 'done');
      if (state.step === 1 && s === 1) el.classList.add('on');
      else if ((state.step === 2 || state.step === 3) && s === 1) el.classList.add('done');
      else if ((state.step === 2 || state.step === 3) && s === 2) el.classList.add('on');
      else if (state.step === 4 && (s === 1 || s === 2)) el.classList.add('done');
      else if (state.step === 4 && s === 3) el.classList.add('on');
    });
  }

  // ===== 인증 본문 렌더링 =====
  function renderAuthBody() {
    if (state.step === 2) renderAuthForm();
    else if (state.step === 3) renderAuthCode();
    else if (state.step === 4) renderAuthDone();
  }

  function renderAuthForm() {
    var c = state.selected;
    var rrnFront = getRrnFront(c.birth);
    var body = document.getElementById('auth-body');
    var isAllYears = state.years.length === YEARS.length;
    body.innerHTML = ''
      + '<div class="auth-body nr-fade">'
      +   '<div class="auth-info">'
      +     '<svg class="ic-svg" width="16" height="16"><use href="#i-shield"/></svg>'
      +     '<span class="txt"><b>미청구보험금 조회</b>를 위해<br/>카카오톡 간편인증을 진행합니다.</span>'
      +   '</div>'
      +   '<div class="year-section">'
      +     '<div class="year-l">조회 연도<span class="year-hint">최근 5년 중 복수 선택 가능</span></div>'
      +     '<div class="year-checks" id="af-years">'
      +       '<div class="year-row-all">'
      +         '<label class="year-check all"><input type="checkbox" data-year="all"' + (isAllYears ? ' checked' : '') + ' /><span class="lbl">전체</span></label>'
      +       '</div>'
      +       '<div class="year-row-list">'
      +         YEARS.map(function (y) {
                  var checked = state.years.indexOf(y) >= 0 ? ' checked' : '';
                  return '<label class="year-check"><input type="checkbox" data-year="' + y + '"' + checked + ' /><span class="lbl">' + y + '년</span></label>';
                }).join('')
      +       '</div>'
      +     '</div>'
      +   '</div>'
      +   '<div class="field">'
      +     '<label class="field-l" for="af-name">이름</label>'
      +     '<input class="input-box" type="text" id="af-name" value="' + escapeHTML(c.name) + '" readonly />'
      +   '</div>'
      +   '<div class="field">'
      +     '<label class="field-l">주민등록번호</label>'
      +     '<div class="rrn-row">'
      +       '<input class="input-box rrn-front" type="text" id="af-rrn1" value="' + rrnFront + '" readonly />'
      +       '<span class="rrn-sep">—</span>'
      +       '<input class="input-box rrn-back" type="text" id="af-rrn2" placeholder="뒷 7자리" inputmode="numeric" maxlength="7" autocomplete="off" />'
      +     '</div>'
      +   '</div>'
      +   '<div class="field">'
      +     '<label class="field-l">통신사</label>'
      +     '<div class="carrier-row" id="af-carrier">'
      +       CARRIERS.map(function (cr) {
                return '<button type="button" class="carrier-btn ' + (state.carrier === cr ? 'on' : '') + '" data-carrier="' + escapeHTML(cr) + '">' + escapeHTML(cr) + '</button>';
              }).join('')
      +     '</div>'
      +   '</div>'
      +   '<div class="field">'
      +     '<label class="field-l" for="af-phone">휴대폰번호</label>'
      +     '<input class="input-box" type="text" id="af-phone" value="' + c.phone + '" readonly />'
      +   '</div>'
      + '</div>'
      + '<div class="auth-cta">'
      +   '<button class="btn-primary" type="button" id="send-code">'
      +     '다음'
      +     '<svg class="ic-svg" width="15" height="15"><use href="#i-chevron-right"/></svg>'
      +   '</button>'
      + '</div>';

    // 통신사 선택
    document.querySelectorAll('#af-carrier .carrier-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        state.carrier = b.dataset.carrier;
        document.querySelectorAll('#af-carrier .carrier-btn').forEach(function (x) {
          x.classList.toggle('on', x.dataset.carrier === state.carrier);
        });
      });
    });

    // 조회 연도 (체크박스, 복수 선택 + 전체 토글)
    function paintYears() {
      var isAll = state.years.length === YEARS.length;
      document.querySelectorAll('#af-years input[type="checkbox"]').forEach(function (x) {
        var yr = x.dataset.year;
        x.checked = (yr === 'all') ? isAll : state.years.indexOf(yr) >= 0;
      });
    }
    document.querySelectorAll('#af-years input[type="checkbox"]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var y = cb.dataset.year;
        if (y === 'all') {
          state.years = cb.checked ? YEARS.slice() : [];
        } else {
          var idx = state.years.indexOf(y);
          if (cb.checked && idx < 0) state.years.push(y);
          else if (!cb.checked && idx >= 0) state.years.splice(idx, 1);
        }
        paintYears();
      });
    });

    // 주민번호 뒷자리 — 첫 자리 오픈 + 나머지 6자리 점으로 마스킹
    var rrn2 = document.getElementById('af-rrn2');
    function maskDisplay(real) {
      if (!real) return '';
      if (real.length === 1) return real;
      return real[0] + '●'.repeat(real.length - 1);
    }
    // 재진입 시 기존 값 복원
    rrn2.value = maskDisplay(state.rrnBack);
    rrn2.addEventListener('input', function () {
      var typed = rrn2.value;
      var oldLen = state.rrnBack.length;
      if (typed.length > oldLen) {
        // 새로 입력된 문자만 숫자로 추출해서 뒤에 붙임
        var added = typed.slice(oldLen).replace(/\D/g, '');
        state.rrnBack = (state.rrnBack + added).slice(0, 7);
      } else {
        // 삭제 → 같은 길이만큼 잘라냄
        state.rrnBack = state.rrnBack.slice(0, typed.length);
      }
      var disp = maskDisplay(state.rrnBack);
      rrn2.value = disp;
      rrn2.setSelectionRange(disp.length, disp.length);
    });

    // 인증번호 전송
    document.getElementById('send-code').addEventListener('click', function () {
      state.step = 3;
      state.code = '';
      state.secs = 180;
      refreshUI();
    });
  }

  function renderAuthCode() {
    var body = document.getElementById('auth-body');
    body.innerHTML = ''
      + '<div class="auth-body nr-fade">'
      +   '<div class="kakao-wait">'
      +     '<div class="kakao-ic"><svg class="ic-svg" width="40" height="40"><use href="#i-message"/></svg></div>'
      +     '<div class="kakao-title">카카오톡에서 인증을 진행해 주세요</div>'
      +     '<div class="kakao-desc">고객님 휴대폰의 카카오톡 알림을 확인하고<br/>인증을 완료한 후 아래 버튼을 눌러 주세요.</div>'
      +   '</div>'
      + '</div>'
      + '<div class="auth-cta">'
      +   '<button class="btn-secondary" type="button" id="back-form">이전</button>'
      +   '<button class="btn-primary" type="button" id="verify-btn">'
      +     '<svg class="ic-svg" width="15" height="15"><use href="#i-check"/></svg>'
      +     '인증 완료'
      +   '</button>'
      + '</div>';

    document.getElementById('verify-btn').addEventListener('click', function () {
      clearInterval(timer);
      state.step = 4;
      refreshUI();
    });

    document.getElementById('back-form').addEventListener('click', function () {
      clearInterval(timer);
      state.step = 2;
      refreshUI();
    });
  }

  function renderAuthDone() {
    var c = state.selected;
    var body = document.getElementById('auth-body');
    body.innerHTML = ''
      + '<div class="auth-body nr-fade">'
      +   '<div class="done-wrap">'
      +     '<div class="done-ic"><svg class="ic-svg" width="40" height="40" stroke-width="2.4"><use href="#i-check"/></svg></div>'
      +     '<div class="done-badge">'
      +       '<svg class="ic-svg" width="13" height="13"><use href="#i-check"/></svg>'
      +       '본인인증 완료'
      +     '</div>'
      +     '<div class="done-title">본인인증이 완료되었어요</div>'
      +     '<div class="done-desc">리포트 작성을 완료했어요</div>'
      +   '</div>'
      + '</div>'
      + '<div class="auth-cta">'
      +   '<button class="btn-primary" type="button" id="goto-report">'
      +     '<svg class="ic-svg" width="15" height="15"><use href="#i-file-text"/></svg>'
      +     '미청구보험금 결과 확인하기'
      +   '</button>'
      + '</div>';

    document.getElementById('goto-report').addEventListener('click', function () {
      window.location.href = 'result.html';
    });
  }

  function fmtMMSS(s) {
    var m = String(Math.floor(s / 60)).padStart(2, '0');
    var ss = String(s % 60).padStart(2, '0');
    return m + ':' + ss;
  }

  // ===== 이벤트 바인딩 =====
  document.getElementById('cust-search').addEventListener('input', function (e) {
    state.query = e.target.value.trim();
    renderCustList();
  });

  // 신규 고객 모달
  var modal = document.getElementById('new-cust-modal');
  document.getElementById('open-new-cust').addEventListener('click', function () {
    modal.hidden = false;
  });
  document.getElementById('close-new-cust').addEventListener('click', function () {
    modal.hidden = true;
  });
  document.getElementById('cancel-new-cust').addEventListener('click', function () {
    modal.hidden = true;
  });
  document.getElementById('save-new-cust').addEventListener('click', function () {
    modal.hidden = true;
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.hidden = true;
  });

  // 성별 토글
  document.querySelectorAll('#nc-gender .carrier-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#nc-gender .carrier-btn').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
    });
  });

  // 초기 렌더
  renderCustList();
  refreshUI();

  // ===== URL 파라미터 ?customer=이름 → step 2(본인인증)로 자동 진입 =====
  // (고객 상세에서 "조회 시작하기" 클릭 시 고객을 다시 고르지 않도록)
  (function () {
    var params = new URLSearchParams(window.location.search);
    var target = params.get('customer');
    if (!target) return;
    var matched = CUSTOMERS.filter(function (c) { return c.name === target; })[0];
    if (matched) selectCustomer(matched);
  })();
})();
</script>

<script src="../../components/layout.js"></script>
<script>injectShell('claim');</script>
<script>
  // 모바일 GNB topbar 재구성 — 뒤로가기 · 화면 제목 (액션 없음)
  // 뒤로가기는 nr-title-row의 back-link click을 프록시 → 스텝별 동작 유지
  (function () {
    var topbar = document.querySelector('.m-topbar');
    if (!topbar) return;
    topbar.classList.add('detail-mode');
    topbar.innerHTML = ''
      + '<button class="m-back" type="button" aria-label="뒤로가기" id="m-back-proxy">'
      +   '<svg class="ic-svg" width="22" height="22"><use href="#i-chevron-left"/></svg>'
      + '</button>'
      + '<span class="m-title">새롭게 조회하기</span>'
      + '<span class="m-spacer" aria-hidden="true"></span>';

    document.getElementById('m-back-proxy').addEventListener('click', function () {
      var backLink = document.getElementById('back-link');
      if (backLink) backLink.click();
    });
  })();
</script>
</body>
