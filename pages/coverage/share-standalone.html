<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 보장분석 결과</title>
<style>
  /* ============================================================
     BoBi v2 — 보장분석 결과 공유 화면 (standalone)
     앱 셸(GNB/사이드바/injectShell)에 의존하지 않는 단일 HTML 파일.
     pages/coverage/share.html의 고객 공유 화면과 동일한 내용을 담되,
     이 파일 하나만으로 열람·인쇄·전달할 수 있도록 디자인 토큰과
     아이콘, 푸터를 전부 인라인으로 포함했다.
     ============================================================ */

  @font-face {
    font-family: 'Pretendard';
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    src: url('../../styles/fonts/PretendardVariable.woff2') format('woff2-variations');
  }

  :root {
    --brand:        #42BAFF;
    --brand-bright: #66E1FF;
    --brand-soft:   #C2F3FF;
    --brand-pale:   #EEF9FF;
    --brand-hover:  #2BA4EE;
    --brand-deep:   #1C50A1;
    --brand-ink:    #092535;
    --brand-grad:   linear-gradient(135deg, #66E1FF 0%, #42BAFF 45%, #1C50A1 100%);

    --white:    #FFFFFF;
    --bg:       #FFFFFF;
    --bg-soft:  #F4F7FA;
    --bg-warm:  #F8FAFC;
    --line:     #E6EBF0;
    --line-strong: #D4DBE2;

    --ink:      #0E1A24;
    --ink-2:    #44545F;
    --ink-3:    #7C8B97;
    --ink-4:    #AEB9C2;

    --success: #1FA463;
    --warning: #F6A609;

    --fs-h1:      24px;
    --fs-h2:      19px;
    --fs-body:    15px;
    --fs-option:  13px;

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 22px;
    --r-pill: 100px;

    --sh-1: 0 1px 2px rgba(14,26,36,.04), 0 2px 8px rgba(14,26,36,.05);
    --sh-2: 0 8px 24px rgba(14,26,36,.08), 0 2px 6px rgba(14,26,36,.05);
    --sh-brand: 0 10px 30px rgba(66,186,255,.32);

    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body {
    font-family: 'Pretendard', system-ui, sans-serif;
    color: var(--ink);
    font-feature-settings: "ss01","ss02";
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 중앙 정렬 컨테이너 ===== */
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 24px 0; }

  /* ===== 상단 헤더 ===== */
  .shr-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 32px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .shr-head-l { display: flex; align-items: center; gap: 16px; }
  .shr-head-l .patient-avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-family: inherit; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; user-select: none; }
  .shr-head h1 { font-size: var(--fs-h1); font-weight: 800; line-height: 1.4; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .shr-head-sub { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; line-height: 1.4; margin-top: 4px; }

  /* 공유 버튼 + 드롭다운 (인쇄하기 / PDF 전송) */
  .menu-popover { position: relative; display: inline-block; }
  .menu-list { position: absolute; top: calc(100% + 8px); right: 0; min-width: 200px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--sh-2); z-index: 40; }
  .menu-list[hidden] { display: none; }
  .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: transparent; border: none; border-radius: 8px; font-family: inherit; font-size: var(--fs-body); font-weight: 500; color: var(--ink); text-align: left; white-space: nowrap; cursor: pointer; transition: background-color .15s ease; }
  .menu-item:hover { background: var(--bg-soft); }
  .menu-item svg { color: var(--ink-3); flex: none; }
  .shr-share-btn { display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 20px; border-radius: var(--r-pill); background: var(--brand-grad); color: #fff; border: none; box-shadow: var(--sh-brand); font-family: inherit; font-size: var(--fs-body); font-weight: 700; letter-spacing: -0.01em; line-height: 1.4; cursor: pointer; white-space: nowrap; transition: filter .15s ease; }
  .shr-share-btn:hover { filter: brightness(1.05); }
  .shr-share-btn svg { color: currentColor; flex: none; }

  /* ===== 섹션 제목 ===== */
  .shr-section { margin-bottom: 36px; }
  .shr-section-title { display: flex; align-items: center; gap: 8px; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; line-height: 1.4; margin: 0 0 16px; }
  .shr-section-title svg { color: var(--brand-deep); }

  /* ===== 보장 카테고리 카드 ===== */
  .shr-cat-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px 24px; margin-top: 16px; }
  .shr-cat-card:first-child { margin-top: 0; }
  .shr-cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .shr-cat-ic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-soft); display: grid; place-items: center; font-size: 19px; line-height: 1; }
  .shr-cat-head h3 { margin: 0; font-size: var(--fs-h2); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.4; }

  .shr-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-body); line-height: 1.4; }
  .shr-row:last-of-type { border-bottom: none; }
  .shr-row-l { color: var(--ink-2); font-weight: 500; }
  .shr-row-v { color: var(--ink); font-weight: 700; white-space: nowrap; letter-spacing: -0.01em; }
  .shr-row-v small { font-size: var(--fs-option); font-weight: 500; color: var(--ink-3); margin-left: 3px; }

  .shr-empty { margin: 0; padding: 2px 0 4px; font-size: var(--fs-body); color: var(--ink-3); font-weight: 500; line-height: 1.4; }

  .shr-missing { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .shr-missing-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; line-height: 1.4; }
  .shr-chip { display: inline-flex; align-items: center; font-size: var(--fs-option); font-weight: 700; padding: 4px 10px; border-radius: var(--r-pill); background: #FFF0F1; color: #C92238; line-height: 1.4; }

  .shr-tip { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; padding: 12px 14px; background: var(--brand-pale); border-radius: var(--r-sm); }
  .shr-tip-ic { flex: none; line-height: 1.4; }
  .shr-tip-txt { font-size: var(--fs-option); color: var(--ink); font-weight: 600; line-height: 1.4; }
  .shr-tip-src { display: block; margin-top: 3px; font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; line-height: 1.4; }

  /* ===== 지금 가지고 있는 보험 ===== */
  .shr-sum-tiles { display: flex; gap: 12px; margin-bottom: 20px; }
  .shr-sum-tile { flex: 1 1 220px; background: #fff; border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 16px 20px; }
  .shr-sum-l { display: block; font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; line-height: 1.4; }
  .shr-sum-v { display: block; margin-top: 6px; font-size: var(--fs-h1); font-weight: 800; letter-spacing: -0.02em; color: var(--ink); line-height: 1.4; }

  .shr-policy-list { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .shr-policy-row { padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .shr-policy-row:last-child { border-bottom: none; }
  .shr-policy-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .shr-policy-name { font-size: var(--fs-body); color: var(--ink-2); font-weight: 500; line-height: 1.4; }
  .shr-policy-name b { font-weight: 700; color: var(--ink); margin-right: 6px; }
  .shr-policy-amt { font-size: var(--fs-body); font-weight: 700; color: var(--ink); white-space: nowrap; letter-spacing: -0.01em; }
  .shr-policy-amt.na { color: var(--ink-3); font-weight: 500; }
  .shr-policy-prog { margin-top: 10px; }
  .shr-prog-bar { height: 7px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .shr-prog-fill { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
  .shr-prog-txt { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; line-height: 1.4; }
  .shr-prog-txt b { color: var(--ink-2); font-weight: 700; }

  .shr-disclaim { margin: 24px 4px 40px; font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; line-height: 1.4; }

  /* ===== 푸터 ===== */
  .ft { background: #fff; border-top: 1px solid var(--line); padding: 28px 24px 36px; }
  .ft-inner { max-width: 920px; margin: 0 auto; }
  .ft-info { font-size: var(--fs-option); color: var(--ink-3); line-height: 1.7; }
  .ft-info p { margin: 0; }
  .ft-info .ft-sep-dot { color: var(--ink-4); margin: 0 8px; }

  /* ===== 인쇄 ===== */
  @media print {
    .shr-head .menu-popover, .shr-toast { display: none !important; }
  }

  /* ===== 반응형 ===== */
  @media (max-width: 720px) {
    .wrap { padding: 20px 16px 0; }
    .shr-head { flex-direction: column; align-items: flex-start; gap: 14px; padding-bottom: 18px; margin-bottom: 20px; }
    .shr-share-btn { align-self: flex-start; height: 40px; padding: 0 16px; font-size: var(--fs-option); }
    .shr-sum-tiles { flex-direction: column; }
    .shr-policy-top { flex-direction: column; align-items: flex-start; gap: 4px; }
    .shr-cat-card { padding: 18px 16px; }
    .ft { padding: 20px 16px 28px; }
  }

  /* ===== 공유 완료 토스트 ===== */
  .shr-toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(8px); background: var(--ink); color: #fff; font-size: var(--fs-option); font-weight: 600; padding: 12px 20px; border-radius: var(--r-pill); box-shadow: var(--sh-2); opacity: 0; transition: opacity .2s ease, transform .2s ease; z-index: 100; pointer-events: none; }
  .shr-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">

<script>
(function () {
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var won = function (n) {
    n = Math.round(n);
    if (n === 0) return '0원';
    var man = Math.round(n / 10000);
    var eok = Math.floor(man / 10000), rest = man % 10000;
    if (eok && rest) return eok + '억 ' + rest.toLocaleString('ko-KR') + '만원';
    if (eok) return eok + '억원';
    return rest.toLocaleString('ko-KR') + '만원';
  };

  // ===== 고객 아바타 — 이름 해시 기반 팔레트 색상 (components/layout.js의 paintPatientAvatars와 동일한 규칙) =====
  var AVATAR_PALETTE = ['#8FB8C4','#E89A9A','#B89AC4','#9AC4A6','#D4B88A','#9AB8E0','#E0A8C0','#9AC4B8','#C49AAE','#A8BFA4'];
  function hashName(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) { h = ((h << 5) - h) + name.charCodeAt(i); h = h | 0; }
    return Math.abs(h);
  }
  document.querySelectorAll('.patient-avatar[data-name]').forEach(function (el) {
    var name = el.dataset.name;
    el.textContent = name.charAt(0);
    el.style.background = AVATAR_PALETTE[hashName(name) % AVATAR_PALETTE.length];
  });

  // 보유 담보 금액 — pages/coverage/result.html의 G(담보별 상품 매트릭스) 합계와 동일한 값
  var AMT = {

    '일반암': 105000000, '유사암': 12000000,
    '뇌혈관질환': 15000000, '허혈성심장질환': 15000000,

    '상해수술비': 2000000, '암수술비': 4000000, '질병입원일당': 40000,

  };

  // 카테고리 — 보장 점수·의견(SCORE_CATS)과 동일한 7개 분류, 고객이 읽기 쉬운 순서로 재배열
  var CATS = [

        { name: '상해사망', label: '사고로 사망하면 가족에게' },

    { title: '치매·간병', icon: '🧠',
      items: [
        { name: '장기요양간병비', label: '장기요양이 필요하면' },
        { name: '경증치매진단', label: '치매 진단을 받으면' },
        { name: '간병인/간호간병상해일당', label: '상해로 간병이 필요하면' },
        { name: '간병인/간호간병질병일당', label: '질병으로 간병이 필요하면' }
      ],
      tip: { text: '치매환자는 2026년 100만 명을 넘을 것으로 전망되며, 1인당 연간 관리비용은 약 2,639만 원입니다.', src: '보건복지부·중앙치매센터 「2023년 치매역학조사」' } },
    { title: '암 진단', icon: '🩺',

      tip: { text: '기대수명까지 생존 시 암에 걸릴 확률은 남자 44.6%(2명 중 1명), 여자 38.2%(3명 중 1명)입니다. 5년 상대생존율은 72.9%로 높아졌습니다.', src: '보건복지부·중앙암등록본부 「2023년 국가암등록통계」' } },
    { title: '뇌·심장 진단', icon: '❤️',
      items: [
        { name: '뇌혈관질환', label: '뇌혈관질환 진단을 받으면' },

    { title: '수술/입원', icon: '🩹',
      items: [
        { name: '상해수술비', label: '다쳐서 수술을 받으면' },
        { name: '질병수술비', label: '병으로 수술을 받으면' },
        { name: '암수술비', label: '암 수술을 받으면' },
        { name: '뇌혈관질환수술비', label: '뇌혈관질환으로 수술을 받으면' },

  ];

  function catCard(cat) {
    var held = [], missing = [];
    cat.items.forEach(function (it) {
      var amt = AMT[it.name] || 0;
      if (amt > 0) held.push({ it: it, amt: amt }); else missing.push(it.name);
    });

    var bodyHtml = held.length
      ? held.map(function (h) {
          var daily = h.it.name.indexOf('일당') > -1;
          return '<div class="shr-row"><span class="shr-row-l">' + esc(h.it.label) + '</span>'
            + '<span class="shr-row-v">' + won(h.amt) + (daily ? '<small>(1일당)</small>' : '') + '</span></div>';
        }).join('')
      : '<p class="shr-empty">이 분야는 지금 준비된 보장이 없어요.</p>';

    var missingHtml = missing.length
      ? '<div class="shr-missing"><span class="shr-missing-l">⚠️ 아직 없는 담보</span>'
        + missing.map(function (n) { return '<span class="shr-chip">' + esc(n) + '</span>'; }).join('')
        + '</div>'
      : '';

    var tipHtml = cat.tip
      ? '<div class="shr-tip"><span class="shr-tip-ic">💡</span><span>'
        + '<span class="shr-tip-txt">' + esc(cat.tip.text) + '</span>'
        + '<span class="shr-tip-src">' + esc(cat.tip.src) + '</span>'
        + '</span></div>'
      : '';

    return '<article class="shr-cat-card">'
      + '<div class="shr-cat-head"><span class="shr-cat-ic">' + cat.icon + '</span><h3>' + esc(cat.title) + '</h3></div>'
      + bodyHtml + missingHtml + tipHtml
      + '</article>';
  }

  document.getElementById('shr-cats').innerHTML = CATS.map(catCard).join('');

  // ===== 지금 가지고 있는 보험 — pages/coverage/result.html의 계약 상세(C)와 동일한 9건 =====
  var C = [
    ['메리츠화재', '(무) 메리츠 운전자보험M-Drive1804', '2018.06.29', '20년납 / 80세', '25,800원', 99, 240, '2,554,200원', '3,637,800원'],
    ['메리츠화재', '(무) 메리츠 운전자 상해종합보험2507', '2025.08.18', '20년납 / 55세', '14,960원', 13, 240, '194,480원', '3,395,920원'],
    ['현대해상', 'Hicar 다이렉트(CM형) 개인용자동차보험', '2025.10.18', '— / 36세', '미제공', 0, 0, '—', '—'],
    ['KB손보', '(무)LIG생활보장보험', '2009.09.11', '20년납 / 100세', '50,000원', 204, 240, '10,200,000원', '1,800,000원'],
    ['푸본현대생명', '현대라이프 ZERO 5대성인병보험 무배당', '2014.09.05', '20년납 / 44세', '10,200원', 144, 240, '1,468,800원', '979,200원'],
    ['푸본현대생명', '현대라이프 ZERO 암보험무배당', '2014.10.13', '1년납 / 44세', '99,450원', 12, 12, '1,193,400원', '—'],
    ['DB생명', '(무) 유니버셜 더블종신보험(1604)', '2016.09.13', '10년납 / 종신', '103,447원', 120, 120, '12,413,640원', '—'],
    ['메리츠화재', '(무) 메리츠 Mom편한 어린이보험2007', '2020.08.10', '20년납 / 100세', '97,710원', 73, 240, '7,132,830원', '16,317,570원'],
    ['한화손보', '무배당 실속더한 든든보장보험1806', '2018.10.05', '20년납 / 100세', '141,645원', 95, 240, '13,456,275원', '20,538,525원']
  ];

  function term(c) { var s = String(c[3]).split('/'); return [s[0].trim() || '—', (s[1] || '').trim() || '—']; }

  function policyRow(c) {
    var t = term(c);
    var noPrem = c[4] === '미제공';
    var amtHtml = noPrem
      ? '<span class="shr-policy-amt na">보험료 정보 없음</span>'
      : '<span class="shr-policy-amt">' + c[4] + '</span>';
    var w = (!noPrem && c[6]) ? Math.round(c[5] / c[6] * 100) : null;
    var progHtml = w == null
      ? '<span class="shr-prog-txt">' + esc(t[1]) + '까지 보장</span>'
      : '<div class="shr-prog-bar"><span class="shr-prog-fill" style="width:' + w + '%"></span></div>'
        + '<span class="shr-prog-txt">' + c[6] + '번 중 <b>' + c[5] + '번</b> 냈어요 · ' + esc(t[1]) + '까지 보장</span>';
    return '<div class="shr-policy-row">'
      + '<div class="shr-policy-top"><span class="shr-policy-name"><b>' + esc(c[0]) + '</b>' + esc(c[1]) + '</span>' + amtHtml + '</div>'
      + '<div class="shr-policy-prog">' + progHtml + '</div>'
      + '</div>';
  }

  document.getElementById('shr-policy-list').innerHTML = C.map(policyRow).join('');

  var totalPremium = C.reduce(function (sum, c) {
    if (c[4] === '미제공') return sum;
    return sum + parseInt(c[4].replace(/[^0-9]/g, ''), 10);
  }, 0);
  document.getElementById('shr-sum-tiles').innerHTML =
    '<div class="shr-sum-tile"><span class="shr-sum-l">유지하고 있는 보험</span><span class="shr-sum-v">' + C.length + '개</span></div>'
    + '<div class="shr-sum-tile"><span class="shr-sum-l">매달 내는 보험료</span><span class="shr-sum-v">' + totalPremium.toLocaleString('ko-KR') + '원</span></div>';

  // ===== 공유 메뉴 (인쇄하기 / PDF 전송) =====
  (function () {
    var btn = document.getElementById('shr-share-btn');
    var menu = document.getElementById('shr-share-menu');
    var popover = btn.closest('.menu-popover');
    function openMenu() { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); });
    document.addEventListener('click', function (e) { if (!menu.hidden && !popover.contains(e.target)) closeMenu(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) closeMenu(); });

    function toast(msg) {
      var t = document.createElement('div');
      t.className = 'shr-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 250);
      }, 2200);
    }

    document.getElementById('shr-print-action').addEventListener('click', function () {
      closeMenu();
      window.print();
    });
    document.getElementById('shr-pdf-action').addEventListener('click', function () {
      closeMenu();
      toast('PDF가 고객에게 전송되었습니다.');
    });
  })();
})();
</script>
