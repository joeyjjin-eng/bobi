<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 내 고객</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 페이지 레이아웃 오버라이드 — GNB 좌측 고정, 콘텐츠 화면 센터 정렬 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; }
  .cE .emain > * { width: 100%; max-width: 1192px; margin-left: 0; margin-right: 0; min-width: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 페이지 타이틀 ===== */
  .cE .hist-title-row { width: calc(100% + 72px) !important; max-width: none !important; margin: 0 -36px 28px; padding: 0 0 22px; border-bottom: 1px solid var(--line); }
  .cE .hist-title-inner { max-width: 1192px; margin: 0 auto; padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .cE .ht-l { display: flex; align-items: center; gap: 14px; }
  .cE .ht-ic { width: 44px; height: 44px; border-radius: 12px; background: #FFE0CB; color: #C9603A; display: grid; place-items: center; flex: none; }
  .cE .ht-l h1 { font-size: var(--fs-h1); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .cE .ht-sub { font-size: var(--fs-option); color: var(--ink-3); margin-top: 2px; }
  .cE .ht-sub b { color: var(--ink); font-weight: 800; }
  .cE .ht-sub .ok { color: #15967F; font-weight: 800; }
  .cE .ht-actions { display: inline-flex; align-items: center; gap: 10px; flex: none; }
  .cE .add-btn {display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #FFC299 0%, #FF8E5C 45%, #C9603A 100%); color: #fff; border: none; border-radius: var(--r-pill); padding: 12px 24px; font-family: inherit; font-size: var(--fs-body); font-weight: 700; cursor: pointer; box-shadow: 0 10px 30px rgba(255, 142, 92, 0.32); text-decoration: none; letter-spacing: -0.01em; transition: filter .2s ease; }
  .cE .add-btn:hover { filter: brightness(1.05); }

  /* ===== 주간 실적 KPI 카드 (home.html .kpis 패턴 응용) ===== */
  .cE .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .cE .kpi-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 22px; display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }
  .cE .kc-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; display: inline-flex; align-items: center; gap: 7px; letter-spacing: -0.01em; }
  .cE .kc-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .cE .kc-dot.brand { background: var(--brand); }
  .cE .kc-dot.success { background: #15C0A0; }
  .cE .kc-dot.peach { background: #FF8E5C; }
  .cE .kc-v { font-size: var(--fs-h1); font-weight: 800; line-height: 1.1; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 12px; white-space: nowrap; }
  .cE .kc-v small { font-size: var(--fs-body); font-weight: 700; color: var(--ink-3); margin-left: 4px; }
  .cE .kc-v .plus { color: #15967F; margin-right: 2px; }
  .cE .kc-trend { font-size: var(--fs-option); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; letter-spacing: -0.01em; }
  .cE .kc-trend.up { color: #0E9A85; }
  .cE .kc-trend.down { color: #C92238; }
  .cE .kc-trend.flat { color: var(--ink-3); }
  .cE .kc-trend b { font-weight: 800; color: inherit; font-variant-numeric: tabular-nums; }

  /* ===== 검색바 (한 줄 카드) — history.html 패턴 ===== */
  .cE .search-bar { background: #fff; border-radius: var(--r-md); border: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .cE .search-bar > .si-ic { color: var(--ink-4); flex: none; display: flex; }
  .cE .search-bar input { flex: 1; border: none; outline: none; font-size: var(--fs-body); color: var(--ink); background: transparent; font-family: inherit; }
  .cE .search-bar input::placeholder { color: var(--ink-4); }
  .cE .sb-divider { width: 1px; height: 20px; background: var(--line-strong); }
  .cE .sort-select { position: relative; display: inline-flex; align-items: center; }
  .cE .sort-select svg.ic-svg { position: absolute; right: 4px; color: var(--ink-3); pointer-events: none; }
  .cE .sort-select select { appearance: none; -webkit-appearance: none; background: transparent; border: none; outline: none; padding: 0 24px 0 4px; font-family: inherit; font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); cursor: pointer; }

  /* ===== 필터바 (한 줄 카드) — history.html 패턴 ===== */
  .cE .filter-bar { background: #fff; border-radius: var(--r-md); border: 1px solid var(--line); padding: 14px 22px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  .cE .filter-group { display: flex; align-items: center; gap: 10px; }
  .cE .fg-l { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; }
  .cE .pills { display: flex; gap: 6px; }
  .cE .pill { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-3); border-radius: var(--r-pill); padding: 7px 14px; font-size: var(--fs-option); font-weight: 600; font-family: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .cE .pill:hover { color: var(--ink-2); border-color: var(--ink-4); }
  .cE .pill.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .cE .fb-divider { width: 1px; height: 20px; background: var(--line-strong); }
  .cE .fb-count { margin-left: auto; font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; }
  .cE .fb-count b { color: var(--ink); font-weight: 800; }

  /* ===== 리스트 패널 (unclaimed/history.html 패턴 응용) ===== */
  /* 컬럼: [chk] [등록일] [이름] [성별] [나이] [연락처] [1fr spacer] [약관동의] [조회상태] [▶]
     - 각 셀은 콘텐츠에 맞는 고정 폭
     - 중간 1fr 빈 셀이 두 그룹 사이의 시각적 분리 흡수
     - column-gap 12px 균등 */
  .cE .list-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
  .cE .table-head,
  .cE .table-row { display: grid; grid-template-columns: 24px 90px 170px 70px 80px 130px 1fr 170px 170px 22px; column-gap: 12px; align-items: center; justify-items: center; }
  .cE .table-head { padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--bg-soft); flex-shrink: 0; }
  .cE .table-head span { font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; text-align: center; }
  .cE .table-body { flex: 1; }
  .cE .table-row { padding: 20px 28px; cursor: pointer; transition: background-color 0.12s ease; border-bottom: 1px solid var(--line); text-decoration: none; }
  .cE .table-row:last-of-type { border-bottom: none; }
  .cE .table-row:hover { background: var(--bg-warm); }
  .cE .table-row:hover .tr-go { color: var(--brand); transform: translateX(2px); }

  /* 체크박스 (UI만 — 실제 동작 없음) */
  .cE .row-chk { width: 18px; height: 18px; border: 1.6px solid var(--line-strong); border-radius: 5px; background: #fff; cursor: pointer; display: block; }
  .cE .table-head .row-chk { margin: 0; }

  /* 이름 셀 — 아바타 + 이름 + 생년월일 (좌측 정렬) */
  .cE .tr-name { display: flex; align-items: center; justify-content: flex-start; gap: 14px; min-width: 0; justify-self: stretch; }
  .cE .tr-name .patient-avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #8FB8C4; color: #fff; flex: none; font-family: inherit; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; user-select: none; }
  .cE .tr-name .nm-stack { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; }
  /* 이름 컬럼(3번째)의 헤더 라벨도 좌측 정렬 통일 */
  .cE .table-head > *:nth-child(3) { justify-self: stretch; text-align: left; padding-left: 4px; }
  .cE .tr-name .nm { font-size: var(--fs-body); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; white-space: nowrap; }
  .cE .tr-name .nm-sub { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .cE .tr-name .nm-sub.empty { color: var(--ink-4); }

  /* 성별 칩 (history.html과 동일 톤) */
  .cE .tr-gender { text-align: center; }
  .cE .gender-chip { font-size: var(--fs-option); font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); display: inline-block; }
  .cE .gender-chip.f { background: #FEF0F0; color: #D96060; }
  .cE .gender-chip.m { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .cell-empty { color: var(--ink-4); font-size: var(--fs-body); font-weight: 500; }

  /* 나이 / 연락처 셀 */
  .cE .tr-age { font-size: var(--fs-body); color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.01em; }
  .cE .tr-phone { font-size: var(--fs-body); color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: -0.01em; }
  .cE .tr-date { font-size: var(--fs-option); color: var(--ink-3); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ===== 약관동의 셀 ===== */
  .cE .consent-stack { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .cE .consent-badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: var(--r-pill); font-size: var(--fs-option); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .cE .consent-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .cE .consent-badge.done { background: #E7FAF6; color: #15967F; }
  .cE .consent-badge.done::before { background: #2ABBA7; }
  .cE .consent-badge.wait { background: #FFF4E4; color: #B07816; }
  .cE .consent-badge.wait::before { background: #E6A23F; }
  .cE .consent-meta { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; padding-left: 0; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: center; }
  .cE .consent-meta b { color: var(--ink-2); font-weight: 700; }
  .cE .resend-link { color: var(--brand-deep); font-weight: 700; cursor: pointer; }
  .cE .resend-link:hover { text-decoration: underline; }

  /* ===== 조회상태 셀 — task pill + 호버 툴팁 ===== */
  .cE .task { position: relative; display: inline-flex; }
  .cE .task-pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); font-size: var(--fs-option); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; cursor: default; }
  .cE .task-pill svg { flex: none; }
  .cE .task-pill.ok { background: #E7FAF6; color: #15967F; }
  .cE .task-pill.prog { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .task-pill.wait { background: var(--bg-soft); color: var(--ink-3); }
  .cE .task-pill.wait svg { color: var(--ink-3); }

  .cE .tip { position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--ink); color: #fff; border-radius: 10px; padding: 11px 14px; min-width: 190px; box-shadow: var(--sh-2); opacity: 0; visibility: hidden; transition: opacity .15s ease, transform .15s ease; z-index: 30; pointer-events: none; }
  .cE .task:hover .tip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .cE .tip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--ink); }
  .cE .tip-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; font-size: var(--fs-option); font-weight: 600; line-height: 1.7; white-space: nowrap; }
  .cE .tip-row .k { color: rgba(255,255,255,0.72); }
  .cE .tip-row .v { font-weight: 800; }
  .cE .tip-row .v.miss { color: #FF9B97; }
  .cE .tip-row .v.done { color: #74E3C8; }

  /* chevron */
  .cE .tr-go { color: var(--ink-4); display: flex; align-items: center; justify-content: center; transition: color .12s ease, transform .12s ease; }

  /* 모바일 전용 meta 라인 — 데스크탑에선 숨김 */
  .cE .table-row .mobile-meta { display: none; }

  /* 빈 상태 */
  .cE .empty-list { padding: 60px 20px; text-align: center; font-size: var(--fs-body); color: var(--ink-3); }

  /* ===== 페이지네이션 ===== */
  .cE .pagination { border-top: 1px solid var(--line); padding: 20px 28px; display: flex; justify-content: center; gap: 6px; flex-shrink: 0; }
  .cE .pg-btn { min-width: 36px; height: 36px; padding: 0 11px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-family: inherit; font-size: var(--fs-option); font-weight: 600; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .cE .pg-btn:hover:not(.on):not(.dots) { background: var(--bg-soft); border-color: var(--line-strong); color: var(--ink); }
  .cE .pg-btn.on { background: var(--brand); color: #fff; border-color: var(--brand); cursor: default; }
  .cE .pg-btn.dots { border: none; cursor: default; background: transparent; color: var(--ink-4); min-width: 24px; padding: 0; }

  /* ============================================================
     반응형 (모바일) — 좌우 여백 16px 통일
     ============================================================ */
  @media (max-width: 960px) {
    /* 어떤 자식도 뷰포트 폭을 초과하지 않도록 안전망 */
    .cE .emain { overflow-x: hidden; }
    .cE .emain > * { max-width: 100%; }

    /* 타이틀 — 마이너스 마진 해제, 세로 스택 */
    .cE .hist-title-row { width: 100% !important; max-width: none !important; margin: 0 0 16px !important; padding: 0 0 14px !important; }
    .cE .hist-title-inner { flex-direction: column; align-items: stretch; gap: 12px; padding: 0; }
    .cE .ht-l { align-items: flex-start; gap: 12px; }
    .cE .ht-ic { width: 38px; height: 38px; border-radius: 10px; }
    .cE .ht-l h1 { font-size: var(--fs-h1); }
    .cE .ht-sub { font-size: var(--fs-option); }
    .cE .ht-actions { align-self: flex-end; }
    .cE .add-btn { padding: 10px 16px; font-size: var(--fs-option); box-shadow: 0 6px 16px rgba(255,142,92,0.28); }

    /* KPI 3개 → 1열 세로 스택 (숫자 오른쪽, 라벨/트렌드 왼쪽) */
    .cE .kpi-row { grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
    .cE .kpi-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; padding: 12px 14px; column-gap: 12px; }
    .cE .kc-l { grid-column: 1; font-size: var(--fs-option); white-space: normal; }
    .cE .kc-v { grid-column: 2; grid-row: 1 / span 2; font-size: var(--fs-sub); margin-top: 0; align-self: center; white-space: nowrap; }
    .cE .kc-v small { font-size: 12px; margin-left: 2px; }
    .cE .kc-trend { grid-column: 1; grid-row: 2; font-size: var(--fs-option); margin-top: 0; }

    /* 검색바 — 정렬 셀렉트 폰트 축소, 구분선 제거 */
    .cE .search-bar { padding: 10px 14px; gap: 10px; }
    .cE .search-bar input { min-width: 0; font-size: var(--fs-option); }
    .cE .sb-divider { display: none; }
    .cE .sort-select select { font-size: var(--fs-option); padding-right: 18px; }
    .cE .sort-select svg.ic-svg { right: 2px; }

    /* 필터바 — 세로 스택, 카운트는 오른쪽 정렬 별도 줄 */
    .cE .filter-bar { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px; }
    .cE .filter-group { flex-wrap: wrap; gap: 8px; }
    .cE .fb-divider { display: none; }
    .cE .fb-count { margin-left: 0; text-align: right; font-size: var(--fs-option); }
    .cE .pills { flex-wrap: wrap; gap: 5px; }
    .cE .pill { padding: 6px 12px; font-size: var(--fs-option); }

    /* 리스트 — 테이블 그리드를 카드형으로 재배치 */
    .cE .table-head { display: none; }
    .cE .list-panel { border-radius: var(--r-md); }
    .cE .table-row {
      display: grid !important;
      grid-template-columns: 20px minmax(0, 1fr) auto 16px;
      grid-template-areas:
        "chk name name go"
        "chk meta meta go"
        ".   cons task go"
        ".   date date .";
      column-gap: 8px;
      row-gap: 8px;
      padding: 12px 12px;
      align-items: center;
      justify-items: start;
    }
    .cE .table-row > *:nth-child(1) { grid-area: chk; align-self: start; margin-top: 4px; }
    .cE .table-row .tr-name { grid-area: name; justify-self: stretch; min-width: 0; gap: 10px; }
    .cE .table-row .tr-name .patient-avatar { width: 38px; height: 38px; font-size: 17px; }
    .cE .table-row .tr-name .nm { font-size: var(--fs-body); }

    /* 성별·나이·연락처 — 개별 셀은 숨기고 tr-name 내부의 mobile-meta 사용 */
    .cE .table-row .tr-gender,
    .cE .table-row .tr-age,
    .cE .table-row .tr-phone { display: none; }
    .cE .table-row .mobile-meta { grid-area: meta; justify-self: stretch; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: var(--fs-option); color: var(--ink-3); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
    .cE .table-row .mobile-meta .gender-chip { padding: 2px 7px; font-size: 12px; }
    .cE .table-row .mobile-meta .mm-sep { color: var(--ink-4); }
    .cE .table-row .mobile-meta .mm-age { color: var(--ink-2); font-weight: 600; }
    .cE .table-row .mobile-meta .mm-phone { color: var(--ink-2); }

    /* 배지 & 하단 등록일 */
    .cE .table-row > *:nth-child(7) { display: none; }
    .cE .table-row > *:nth-child(8) { grid-area: cons; justify-self: start; min-width: 0; }
    .cE .table-row > *:nth-child(9) { grid-area: task; justify-self: end; min-width: 0; }
    .cE .table-row .tr-date { grid-area: date; font-size: 12px; color: var(--ink-4); justify-self: end; }
    .cE .table-row .tr-go { grid-area: go; align-self: center; justify-self: center; }
    .cE .consent-stack { align-items: flex-start; gap: 3px; }
    .cE .consent-badge { padding: 0 9px; font-size: 12px; height: 24px; }
    .cE .consent-meta { text-align: left; font-size: var(--fs-option); }
    .cE .task-pill { padding: 0 10px; font-size: 12px; height: 26px; }
    .cE .task .tip { display: none; }

    /* 페이지네이션 — 여백 축소 */
    .cE .pagination { padding: 14px 12px; gap: 4px; }
    .cE .pg-btn { min-width: 32px; height: 32px; padding: 0 8px; font-size: var(--fs-option); }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">

    <!-- ===== 타이틀 ===== -->
    <div class="hist-title-row">
      <div class="hist-title-inner">
        <div class="ht-l">
          <div class="ht-ic">
            <svg class="ic-svg" width="22" height="22"><use href="#i-users"/></svg>
          </div>
          <div>
            <h1>내 고객</h1>
            <div class="ht-sub">총 <b id="ht-total">0</b>명 · 전체조회 완료 <span class="ok" id="ht-done">0</span>명</div>
          </div>
        </div>
        <div class="ht-actions">
          <a class="add-btn" href="new.html">
            <svg class="ic-svg" width="16" height="16"><use href="#i-plus"/></svg>
            고객 추가
          </a>
        </div>
      </div>
    </div>

    <!-- ===== 주간 실적 KPI ===== -->
    <div class="kpi-row">
      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot brand"></span>이번 주 신규 등록</span>
        <div class="kc-v"><span class="plus">+</span>3<small>명</small></div>
        <div class="kc-trend up">
          <svg class="ic-svg" width="13" height="13"><use href="#i-trending-up"/></svg>
          지난주 대비 <b>+1명</b>
        </div>
      </div>

      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot success"></span>이번 달 조회 완료</span>
        <div class="kc-v">12<small>명</small></div>
        <div class="kc-trend up">
          <svg class="ic-svg" width="13" height="13"><use href="#i-trending-up"/></svg>
          전월 대비 <b>+4명</b>
        </div>
      </div>

      <div class="kpi-card">
        <span class="kc-l"><span class="kc-dot peach"></span>누적 회수 가능 보험금</span>
        <div class="kc-v">3,842,000<small>원</small></div>
        <div class="kc-trend up">
          <svg class="ic-svg" width="13" height="13"><use href="#i-trending-up"/></svg>
          이번 달 <b>+1,275K원</b>
        </div>
      </div>
    </div>

    <!-- ===== 검색바 ===== -->
    <div class="search-bar">
      <span class="si-ic"><svg class="ic-svg" width="18" height="18"><use href="#i-search"/></svg></span>
      <input type="text" id="search-input" placeholder="이름 · 연락처로 검색" />
      <div class="sb-divider"></div>
      <div class="sort-select">
        <select id="sort-select">
          <option value="reg">최근 등록순</option>
          <option value="name">이름순</option>
          <option value="age">나이순</option>
        </select>
        <svg class="ic-svg" width="12" height="12"><use href="#i-chevron-down"/></svg>
      </div>
    </div>

    <!-- ===== 필터바 ===== -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="fg-l">성별</span>
        <div class="pills" id="gender-pills">
          <button class="pill on" data-gender="전체" type="button">전체</button>
          <button class="pill" data-gender="남" type="button">남</button>
          <button class="pill" data-gender="여" type="button">여</button>
        </div>
      </div>
      <div class="fb-divider"></div>
      <div class="filter-group">
        <span class="fg-l">연령대</span>
        <div class="pills" id="age-pills">
          <button class="pill on" data-age="전체" type="button">전체</button>
          <button class="pill" data-age="20대" type="button">20대</button>
          <button class="pill" data-age="30대" type="button">30대</button>
          <button class="pill" data-age="40대" type="button">40대</button>
          <button class="pill" data-age="50대" type="button">50대</button>
          <button class="pill" data-age="60대+" type="button">60대+</button>
        </div>
      </div>
      <span class="fb-count" id="count">총 <b>0명</b> 표시 중</span>
    </div>

    <!-- ===== 리스트 ===== -->
    <div class="list-panel">
      <div class="table-head">
        <span><span class="row-chk" aria-hidden="true"></span></span>
        <span>등록일</span>
        <span>이름</span>
        <span>성별</span>
        <span>나이(만)</span>
        <span>연락처</span>
        <span></span>
        <span>약관동의</span>
        <span>조회상태</span>
        <span></span>
      </div>
      <div class="table-body" id="tbl-body"></div>
      <div class="pagination">
        <button class="pg-btn on" type="button">1</button>
        <button class="pg-btn" type="button">2</button>
        <button class="pg-btn" type="button">3</button>
        <button class="pg-btn dots" type="button">…</button>
        <button class="pg-btn" type="button">5</button>
      </div>
    </div>

  </main>
</div>
<div id="footer-host"></div>
</div>

<script>
(function () {
  // ===== 데이터 ===================================================
  // consent: 'agreed'(약관동의 완료) | 'pending'(링크 발송 후 동의 대기)
  // pending 상태에서는 성별·나이·생년월일이 아직 비어 있음.
  // med / unc: 'done'(조회 완료) | 'prog'(진행 중) | 'none'(미조회)
  var ALL = [
    { name:'배태우', g:null,  age:null, birth:null,           phone:'010-4471-9920', reg:'2026.06.10', consent:'pending', link:'06.10', med:'none', unc:'none' },
    { name:'이지윤', g:null,  age:null, birth:null,           phone:'010-8830-2245', reg:'2026.06.10', consent:'pending', link:'06.10', med:'none', unc:'none' },
    { name:'김진주', g:'여', age:43,   birth:'1983.02.15',   phone:'010-1234-5678', reg:'2026.06.09', consent:'agreed',  link:'06.09', med:'done', unc:'done' },
    { name:'송민재', g:'남', age:62,   birth:'1963.11.02',   phone:'010-3392-7741', reg:'2026.06.09', consent:'agreed',  link:'06.09', med:'done', unc:'none' },
    { name:'장숙영', g:'여', age:42,   birth:'1983.03.28',   phone:'010-7715-2230', reg:'2026.06.08', consent:'agreed',  link:'06.08', med:'none', unc:'none' },
    { name:'황정연', g:'여', age:53,   birth:'1972.09.19',   phone:'010-4408-9912', reg:'2026.06.08', consent:'agreed',  link:'06.08', med:'done', unc:'done' },
    { name:'오미자', g:'여', age:46,   birth:'1979.12.05',   phone:'010-2256-6834', reg:'2026.06.08', consent:'agreed',  link:'06.08', med:'prog', unc:'none' },
    { name:'최부명', g:'남', age:44,   birth:'1981.05.23',   phone:'010-9981-4470', reg:'2026.06.08', consent:'agreed',  link:'06.08', med:'done', unc:'done' },
    { name:'김정운', g:'여', age:44,   birth:'1981.08.11',   phone:'010-3320-1185', reg:'2026.06.08', consent:'agreed',  link:'06.08', med:'none', unc:'none' },
    { name:'한재현', g:'남', age:55,   birth:'1970.02.17',   phone:'010-6627-3398', reg:'2026.06.07', consent:'agreed',  link:'06.07', med:'done', unc:'done' },
    { name:'이성환', g:'남', age:38,   birth:'1987.10.30',   phone:'010-1142-8806', reg:'2026.06.07', consent:'agreed',  link:'06.07', med:'done', unc:'none' },
    { name:'조미라', g:'여', age:67,   birth:'1958.06.09',   phone:'010-5570-2214', reg:'2026.06.07', consent:'agreed',  link:'06.07', med:'done', unc:'done' },
    { name:'정하윤', g:'여', age:31,   birth:'1994.04.21',   phone:'010-8839-5562', reg:'2026.06.06', consent:'agreed',  link:'06.06', med:'prog', unc:'none' },
    { name:'강태우', g:'남', age:49,   birth:'1976.01.08',   phone:'010-2204-7793', reg:'2026.06.06', consent:'agreed',  link:'06.06', med:'done', unc:'prog' },
    { name:'유지원', g:'여', age:27,   birth:'1998.11.26',   phone:'010-7781-3340', reg:'2026.06.06', consent:'agreed',  link:'06.06', med:'none', unc:'none' },
    { name:'안소비', g:'여', age:34,   birth:'1991.09.03',   phone:'010-3398-1027', reg:'2026.06.05', consent:'agreed',  link:'06.05', med:'done', unc:'none' }
  ];

  // ===== 상태 ===================================================
  var state = { gender: '전체', age: '전체', query: '', sort: 'reg' };

  var AGE_TEST = {
    '전체':   function () { return true; },
    '20대':   function (a) { return a != null && a >= 20 && a < 30; },
    '30대':   function (a) { return a != null && a >= 30 && a < 40; },
    '40대':   function (a) { return a != null && a >= 40 && a < 50; },
    '50대':   function (a) { return a != null && a >= 50 && a < 60; },
    '60대+':  function (a) { return a != null && a >= 60; }
  };

  var SORTERS = {
    reg:  function (a, b) { return a.reg < b.reg ? 1 : a.reg > b.reg ? -1 : 0; },
    name: function (a, b) { return a.name.localeCompare(b.name, 'ko'); },
    age:  function (a, b) { return (b.age || 0) - (a.age || 0); }
  };

  // ===== 유틸 ===================================================
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function filterList() {
    var q = state.query.trim();
    return ALL.filter(function (p) {
      // pending 행은 연령대 필터가 '전체'일 때만 통과 (성별/나이 미상)
      if (state.gender !== '전체') { if (p.g !== state.gender) return false; }
      if (state.age !== '전체') { if (!AGE_TEST[state.age](p.age)) return false; }
      if (q) { if (p.name.indexOf(q) === -1 && p.phone.indexOf(q) === -1) return false; }
      return true;
    }).sort(SORTERS[state.sort]);
  }

  // ===== 셀 렌더 ===================================================
  function consentCell(p) {
    if (p.consent === 'agreed') {
      return ''
        + '<div class="consent-stack">'
        +   '<span class="consent-badge done">동의 완료</span>'
        +   '<span class="consent-meta"><b>' + p.link + '</b> 등록</span>'
        + '</div>';
    }
    return ''
      + '<div class="consent-stack">'
      +   '<span class="consent-badge wait">동의 대기</span>'
      +   '<span class="consent-meta"><b>' + p.link + '</b> 발송 · <span class="resend-link">재전송</span></span>'
      + '</div>';
  }

  // 진료기록 + 미청구보험금 조회상태를 합쳐서 한 칩으로
  function taskCell(p) {
    var label, cls, ic;
    var ICONS = {
      ok:   '<svg class="ic-svg" width="13" height="13"><use href="#i-check"/></svg>',
      prog: '<svg class="ic-svg" width="13" height="13"><use href="#i-rotate-ccw"/></svg>',
      wait: '<svg class="ic-svg" width="13" height="13"><use href="#i-clock"/></svg>'
    };

    if (p.consent === 'pending') {
      cls = 'wait'; label = '조회 대기'; ic = ICONS.wait;
    } else {
      var doneN = (p.med === 'done' ? 1 : 0) + (p.unc === 'done' ? 1 : 0);
      if (doneN === 2) { cls = 'ok';   label = '전체완료';  ic = ICONS.ok; }
      else if (doneN === 0) { cls = 'wait'; label = '조회 대기';  ic = ICONS.wait; }
      else { cls = 'prog'; label = '일부조회';  ic = ICONS.prog; }
    }

    function statusWord(s) { return s === 'done' ? '완료' : (s === 'prog' ? '진행중' : '미조회'); }
    function tipRow(k, s) {
      var done = s === 'done';
      var v = done ? 'done' : 'miss';
      return '<div class="tip-row"><span class="k">' + k + '</span><span class="v ' + v + '">' + statusWord(s) + '</span></div>';
    }

    var tipHTML;
    if (p.consent === 'pending') {
      tipHTML = '<div class="tip-row"><span class="k">약관동의</span><span class="v miss">대기중</span></div>';
    } else {
      tipHTML = tipRow('진료기록', p.med) + tipRow('미청구보험금', p.unc);
    }

    return ''
      + '<span class="task">'
      +   '<span class="task-pill ' + cls + '">' + ic + label + '</span>'
      +   '<span class="tip">' + tipHTML + '</span>'
      + '</span>';
  }

  // ===== 메인 렌더 ===================================================
  function render() {
    var list = filterList();
    var doneAll = ALL.filter(function (p) { return p.med === 'done' && p.unc === 'done'; }).length;

    // 상단 타이틀 카운트
    document.getElementById('ht-total').textContent = ALL.length;
    document.getElementById('ht-done').textContent = doneAll;
    document.getElementById('count').innerHTML = '총 <b>' + list.length + '명</b> 표시 중';

    var body = document.getElementById('tbl-body');
    if (list.length === 0) {
      body.innerHTML = '<div class="empty-list">조건에 맞는 고객이 없어요</div>';
      return;
    }

    body.innerHTML = list.map(function (p) {
      var gCell = p.g
        ? '<span class="gender-chip ' + (p.g === '남' ? 'm' : 'f') + '">' + p.g + '</span>'
        : '<span class="cell-empty">—</span>';
      var ageCell = p.age != null ? p.age + '세' : '<span class="cell-empty">—</span>';
      var birthCell = p.birth
        ? '<span class="nm-sub">' + p.birth + '</span>'
        : '<span class="nm-sub empty">정보 수집 전</span>';
      // 상태별 라우팅:
      //  - pending(약관동의 대기) → detail-new.html (디폴트/빈 상태)
      //  - agreed + 둘 다 미시작 → detail-ready.html (조회 시작 가능)
      //  - agreed + 일부만 완료 → detail-progress.html (일부 조회)
      //  - 전체 완료 → detail.html (활성 상세)
      var detailHref;
      if (p.consent === 'pending') detailHref = 'detail-new.html';
      else if (p.med === 'done' && p.unc === 'done') detailHref = 'detail.html';
      else if (p.med === 'none' && p.unc === 'none') detailHref = 'detail-ready.html';
      else detailHref = 'detail-progress.html';

      // 모바일 meta 라인 — 성별칩 · 나이 · 연락처를 한 줄로
      var mmGender = p.g
        ? '<span class="gender-chip ' + (p.g === '남' ? 'm' : 'f') + '">' + p.g + '</span>'
        : '<span class="cell-empty">—</span>';
      var mmAge = p.age != null ? '<span class="mm-age">' + p.age + '세</span>' : '<span class="cell-empty">—</span>';
      var mobileMeta = ''
        + '<span class="mobile-meta">'
        +   mmGender
        +   '<span class="mm-sep">·</span>'
        +   mmAge
        +   '<span class="mm-sep">·</span>'
        +   '<span class="mm-phone">' + p.phone + '</span>'
        + '</span>';

      return ''
        + '<a class="table-row" href="' + detailHref + '">'
        +   '<span><span class="row-chk" aria-hidden="true"></span></span>'
        +   '<span class="tr-date">' + p.reg + '</span>'
        +   '<span class="tr-name">'
        +     '<span class="patient-avatar" data-name="' + escapeHTML(p.name) + '"></span>'
        +     '<span class="nm-stack"><span class="nm">' + escapeHTML(p.name) + '</span>' + birthCell + '</span>'
        +   '</span>'
        +   '<span class="tr-gender">' + gCell + '</span>'
        +   '<span class="tr-age">' + ageCell + '</span>'
        +   '<span class="tr-phone">' + p.phone + '</span>'
        +   '<span></span>'
        +   '<span>' + consentCell(p) + '</span>'
        +   '<span>' + taskCell(p) + '</span>'
        +   mobileMeta
        +   '<span class="tr-go"><svg class="ic-svg" width="16" height="16"><use href="#i-chevron-right"/></svg></span>'
        + '</a>';
    }).join('');

    // 아바타 채색 (layout.js가 노출하는 헬퍼)
    if (window.paintPatientAvatars) window.paintPatientAvatars();
  }

  // ===== 이벤트 바인딩 ===================================================
  document.querySelectorAll('#gender-pills .pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.gender = btn.dataset.gender;
      document.querySelectorAll('#gender-pills .pill').forEach(function (b) {
        b.classList.toggle('on', b.dataset.gender === state.gender);
      });
      render();
    });
  });
  document.querySelectorAll('#age-pills .pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.age = btn.dataset.age;
      document.querySelectorAll('#age-pills .pill').forEach(function (b) {
        b.classList.toggle('on', b.dataset.age === state.age);
      });
      render();
    });
  });
  document.getElementById('search-input').addEventListener('input', function (e) {
    state.query = e.target.value;
    render();
  });
  document.getElementById('sort-select').addEventListener('change', function (e) {
    state.sort = e.target.value;
    render();
  });

  // 행 클릭 시 체크박스만 누른 경우 페이지 이동 방지
  document.getElementById('tbl-body').addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('row-chk')) {
      e.preventDefault();
      e.target.classList.toggle('checked');
      e.target.style.background = e.target.classList.contains('checked') ? 'var(--brand)' : '#fff';
      e.target.style.borderColor = e.target.classList.contains('checked') ? 'var(--brand)' : '';
    }
  });

  render();
})();
</script>

<script src="../../components/layout.js"></script>
<script>injectShell('customer');</script>
</body>
</html>
