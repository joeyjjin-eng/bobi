<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoBi · 요금제</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 페이지 레이아웃 오버라이드 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; background: var(--bg-soft); }
  .cE .emain > * { width: 100%; max-width: 1192px; margin-left: 0; margin-right: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; background: var(--bg-soft); }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 페이지 타이틀 ===== */
  .cE .pl-title-row { display: flex; align-items: center; gap: 14px; padding-bottom: 22px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .cE .pl-title-row h1 { font-size: var(--fs-h1); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .cE .pl-title-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-pale); color: var(--brand-deep); display: grid; place-items: center; flex: none; }
  .cE .pl-title-sub { font-size: var(--fs-body); color: var(--ink-3); margin-top: 6px; font-weight: 500; }
  .cE .pl-title-txt { display: flex; flex-direction: column; }

  /* ===== 플랜 카드 3열 ===== */
  .cE .pl-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
  .cE .pl-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 26px 24px; display: flex; flex-direction: column; box-shadow: var(--sh-1); position: relative; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .cE .pl-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
  .cE .pl-card.cur { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(66,186,255,0.12), var(--sh-1); }
  .cE .pl-card-tag { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; letter-spacing: 0.05em; }
  .cE .pl-card-name { font-size: var(--fs-h1); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin: 4px 0 2px; }
  .cE .pl-card-desc { font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; margin-top: 2px; }
  .cE .pl-card-price { margin: 16px 0 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .cE .pl-card-price .pr-top { display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .cE .pl-card-price .pr-badge { display: inline-flex; align-items: center; background: #FFE9EC; color: #C92238; font-size: var(--fs-option); font-weight: 800; padding: 2px 8px; border-radius: var(--r-pill); letter-spacing: -0.01em; line-height: 1.4; }
  .cE .pl-card-price .pr-orig { font-size: var(--fs-option); color: var(--ink-4); text-decoration: line-through; font-weight: 500; }
  .cE .pl-card-price .pr-bottom { display: flex; align-items: baseline; gap: 4px; }
  .cE .pl-card-price .pr-v { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
  .cE .pl-card-price .pr-u { font-size: var(--fs-option); color: var(--ink-3); font-weight: 700; }
  .cE .pl-card-price .pr-free { font-size: var(--fs-body); font-weight: 800; color: var(--brand-deep); }
  .cE .pl-feat { list-style: none; padding: 0; margin: 0 0 22px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .cE .pl-feat li { display: flex; align-items: flex-start; gap: 10px; font-size: var(--fs-body); color: var(--ink); }
  .cE .pl-feat li .fi { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-pale); color: var(--brand-deep); display: grid; place-items: center; flex: none; margin-top: 1px; }
  .cE .pl-feat li.na { color: var(--ink-4); }
  .cE .pl-feat li.na .fi { background: #F0F2F4; color: #B4BDC5; }
  .cE .pl-feat li .fl { display: block; font-weight: 600; letter-spacing: -0.01em; }
  .cE .pl-feat li .fl b { font-weight: 800; }
  .cE .pl-feat li .fn { display: block; font-size: var(--fs-option); color: var(--ink-3); font-weight: 500; margin-top: 2px; }
  .cE .pl-card-cta { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 48px; border-radius: var(--r-pill); font-family: inherit; font-size: var(--fs-body); font-weight: 800; cursor: pointer; border: 1px solid transparent; letter-spacing: -0.01em; transition: filter .15s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
  .cE .pl-card-cta.primary { background: var(--brand-grad); color: #fff; box-shadow: var(--sh-brand); }
  .cE .pl-card-cta.primary:hover { filter: brightness(1.05); }
  .cE .pl-card-cta.ghost { background: #fff; color: var(--ink-2); border-color: var(--line-strong); }
  .cE .pl-card-cta.ghost:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--ink-3); }
  .cE .pl-card-cta.cur-cta { background: var(--bg-soft); color: var(--ink-3); border-color: var(--line); cursor: default; }
  .cE .pl-card-cta.cur-cta:hover { filter: none; }

  /* ===== 비교표 ===== */
  .cE .pl-cmp { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 24px; box-shadow: var(--sh-1); }
  .cE .pl-cmp-head { padding: 20px 24px 20px; }
  .cE .pl-cmp-head h2 { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin: 0; }
  .cE .pl-cmp-head p { font-size: var(--fs-option); color: var(--ink-3); margin: 4px 0 0; }
  .cE .pl-cmp-table { width: 100%; border-collapse: collapse; }
  .cE .pl-cmp-table th, .cE .pl-cmp-table td { padding: 14px 20px; text-align: center; font-size: var(--fs-body); border-bottom: 1px solid var(--line); }
  .cE .pl-cmp-table th { background: var(--bg-soft); font-weight: 800; color: var(--ink); font-size: var(--fs-option); letter-spacing: -0.01em; }
  .cE .pl-cmp-table th:first-child, .cE .pl-cmp-table td:first-child { text-align: left; font-weight: 500; color: var(--ink); }
  .cE .pl-cmp-table td.amt { font-weight: 400; }
  .cE .pl-cmp-table tr.price td { font-weight: 800; }
  .cE .pl-cmp-table tr.price td:first-child { font-weight: 700; }
  .cE .pl-cmp-table td.na { color: var(--ink-4); }
  .cE .pl-cmp-table tr:last-child td { border-bottom: none; }
  .cE .pl-cmp-table th.cur, .cE .pl-cmp-table td.cur { background: rgba(66,186,255,0.08); }
  .cE .pl-cmp-table th.cur { color: var(--brand-deep); }

  /* ===== 추가결제 안내 ===== */
  .cE .pl-extra { background: #FFF6EE; border: 1px solid #FBD8B5; border-radius: var(--r-md); padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start; margin-bottom: 40px; }
  .cE .pl-extra svg { color: #B8791D; flex: none; margin-top: 2px; }
  .cE .pl-extra .pex-t { font-size: var(--fs-body); font-weight: 800; color: #7A4B10; margin-bottom: 4px; letter-spacing: -0.01em; }
  .cE .pl-extra .pex-d { font-size: var(--fs-option); color: #7A4B10; font-weight: 500; line-height: 1.55; }
  .cE .pl-extra .pex-d b { font-weight: 800; }

  /* ===== 반응형 (모바일) ===== */
  @media (max-width: 960px) {
    .cE .pl-title-row { padding-bottom: 16px; margin-bottom: 16px; }
    .cE .pl-title-ic { width: 38px; height: 38px; }
    .cE .pl-title-row h1 { font-size: var(--fs-h2); }
    .cE .pl-cards { grid-template-columns: 1fr; gap: 12px; }
    .cE .pl-cmp-table { display: block; overflow-x: auto; white-space: nowrap; }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">

    <!-- 타이틀 -->
    <div class="pl-title-row">
      <div class="pl-title-ic"><svg class="ic-svg" width="22" height="22"><use href="#i-sparkles"/></svg></div>
      <div class="pl-title-txt">
        <h1>요금제 안내</h1>
        <div class="pl-title-sub">보비를 더 활용하는 방법을 선택하세요.</div>
      </div>
    </div>

    <!-- 플랜 카드 -->
    <div class="pl-cards" id="pl-cards"></div>

    <!-- 상세 비교표 -->
    <section class="pl-cmp">
      <div class="pl-cmp-head">
        <h2>플랜별 이용 한도</h2>
        <p>월 단위로 초기화됩니다. 자세한 산정 기준은 이용약관을 참고해 주세요.</p>
      </div>
      <table class="pl-cmp-table">
        <thead>
          <tr>
            <th>구분</th>
            <th id="cmp-th-free">FREE</th>
            <th id="cmp-th-basic">BASIC</th>
            <th id="cmp-th-pro">PRO</th>
          </tr>
        </thead>
        <tbody id="cmp-tbody"></tbody>
      </table>
    </section>

  </main>
</div>
<div id="footer-host"></div>
</div>

<script src="../../components/layout.js"></script>
<script>
  injectShell('mypage');

  (function () {
    var agent = window.getCurrentAgent();
    var plans = window.getPlans();
    var cur = window.getEffectivePlan();
    var CLAIM_EXTRA = window.getClaimExtraPrice();

    // 플랜 카드 3장
    var order = ['free', 'basic', 'pro'];
    var descMap = {
      free: '보비를 처음 시작하는 설계사에게',
      basic: '영업 활동이 활발한 설계사를 위한',
      pro: '실적 최상위, 영업왕을 위한 프리미엄'
    };
    var featureOrder = ['report', 'unclaimed', 'jjaepity', 'claim'];
    var cardsHost = document.getElementById('pl-cards');
    cardsHost.innerHTML = order.map(function (k) {
      var p = plans[k];
      var isCur = (cur.key === k);
      var discountMap = { basic: { orig: 9900, off: 40 }, pro: { orig: 29800, off: 50 } };
      var priceHtml;
      if (p.price === 0) {
        priceHtml = '<div class="pr-top"></div><div class="pr-free">무료</div>';
      } else {
        var d = discountMap[k];
        var top = d
          ? '<span class="pr-badge">오픈기념 ' + d.off + '%</span><span class="pr-orig">' + d.orig.toLocaleString() + '원</span>'
          : '';
        priceHtml = '<div class="pr-top">' + top + '</div>'
          + '<div class="pr-bottom"><div class="pr-v">' + p.price.toLocaleString() + '</div><div class="pr-u">원 / 월</div></div>';
      }

      var feats = featureOrder.map(function (f) {
        var limit = p.limits[f];
        var label = window.getFeatureLabel(f);
        if (limit > 0) {
          return '<li>'
            +   '<span class="fi"><svg class="ic-svg" width="12" height="12"><use href="#i-check"/></svg></span>'
            +   '<div><span class="fl">' + label + ' <b>' + limit + '건</b></span></div>'
            + '</li>';
        }
        return '<li class="na">'
          +   '<span class="fi"><svg class="ic-svg" width="12" height="12"><use href="#i-x"/></svg></span>'
          +   '<div><span class="fl">' + label + '</span></div>'
          + '</li>';
      }).join('');

      var cta;
      if (isCur) {
        cta = '<button class="pl-card-cta cur-cta" type="button" disabled>현재 이용중</button>';
      } else {
        var isUpgrade = (order.indexOf(k) > order.indexOf(cur.key));
        var cls = isUpgrade ? 'primary' : 'ghost';
        var label = isUpgrade ? '이 플랜으로 업그레이드' : '이 플랜으로 변경';
        cta = '<button class="pl-card-cta ' + cls + '" type="button" data-plan="' + k + '">' + label + '</button>';
      }

      return ''
        + '<div class="pl-card ' + (isCur ? 'cur' : '') + '">'
        +   '<div class="pl-card-tag">' + p.label + '</div>'
        +   '<div class="pl-card-name">' + p.label + '</div>'
        +   '<div class="pl-card-desc">' + descMap[k] + '</div>'
        +   '<div class="pl-card-price">' + priceHtml + '</div>'
        +   '<ul class="pl-feat">' + feats + '</ul>'
        +   cta
        + '</div>';
    }).join('');

    // 비교표
    var featLabels = { report: '진료기록리포트', unclaimed: '미청구보험금', jjaepity: '째피티', claim: '보험금청구' };
    var cmpFeatures = ['report', 'unclaimed', 'jjaepity'];
    var rows = cmpFeatures.map(function (f) {
      return { label: featLabels[f], values: order.map(function (k) { return plans[k].limits[f]; }) };
    });
    rows.push({ label: '월 정액', values: order.map(function (k) { return plans[k].price; }), isPrice: true });

    var tbody = document.getElementById('cmp-tbody');
    tbody.innerHTML = rows.map(function (r) {
      var cells = r.values.map(function (v, i) {
        var isCurCol = (order[i] === cur.key);
        var curCls = isCurCol ? ' cur' : '';
        if (r.isPrice) {
          var text = (v === 0) ? '무료' : v.toLocaleString() + '원';
          return '<td class="amt' + curCls + '">' + text + '</td>';
        }
        if (v === null) return '<td class="na' + curCls + '">—</td>';
        if (v === 0) return '<td class="na' + curCls + '">미포함</td>';
        return '<td class="amt' + curCls + '">' + v + '건</td>';
      }).join('');
      return '<tr' + (r.isPrice ? ' class="price"' : '') + '><td>' + r.label + '</td>' + cells + '</tr>';
    }).join('');

    // 현재 플랜 컬럼 헤더 강조
    ['free','basic','pro'].forEach(function (k) {
      var th = document.getElementById('cmp-th-' + k);
      if (th && k === cur.key) th.classList.add('cur');
    });

    // 플랜 변경 버튼 → 스위처 (데모 · localStorage)
    document.querySelectorAll('[data-plan]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var target = btn.getAttribute('data-plan');
        var name = plans[target].label;
        if (confirm(name + ' 플랜으로 변경하시겠습니까? (데모)')) {
          window.setCurrentPlan(target);
        }
      });
    });
  })();
</script>

</body>
</html>
