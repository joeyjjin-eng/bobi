<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자료 상세 · BoBi</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* ===== 페이지 레이아웃 오버라이드 — GNB 좌측 고정, 콘텐츠 화면 센터 정렬 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; }
  .cE .emain > * { width: 100%; max-width: 920px; margin-left: 0; margin-right: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 경로(breadcrumb, 단순 트레일) ===== */
  .cE .lib-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-option); font-weight: 500; color: var(--ink-3); margin-bottom: 18px; }
  .cE .lib-crumbs .sep { color: var(--line-strong); }
  .cE .lib-crumbs a { color: var(--ink-3); text-decoration: none; }
  .cE .lib-crumbs a:hover { color: var(--brand-deep); text-decoration: underline; }
  .cE .lib-crumbs .cur { color: var(--ink-2); font-weight: 700; }

  /* ===== 문서 헤더 ===== */
  .cE .doc-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .cE .doc-head-l { display: flex; align-items: flex-start; gap: 16px; min-width: 0; }
  .cE .doc-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .cE .doc-ic.pdf  { background: #FFF0F1; color: #E0445A; }
  .cE .doc-ic.xls  { background: var(--c-in-bg);   color: var(--c-in); }
  .cE .doc-ic.link { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .doc-ic.img  { background: var(--c-surg-bg); color: var(--c-surg); }
  .cE .doc-top-row { display: flex; align-items: center; gap: 8px; }
  .cE .doc-head h1 { margin: 10px 0 0; font-size: var(--fs-h1); font-weight: 800; line-height: 1.3; letter-spacing: -0.02em; color: var(--ink); }
  .cE .doc-meta { margin-top: 6px; font-size: var(--fs-option); color: var(--ink-3); }
  .cE .doc-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .cE .doc-back { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--r-pill); background: #fff; color: var(--ink-2); font-family: inherit; font-size: var(--fs-option); font-weight: 700; text-decoration: none; }
  .cE .doc-back:hover { background: var(--bg-soft); border-color: var(--line-strong); }

  .cE .lib-type-badge { flex: none; display: inline-block; min-width: 0; box-sizing: border-box; padding: 4px 10px; border-radius: var(--r-pill); font-size: var(--fs-option); line-height: 1.4; font-weight: 700; text-align: center; }
  .cE .lib-type-badge.pdf  { background: #FFF0F1; color: #E0445A; }
  .cE .lib-type-badge.xls  { background: var(--c-in-bg);   color: var(--c-in); }
  .cE .lib-type-badge.link { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .lib-type-badge.img  { background: var(--c-surg-bg); color: var(--c-surg); }
  .cE .lib-new-badge { flex: none; padding: 1px 6px; border-radius: 4px; background: var(--brand-pale); color: var(--brand-deep); font-size: var(--fs-option); line-height: 1.4; font-weight: 800; }

  /* ===== 미리보기 패널 ===== */
  .cE .card-pad { background: #fff; }
  .cE .doc-preview-img { width: 100%; border-radius: var(--r-md); display: block; }
  .cE .doc-preview-blank { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 20px; border-radius: var(--r-md); text-align: center; }
  .cE .doc-preview-blank .pv-ic { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; }
  .cE .doc-preview-blank .pv-ic.pdf  { background: #FFF0F1; color: #E0445A; }
  .cE .doc-preview-blank .pv-ic.xls  { background: var(--c-in-bg);   color: var(--c-in); }
  .cE .doc-preview-blank .pv-ic.link { background: var(--brand-pale); color: var(--brand-deep); }
  .cE .doc-preview-blank .pv-ic.img  { background: var(--c-surg-bg); color: var(--c-surg); }
  .cE .doc-preview-blank p { margin: 0; font-size: var(--fs-body); font-weight: 600; color: var(--ink-2); }
  .cE .doc-preview-blank p.sub { font-size: var(--fs-option); font-weight: 500; color: var(--ink-3); }

  @media (max-width: 960px) {
    .cE .doc-head h1 { font-size: var(--fs-h2); }
  }
  @media (max-width: 640px) {
    .layout { min-width: 0; }
    .cE .doc-head { flex-direction: column; }
    .cE .doc-actions { width: 100%; }
    .cE .doc-actions .smart-cta { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">
    <div>

      <!-- 경로 -->
      <nav aria-label="현재 위치" class="lib-crumbs" id="crumbs"></nav>

      <!-- 문서 헤더 -->
      <div class="doc-head">
        <div class="doc-head-l">
          <span id="doc-ic" class="doc-ic" aria-hidden="true">
            <svg class="ic-svg" width="22" height="22"><use href="#i-file"/></svg>
          </span>
          <div style="min-width: 0">
            <div class="doc-top-row">
              <span id="doc-badge" class="lib-type-badge"></span>
              <span id="doc-new" class="lib-new-badge" hidden>NEW</span>
            </div>
            <h1 id="doc-title"></h1>
            <div id="doc-meta" class="doc-meta"></div>
          </div>
        </div>
        <div class="doc-actions">
          <a id="doc-back" class="doc-back" href="detail.html">
            <svg class="ic-svg" width="16" height="16"><use href="#i-chevron-left"/></svg>목록으로
          </a>
          <a id="doc-download" class="smart-cta" href="#" download>
            <svg class="ic-svg" width="16" height="16"><use href="#i-download"/></svg>다운로드
          </a>
        </div>
      </div>

      <!-- 미리보기 -->
      <div class="card-pad" id="doc-preview"></div>

    </div>
  </main>
</div>
<div id="footer-host"></div>
</div>

<script src="../../components/layout.js"></script>
<script>injectShell('library');</script>
<script src="doc.js"></script>
</body>
</html>
