<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자료 상세 · BoBi</title>
<link rel="stylesheet" href="../../styles/tokens.css" />
<link rel="stylesheet" href="../../styles/concept-a.css" />
<link rel="stylesheet" href="../../styles/concept-e.css" />
<style>
  html, body { margin: 0; background: #fff; }
  .ic-svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* ===== 페이지 레이아웃 오버라이드 — GNB 좌측 고정, 콘텐츠 화면 센터 정렬 ===== */
  .layout { width: 100%; min-width: 1100px; }
  .cE { width: 100%; }
  .cE .emain { display: flex; flex-direction: column; align-items: center; }
  .cE .emain > * { width: 100%; max-width: 920px; margin-left: 0; margin-right: 0; }
  .ft { padding-left: calc(248px + 36px); padding-right: 36px; }
  .ft-inner { max-width: 1192px; margin: 0 auto; }

  /* ===== 뒤로가기 ===== */
  .cE .doc-backlink { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-option); font-weight: 600; color: var(--ink-3); text-decoration: none; margin-bottom: 18px; }
  .cE .doc-backlink:hover { color: var(--brand-deep); }

  /* ===== 문서 헤더 ===== */
  .cE .doc-head { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .cE .doc-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--bg-soft); color: var(--ink-3); }
  .cE .doc-head h1 { margin: 0; font-size: var(--fs-h1); font-weight: 800; line-height: 1.3; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .cE .doc-meta { margin-top: 6px; font-size: var(--fs-option); color: var(--ink-3); }
  .cE .lib-new-badge { flex: none; padding: 1px 6px; border-radius: 4px; background: var(--brand-pale); color: var(--brand-deep); font-size: var(--fs-option); line-height: 1.4; font-weight: 800; }

  /* ===== 첨부파일 (선 아래, 본문 위 — 0개면 자리 자체가 없고, 여러 개면 칩이 옆으로 늘어난다) ===== */
  .cE .doc-attachments { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
  .cE .doc-attach-item { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r-pill); background: #fff; font-size: var(--fs-option); font-weight: 700; color: var(--ink-2); text-decoration: none; }
  .cE .doc-attach-item:hover { border-color: var(--brand); color: var(--brand-deep); }
  .cE .doc-attach-item svg { color: var(--brand-deep); flex: none; }
  .cE .doc-attach-item .fn { min-width: 0; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== 미리보기 패널 ===== */

  /* ===== 본문 콘텐츠 (글 + 이미지 + 표) ===== */
  .cE .doc-body { display: flex; flex-direction: column; gap: 24px; }
  .cE .doc-body p { margin: 0; font-size: var(--fs-body); line-height: 1.5; color: var(--ink-2); }
  .cE .doc-body .blk-h { margin: 0; font-size: var(--fs-h2); font-weight: 700; line-height: 1.35; color: var(--ink); }
  .cE .doc-body .blk-sub { font-weight: 700; color: var(--ink); }
  .cE .doc-body .blk-fig { margin: 0; }
  .cE .doc-body .blk-img { width: 100%; border-radius: var(--r-md); display: block; box-shadow: var(--sh-1); }
  .cE .doc-body figcaption { margin-top: 8px; font-size: var(--fs-option); color: var(--ink-3); text-align: center; }
  .cE .doc-body .blk-table-wrap { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .cE .doc-body table { width: 100%; border-collapse: collapse; }
  .cE .doc-body th { background: var(--bg-soft); color: var(--ink-2); font-size: var(--fs-option); font-weight: 700; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .cE .doc-body td { font-size: var(--fs-body); color: var(--ink); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .cE .doc-body tr:last-child td { border-bottom: 0; }
  .cE .doc-body td.amt { text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 960px) {
    .cE .doc-head h1 { font-size: var(--fs-h2); }
  }
  @media (max-width: 640px) {
    .layout { min-width: 0; }
  }
</style>
</head>
<body>

<div id="icons-host"></div>

<div class="layout">
<div class="cA cE bobi">
  <div id="gnb-host"></div>

  <main class="emain">
    <div>

      <!-- 뒤로가기 -->
      <a id="doc-back" class="doc-backlink" href="detail.html">
        <svg class="ic-svg" width="15" height="15"><use href="#i-chevron-left"/></svg>뒤로가기
      </a>

      <!-- 문서 헤더 -->
      <div class="doc-head">
        <span id="doc-ic" class="doc-ic" aria-hidden="true">
          <svg class="ic-svg" width="22" height="22"><use href="#i-note"/></svg>
        </span>
        <div style="min-width: 0">
          <h1 id="doc-title"><span id="doc-title-text"></span><span id="doc-new" class="lib-new-badge" hidden>NEW</span></h1>
          <div id="doc-meta" class="doc-meta"></div>
        </div>
      </div>

      <!-- 첨부파일 (있을 때만, 0~N개) -->
      <div id="doc-attachments" class="doc-attachments" hidden></div>

      <!-- 미리보기 -->
      <div id="doc-preview"></div>

    </div>
  </main>
</div>
<div id="footer-host"></div>
</div>

<script src="../../components/layout.js"></script>
<script>injectShell('library');</script>
<script src="doc.js"></script>
</body>
</html>
