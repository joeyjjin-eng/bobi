<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECF0F5"/>
      <stop offset="100%" stop-color="#D6DDE5"/>
    </linearGradient>
    <filter id="sh3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg3)"/>

  <g transform="translate(32 26) rotate(-1 168 174)" filter="url(#sh3)">
    <rect x="0" y="0" width="336" height="358" rx="6" fill="#FDFCF8"/>

    <!-- 상단 -->
    <text x="24" y="30" font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#6B7280">약국 처방조제 영수증</text>
    <text x="312" y="30" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="8" fill="#9CA3AF">No. 20260810-1187</text>
    <line x1="24" y1="40" x2="312" y2="40" stroke="#111827" stroke-width="1"/>

    <!-- 약국명 -->
    <text x="168" y="66" text-anchor="middle" font-family="'Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#111827">온누리약국 서초점</text>
    <text x="168" y="82" text-anchor="middle" font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#6B7280">서울특별시 서초구 반포대로 45 · 02-535-1187</text>
    <line x1="24" y1="94" x2="312" y2="94" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- 정보 -->
    <text x="24" y="114" font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#6B7280">환자 <tspan font-weight="600" fill="#111827">홍길동</tspan></text>
    <text x="168" y="114" font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#6B7280">조제일 <tspan font-weight="600" fill="#111827">2026.08.10</tspan></text>
    <text x="24" y="128" font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#6B7280">처방의료기관 <tspan font-weight="600" fill="#111827">서울성모병원 정형외과</tspan></text>
    <text x="24" y="142" font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#6B7280">처방의사 <tspan font-weight="600" fill="#111827">이준혁</tspan></text>

    <!-- 표 -->
    <rect x="20" y="156" width="296" height="20" fill="#F5F7FA"/>
    <line x1="20" y1="156" x2="316" y2="156" stroke="#111827" stroke-width="0.6"/>
    <text x="30" y="170" font-family="'Malgun Gothic',sans-serif" font-size="9" font-weight="600" fill="#374151">약품명</text>
    <text x="200" y="170" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="9" font-weight="600" fill="#374151">1회량</text>
    <text x="240" y="170" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="9" font-weight="600" fill="#374151">일수</text>
    <text x="310" y="170" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="9" font-weight="600" fill="#374151">금액</text>

    <g font-family="'Malgun Gothic',sans-serif" font-size="9" fill="#4B5563">
      <text x="30" y="192">트리돌캡슐 50mg (트라마돌)</text>
      <text x="200" y="192" text-anchor="end">1C</text>
      <text x="240" y="192" text-anchor="end">7</text>
      <text x="310" y="192" text-anchor="end">3,430</text>

      <text x="30" y="208">에어탈정 100mg (아세클로페낙)</text>
      <text x="200" y="208" text-anchor="end">1T</text>
      <text x="240" y="208" text-anchor="end">7</text>
      <text x="310" y="208" text-anchor="end">2,562</text>

      <text x="30" y="224">알마겔정 (알마게이트)</text>
      <text x="200" y="224" text-anchor="end">1T</text>
      <text x="240" y="224" text-anchor="end">7</text>
      <text x="310" y="224" text-anchor="end">1,708</text>

      <text x="30" y="240">스토가정 10mg (라푸티딘)</text>
      <text x="200" y="240" text-anchor="end">1T</text>
      <text x="240" y="240" text-anchor="end">7</text>
      <text x="310" y="240" text-anchor="end">2,254</text>
    </g>

    <line x1="20" y1="256" x2="316" y2="256" stroke="#111827" stroke-width="0.6"/>

    <text x="30" y="278" font-family="'Malgun Gothic',sans-serif" font-size="10" fill="#6B7280">약제비 총액</text>
    <text x="310" y="278" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="10" fill="#111827">9,954원</text>
    <text x="30" y="294" font-family="'Malgun Gothic',sans-serif" font-size="10" fill="#6B7280">조제료</text>
    <text x="310" y="294" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="10" fill="#111827">4,290원</text>

    <line x1="20" y1="304" x2="316" y2="304" stroke="#E5E7EB"/>

    <text x="30" y="326" font-family="'Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#111827">본인부담금</text>
    <text x="310" y="326" text-anchor="end" font-family="'Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#111827">4,270원</text>

    <text x="24" y="346" font-family="'Malgun Gothic',sans-serif" font-size="8" fill="#9CA3AF">감사합니다. 다음 방문을 기다리겠습니다.</text>
  </g>
</svg>
